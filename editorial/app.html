<!doctype html>
<html lang="fi">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width,initial-scale=1,viewport-fit=cover"
    />
    <title>Capra Editorial Studio</title>
    <script src="../vendor/html2canvas.min.js"></script>
    <script src="../vendor/capra-image.js"></script>
    <style>
      :root {
        --o: #68724a;
        --g: #c8ae4d;
        --bg: #0d0e0c;
      }
      * {
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
      }
      html,
      body {
        margin: 0;
        background: #080907;
        color: #fff;
        font-family:
          -apple-system, BlinkMacSystemFont, Inter, Arial, sans-serif;
      }
      body {
        min-height: 100vh;
        min-height: 100svh;
        overflow: hidden;
      }
      button,
      input,
      textarea {
        font: inherit;
      }
      .app {
        height: 100vh;
        height: 100svh;
        display: flex;
        flex-direction: column;
        padding-top: env(safe-area-inset-top);
      }
      header {
        min-height: 60px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 0 10px;
        gap: 8px;
        background: #121410;
        border-bottom: 1px solid #30342b;
      }
      header a {
        color: #fff;
        text-decoration: none;
        font-size: 12px;
        font-weight: 900;
        min-height: 44px;
        display: inline-flex;
        align-items: center;
        flex: 0 0 auto;
      }
      header strong {
        font-size: 12px;
        min-width: 0;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .actions {
        display: flex;
        gap: 6px;
      }
      .btn {
        border: 1px solid #363b31;
        background: #20231d;
        color: #fff;
        border-radius: 10px;
        min-height: 44px;
        padding: 8px 11px;
        font-size: 11px;
        font-weight: 850;
      }
      .btn.gold {
        background: var(--g);
        border-color: var(--g);
        color: #111;
      }
      .work {
        flex: 1;
        min-height: 0;
        position: relative;
      }
      .viewport {
        height: 100%;
        overflow: auto;
        padding: 10px 8px 98px;
        display: flex;
        justify-content: center;
      }
      .shell {
        width: min(100%, 430px);
        aspect-ratio: 4/5;
        position: relative;
      }
      .canvas {
        position: absolute;
        width: 1080px;
        height: 1350px;
        left: 0;
        top: 0;
        transform-origin: 0 0;
        overflow: hidden;
        background: var(--bg);
        border-radius: 18px;
        box-shadow: 0 16px 48px #0009;
      }
      .photo {
        position: absolute;
        inset: 0;
        background-size: cover;
        background-position: center;
        filter: brightness(1) contrast(1.05) saturate(0.82);
        transform: scale(1.02);
      }
      .wash {
        position: absolute;
        inset: 0;
        background: linear-gradient(
          180deg,
          rgba(13, 14, 12, 0.08),
          rgba(13, 14, 12, 0.18) 55%,
          rgba(13, 14, 12, 0.78)
        );
      }
      .grain {
        position: absolute;
        inset: -20%;
        opacity: 0.08;
        background-image: repeating-radial-gradient(
          circle at 0 0,
          transparent 0 2px,
          #fff5 3px 4px
        );
        background-size: 9px 9px;
        pointer-events: none;
      }
      .brandLogo {
        position: absolute;
        left: 46px;
        top: 28px;
        width: 210px;
      }
      .brandLogo img {
        display: block;
        width: 100%;
        height: auto;
        object-fit: contain;
      }
      .kicker {
        position: absolute;
        left: 64px;
        bottom: 328px;
        color: var(--g);
        font-size: 20px;
        font-weight: 900;
        letter-spacing: 0.16em;
      }
      .title {
        position: absolute;
        left: 64px;
        bottom: 165px;
        width: 900px;
        font-size: 74px;
        line-height: 0.92;
        font-weight: 1000;
        letter-spacing: -0.045em;
        text-transform: uppercase;
      }
      .meta {
        position: absolute;
        left: 66px;
        bottom: 86px;
        font-size: 18px;
        color: #d1d1c9;
        letter-spacing: 0.06em;
      }
      .rule {
        position: absolute;
        right: 64px;
        top: 64px;
        width: 76px;
        height: 5px;
        background: var(--g);
      }
      .toolbar {
        position: absolute;
        left: 8px;
        right: 8px;
        bottom: calc(8px + env(safe-area-inset-bottom));
        height: 70px;
        background: #171915f8;
        border: 1px solid #30342b;
        border-radius: 19px;
        display: grid;
        grid-template-columns: repeat(5, 1fr);
        padding: 5px;
        z-index: 40;
      }
      .toolbar button {
        border: 0;
        background: transparent;
        color: #ddd;
        font-size: 10px;
        font-weight: 800;
        min-height: 44px;
        border-radius: 12px;
      }
      .sheet {
        display: none;
        position: absolute;
        left: 8px;
        right: 8px;
        bottom: calc(86px + env(safe-area-inset-bottom));
        max-height: 50dvh;
        overflow: auto;
        background: #171915fb;
        border: 1px solid #34382f;
        border-radius: 20px;
        padding: 14px;
        z-index: 39;
      }
      .sheet.open {
        display: block;
      }
      .sheet h3 {
        font-size: 11px;
        text-transform: uppercase;
        letter-spacing: 0.12em;
        color: #bbb;
        margin: 2px 0 10px;
      }
      .sheet label {
        display: block;
        font-size: 10px;
        color: #aaa;
        margin: 8px 0;
      }
      .sheet input,
      .sheet textarea {
        width: 100%;
        margin-top: 5px;
        background: #0f100e;
        color: #fff;
        border: 1px solid #383c33;
        border-radius: 10px;
        padding: 10px;
        min-height: 44px;
        font-size: 16px;
      }
      .sheet textarea {
        min-height: 68px;
      }
      .presetgrid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 7px;
      }
      .preset {
        border: 1px solid #3a3e35;
        background: #1b1e18;
        color: #fff;
        border-radius: 11px;
        min-height: 44px;
        padding: 11px;
        text-align: left;
        font-size: 11px;
        font-weight: 850;
      }
      .preview header,
      .preview .toolbar,
      .preview .sheet {
        display: none;
      }
      .preview .viewport {
        padding: 0;
        align-items: center;
        background: #000;
      }
      .preview .shell {
        width: min(100vw, 80svh);
      }
      .preview .canvas {
        border-radius: 0;
      }
      .uploadButton {
        display: flex;
        align-items: center;
        justify-content: center;
        width: 100%;
        min-height: 48px;
        margin: 4px 0 12px;
        border-radius: 12px;
        background: var(--g);
        color: #111;
        font-size: 13px;
        font-weight: 950;
        cursor: pointer;
      }
      .fileInput {
        position: fixed;
        width: 1px;
        height: 1px;
        opacity: 0;
        pointer-events: none;
      }
      .previewExit {
        display: none;
        position: fixed;
        top: calc(8px + env(safe-area-inset-top));
        left: 8px;
        z-index: 100;
        min-height: 44px;
        padding: 0 14px;
        border: 1px solid #ffffff4d;
        border-radius: 12px;
        background: #111d;
        color: #fff;
        font-size: 12px;
        font-weight: 900;
      }
      .app.preview .previewExit {
        display: block;
      }
    </style>
  </head>
  <body>
    <div class="app" id="app">
      <header>
        <a href="../">← Tools</a><strong>EDITORIAL STUDIO</strong>
        <div class="actions">
          <button class="btn" onclick="save()">Save</button
          ><button class="btn gold" id="pv" onclick="preview()">Preview</button>
        </div>
      </header>
      <div class="work">
        <div class="viewport">
          <div class="shell" id="shell">
            <div class="canvas" id="canvas">
              <div class="photo" id="photo"></div>
              <div class="wash"></div>
              <div class="grain" id="grain"></div>
              <div class="brandLogo">
                <img src="../assets/capra-logo-light.jpeg" alt="Capra Combat" />
              </div>
              <div class="rule"></div>
              <div class="kicker" id="kicker">TRAINING NOTES · 08/2026</div>
              <div class="title" id="title">
                TEKNIIKKA EI OLE LIIKE.<br />SE ON RATKAISU.
              </div>
              <div class="meta" id="meta">
                KUOPIO · BJJ / NO-GI · CAPRACOMBAT.FI
              </div>
            </div>
          </div>
        </div>
        <div class="sheet" id="sheet"></div>
        <div class="toolbar">
          <button onclick="imageS()">▧<br />Kuva</button
          ><button onclick="edit()">✎<br />Teksti</button
          ><button onclick="lightroom()">☼<br />Säädöt</button
          ><button onclick="presets()">◐<br />Preset</button
          ><button onclick="exportPng()">⇩<br />PNG</button>
        </div>
      </div>
      <button class="previewExit" type="button" onclick="preview(false)">
        ← MUOKKAA
      </button>
    </div>
    <input
      class="fileInput"
      id="file"
      type="file"
      accept="image/*,.heic,.heif"
    />
    <script>
      const app = document.getElementById("app"),
        shell = document.getElementById("shell"),
        canvas = document.getElementById("canvas"),
        sheet = document.getElementById("sheet"),
        photo = document.getElementById("photo"),
        fileInput = document.getElementById("file"),
        grainEl = document.getElementById("grain"),
        kickerEl = document.getElementById("kicker"),
        titleEl = document.getElementById("title"),
        metaEl = document.getElementById("meta"),
        previewButton = document.getElementById("pv");
      let vals = { br: 100, co: 105, sa: 82, gr: 8, zoom: 102, x: 50, y: 50 };
      let photoSource = "";

      function escapeHtml(value) {
        return String(value)
          .replaceAll("&", "&amp;")
          .replaceAll("<", "&lt;")
          .replaceAll(">", "&gt;");
      }

      function escapeAttribute(value) {
        return escapeHtml(value).replaceAll('"', "&quot;");
      }
      function fit() {
        const s = shell.clientWidth / 1080;
        canvas.style.transform = `scale(${s})`;
        shell.style.height = 1350 * s + "px";
      }
      addEventListener("resize", fit);
      fit();
      function openS(h) {
        sheet.innerHTML = h;
        sheet.classList.add("open");
      }
      function apply() {
        photo.style.filter = `brightness(${vals.br / 100}) contrast(${vals.co / 100}) saturate(${vals.sa / 100})`;
        photo.style.transform = `scale(${vals.zoom / 100})`;
        photo.style.transformOrigin = `${vals.x}% ${vals.y}%`;
        photo.style.backgroundPosition = `${vals.x}% ${vals.y}%`;
        photo.style.backgroundImage = photoSource
          ? `url("${photoSource}")`
          : "none";
        grainEl.style.opacity = vals.gr / 100;
      }
      function imageS() {
        openS(
          `<h3>Kuva</h3><label class="uploadButton" for="file">VAIHDA KUVA</label><label>Crop / zoom<input id="imageZoom" type="range" min="100" max="180" value="${vals.zoom}"></label><label>Vaakasijainti<input id="imageX" type="range" min="0" max="100" value="${vals.x}"></label><label>Pystysijainti<input id="imageY" type="range" min="0" max="100" value="${vals.y}"></label>`,
        );
        const imageZoom = document.getElementById("imageZoom");
        const imageX = document.getElementById("imageX");
        const imageY = document.getElementById("imageY");
        imageZoom.oninput = (event) => {
          vals.zoom = Number(event.target.value);
          apply();
        };
        imageX.oninput = (event) => {
          vals.x = Number(event.target.value);
          apply();
        };
        imageY.oninput = (event) => {
          vals.y = Number(event.target.value);
          apply();
        };
      }
      fileInput.onchange = async (event) => {
        const selected = event.target.files && event.target.files[0];
        if (!selected) return;
        try {
          photoSource = await CapraImage.read(selected, {
            maxDimension: 1600,
            quality: 0.82,
          });
          apply();
        } catch (error) {
          alert("Kuvaa ei voitu avata. Kokeile JPG- tai PNG-kuvaa.");
        } finally {
          event.target.value = "";
        }
      };
      function edit() {
        openS(
          `<h3>Tekstit</h3><label>Kicker<input id="editKicker" value="${escapeAttribute(kickerEl.textContent)}"></label><label>Otsikko<textarea id="editTitle">${escapeHtml(titleEl.innerText)}</textarea></label><label>Meta<input id="editMeta" value="${escapeAttribute(metaEl.textContent)}"></label>`,
        );
        const editKicker = document.getElementById("editKicker");
        const editTitle = document.getElementById("editTitle");
        const editMeta = document.getElementById("editMeta");
        editKicker.oninput = (event) =>
          (kickerEl.textContent = event.target.value);
        editTitle.oninput = (event) => (titleEl.innerText = event.target.value);
        editMeta.oninput = (event) => (metaEl.textContent = event.target.value);
      }
      function lightroom() {
        openS(
          `<h3>Kuvan säädöt</h3><label>Kirkkaus<input id="adjustBrightness" type="range" min="60" max="140" value="${vals.br}"></label><label>Kontrasti<input id="adjustContrast" type="range" min="70" max="160" value="${vals.co}"></label><label>Saturaatio<input id="adjustSaturation" type="range" min="0" max="160" value="${vals.sa}"></label><label>Film grain<input id="adjustGrain" type="range" min="0" max="30" value="${vals.gr}"></label>`,
        );
        const adjustBrightness = document.getElementById("adjustBrightness");
        const adjustContrast = document.getElementById("adjustContrast");
        const adjustSaturation = document.getElementById("adjustSaturation");
        const adjustGrain = document.getElementById("adjustGrain");
        adjustBrightness.oninput = (event) => {
          vals.br = Number(event.target.value);
          apply();
        };
        adjustContrast.oninput = (event) => {
          vals.co = Number(event.target.value);
          apply();
        };
        adjustSaturation.oninput = (event) => {
          vals.sa = Number(event.target.value);
          apply();
        };
        adjustGrain.oninput = (event) => {
          vals.gr = Number(event.target.value);
          apply();
        };
      }
      const P = [
        ["Nordic", 96, 112, 72, 8],
        ["Clean", 103, 103, 92, 2],
        ["Hard", 92, 138, 55, 12],
        ["Warm editorial", 101, 110, 86, 7],
      ];
      function presets() {
        openS(
          '<h3>Presetit</h3><div class="presetgrid">' +
            P.map(
              (x, i) =>
                `<button class="preset" onclick="useP(${i})">${x[0]}</button>`,
            ).join("") +
            "</div>",
        );
      }
      function useP(i) {
        const x = P[i];
        vals.br = x[1];
        vals.co = x[2];
        vals.sa = x[3];
        vals.gr = x[4];
        apply();
        sheet.classList.remove("open");
      }
      async function exportPng() {
        sheet.classList.remove("open");
        try {
          const c = await html2canvas(canvas, {
            scale: 1,
            width: 1080,
            height: 1350,
            useCORS: true,
            backgroundColor: null,
            onclone: (clone) => {
              const cloneCanvas = clone.getElementById("canvas");
              cloneCanvas.style.transform = "none";
              cloneCanvas.style.borderRadius = "0";
              cloneCanvas.style.boxShadow = "none";
            },
          });
          const a = document.createElement("a");
          a.download = "capra-editorial.png";
          a.href = c.toDataURL("image/png");
          a.click();
        } catch (e) {
          alert("PNG-vienti epäonnistui");
        }
      }
      function preview(force) {
        const next =
          typeof force === "boolean"
            ? force
            : !app.classList.contains("preview");
        app.classList.toggle("preview", next);
        sheet.classList.remove("open");
        previewButton.textContent = app.classList.contains("preview")
          ? "Muokkaa"
          : "Preview";
        setTimeout(fit, 40);
      }
      function save() {
        const project = JSON.stringify({
          version: 2,
          k: kickerEl.textContent,
          t: titleEl.innerText,
          m: metaEl.textContent,
          v: vals,
          photoSource,
        });
        if (CapraImage.persist("editorialProjectV2", project)) {
          alert("Projekti tallennettu");
        } else {
          alert(
            "Projekti on liian suuri selaimen tallennustilaan. Pienennä kuvaa ja yritä uudelleen.",
          );
        }
      }
      const savedProject = localStorage.getItem("editorialProjectV2");
      if (savedProject) {
        try {
          const restored = JSON.parse(savedProject);
          kickerEl.textContent = restored.k;
          titleEl.innerText = restored.t;
          metaEl.textContent = restored.m;
          if (restored.v) vals = { ...vals, ...restored.v };
          if (typeof restored.photoSource === "string") {
            photoSource = restored.photoSource;
          }
        } catch (error) {
          console.warn("Tallennettua projektia ei voitu avata", error);
        }
      } else {
        const legacyPhoto = localStorage.getItem("editorialPhoto");
        const legacyState = localStorage.getItem("editorialState");
        if (legacyPhoto) photoSource = legacyPhoto;
        if (legacyState) {
          try {
            const restored = JSON.parse(legacyState);
            kickerEl.textContent = restored.k;
            titleEl.innerText = restored.t;
            metaEl.textContent = restored.m;
            if (restored.v) vals = { ...vals, ...restored.v };
          } catch (error) {
            console.warn("Vanhaa projektia ei voitu avata", error);
          }
        }
      }
      apply();
    </script>
  </body>
</html>

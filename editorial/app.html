<!doctype html><html lang="fi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><title>Capra Editorial Studio</title><script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script><style>:root{--o:#68724a;--g:#c8ae4d;--bg:#0d0e0c}*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;background:#080907;color:#fff;font-family:-apple-system,BlinkMacSystemFont,Inter,Arial,sans-serif}body{height:100dvh;overflow:hidden}button,input,textarea{font:inherit}.app{height:100dvh;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top)}header{height:56px;display:flex;align-items:center;justify-content:space-between;padding:0 10px;background:#121410;border-bottom:1px solid #30342b}header a{color:#fff;text-decoration:none;font-size:12px;font-weight:900}header strong{font-size:12px}.actions{display:flex;gap:6px}.btn{border:1px solid #363b31;background:#20231d;color:#fff;border-radius:10px;padding:8px 9px;font-size:11px;font-weight:850}.btn.gold{background:var(--g);border-color:var(--g);color:#111}.work{flex:1;min-height:0;position:relative}.viewport{height:100%;overflow:auto;padding:10px 8px 98px;display:flex;justify-content:center}.shell{width:min(100%,430px);aspect-ratio:4/5;position:relative}.canvas{position:absolute;width:1080px;height:1350px;left:0;top:0;transform-origin:0 0;overflow:hidden;background:var(--bg);border-radius:18px;box-shadow:0 16px 48px #0009}.photo{position:absolute;inset:0;background-size:cover;background-position:center;filter:brightness(1) contrast(1.05) saturate(.82);transform:scale(1.02)}.wash{position:absolute;inset:0;background:linear-gradient(180deg,rgba(13,14,12,.08),rgba(13,14,12,.18) 55%,rgba(13,14,12,.78))}.grain{position:absolute;inset:-20%;opacity:.08;background-image:repeating-radial-gradient(circle at 0 0,transparent 0 2px,#fff5 3px 4px);background-size:9px 9px;pointer-events:none}.brand{position:absolute;left:64px;top:58px;font-size:18px;font-weight:1000;letter-spacing:.16em}.kicker{position:absolute;left:64px;bottom:328px;color:var(--g);font-size:20px;font-weight:900;letter-spacing:.16em}.title{position:absolute;left:64px;bottom:165px;width:900px;font-size:74px;line-height:.92;font-weight:1000;letter-spacing:-.045em;text-transform:uppercase}.meta{position:absolute;left:66px;bottom:86px;font-size:18px;color:#d1d1c9;letter-spacing:.06em}.rule{position:absolute;right:64px;top:64px;width:76px;height:5px;background:var(--g)}.toolbar{position:absolute;left:8px;right:8px;bottom:calc(8px + env(safe-area-inset-bottom));height:70px;background:#171915f8;border:1px solid #30342b;border-radius:19px;display:grid;grid-template-columns:repeat(5,1fr);padding:5px;z-index:40}.toolbar button{border:0;background:transparent;color:#ddd;font-size:10px;font-weight:800}.sheet{display:none;position:absolute;left:8px;right:8px;bottom:calc(86px + env(safe-area-inset-bottom));max-height:50dvh;overflow:auto;background:#171915fb;border:1px solid #34382f;border-radius:20px;padding:14px;z-index:39}.sheet.open{display:block}.sheet h3{font-size:11px;text-transform:uppercase;letter-spacing:.12em;color:#bbb;margin:2px 0 10px}.sheet label{display:block;font-size:10px;color:#aaa;margin:8px 0}.sheet input,.sheet textarea{width:100%;margin-top:5px;background:#0f100e;color:#fff;border:1px solid #383c33;border-radius:10px;padding:10px}.sheet textarea{min-height:68px}.presetgrid{display:grid;grid-template-columns:1fr 1fr;gap:7px}.preset{border:1px solid #3a3e35;background:#1b1e18;color:#fff;border-radius:11px;padding:11px;text-align:left;font-size:11px;font-weight:850}.preview header,.preview .toolbar,.preview .sheet{display:none}.preview .viewport{padding:0;align-items:center;background:#000}.preview .shell{width:100vw}.preview .canvas{border-radius:0}</style></head><body><div class="app" id="app"><header><a href="../">← Tools</a><strong>EDITORIAL STUDIO</strong><div class="actions"><button class="btn" onclick="save()">Save</button><button class="btn gold" id="pv" onclick="preview()">Preview</button></div></header><div class="work"><div class="viewport"><div class="shell" id="shell"><div class="canvas" id="canvas"><div class="photo" id="photo"></div><div class="wash"></div><div class="grain" id="grain"></div><div class="brand">CAPRA COMBAT</div><div class="rule"></div><div class="kicker" id="kicker">TRAINING NOTES · 08/2026</div><div class="title" id="title">TEKNIIKKA EI OLE LIIKE.<br>SE ON RATKAISU.</div><div class="meta" id="meta">KUOPIO · BJJ / NO-GI · CAPRACOMBAT.FI</div></div></div></div><div class="sheet" id="sheet"></div><div class="toolbar"><button onclick="imageS()">▧<br>Kuva</button><button onclick="edit()">✎<br>Teksti</button><button onclick="lightroom()">☼<br>Säädöt</button><button onclick="presets()">◐<br>Preset</button><button onclick="exportPng()">⇩<br>PNG</button></div></div></div><input id="file" type="file" accept="image/*" hidden><script>const app=document.getElementById('app'),shell=document.getElementById('shell'),canvas=document.getElementById('canvas'),sheet=document.getElementById('sheet'),photo=document.getElementById('photo');let vals={br:100,co:105,sa:82,gr:8,zoom:102,y:50};function fit(){const s=shell.clientWidth/1080;canvas.style.transform=`scale(${s})`;shell.style.height=1350*s+'px'}addEventListener('resize',fit);fit();function openS(h){sheet.innerHTML=h;sheet.classList.add('open')}function apply(){photo.style.filter=`brightness(${vals.br/100}) contrast(${vals.co/100}) saturate(${vals.sa/100})`;photo.style.transform=`scale(${vals.zoom/100})`;photo.style.backgroundPosition=`50% ${vals.y}%`;grain.style.opacity=vals.gr/100}function imageS(){openS('<h3>Kuva</h3><button class="btn gold" onclick="file.click()">Valitse kuva iPhonesta</button><label>Crop / zoom<input id="z" type="range" min="100" max="150" value="'+vals.zoom+'"></label><label>Pystysijainti<input id="yy" type="range" min="0" max="100" value="'+vals.y+'"></label>');z.oninput=e=>{vals.zoom=+e.target.value;apply()};yy.oninput=e=>{vals.y=+e.target.value;apply()}}file.onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{photo.style.backgroundImage=`url("${r.result}")`;localStorage.setItem('editorialPhoto',r.result)};r.readAsDataURL(f)};function edit(){openS(`<h3>Tekstit</h3><label>Kicker<input id="a" value="${kicker.textContent}"></label><label>Otsikko<textarea id="b">${title.innerText}</textarea></label><label>Meta<input id="c" value="${meta.textContent}"></label>`);a.oninput=e=>kicker.textContent=e.target.value;b.oninput=e=>title.innerText=e.target.value;c.oninput=e=>meta.textContent=e.target.value}function lightroom(){openS(`<h3>Kuvan säädöt</h3><label>Kirkkaus<input id="br" type="range" min="60" max="140" value="${vals.br}"></label><label>Kontrasti<input id="co" type="range" min="70" max="160" value="${vals.co}"></label><label>Saturaatio<input id="sa" type="range" min="0" max="160" value="${vals.sa}"></label><label>Film grain<input id="gr" type="range" min="0" max="30" value="${vals.gr}"></label>`);br.oninput=e=>{vals.br=+e.target.value;apply()};co.oninput=e=>{vals.co=+e.target.value;apply()};sa.oninput=e=>{vals.sa=+e.target.value;apply()};gr.oninput=e=>{vals.gr=+e.target.value;apply()}}const P=[['Nordic',96,112,72,8],['Clean',103,103,92,2],['Hard',92,138,55,12],['Warm editorial',101,110,86,7]];function presets(){openS('<h3>Presetit</h3><div class="presetgrid">'+P.map((x,i)=>`<button class="preset" onclick="useP(${i})">${x[0]}</button>`).join('')+'</div>')}function useP(i){const x=P[i];vals.br=x[1];vals.co=x[2];vals.sa=x[3];vals.gr=x[4];apply();sheet.classList.remove('open')}async function exportPng(){sheet.classList.remove('open');try{const c=await html2canvas(canvas,{scale:1,width:1080,height:1350,useCORS:true});const a=document.createElement('a');a.download='capra-editorial.png';a.href=c.toDataURL('image/png');a.click()}catch(e){alert('PNG-vienti epäonnistui')}}function preview(){app.classList.toggle('preview');sheet.classList.remove('open');pv.textContent=app.classList.contains('preview')?'Muokkaa':'Preview';setTimeout(fit,40)}function save(){localStorage.setItem('editorialState',JSON.stringify({k:kicker.textContent,t:title.innerText,m:meta.textContent,v:vals}));alert('Tallennettu')}const ph=localStorage.getItem('editorialPhoto');if(ph)photo.style.backgroundImage=`url("${ph}")`;const s=localStorage.getItem('editorialState');if(s){try{const x=JSON.parse(s);kicker.textContent=x.k;title.innerText=x.t;meta.textContent=x.m;vals=x.v||vals;apply()}catch(e){}}apply();</script></body></html>

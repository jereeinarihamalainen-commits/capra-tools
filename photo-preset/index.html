<!doctype html><html lang="fi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#11130f"><title>Capra Photo Preset Tool</title><style>:root{--bg:#0f110e;--panel:#171a15;--text:#f2f1ea;--muted:#a9ae9f;--olive:#68724a;--ochre:#c8ae4d;--line:#2b3026}*{box-sizing:border-box}body{margin:0;background:linear-gradient(180deg,#0d0f0c,#131611);color:var(--text);font-family:Inter,-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",sans-serif}button,input,select{font:inherit}.app{max-width:980px;margin:auto;padding:env(safe-area-inset-top) 14px calc(24px + env(safe-area-inset-bottom))}header{display:flex;align-items:center;justify-content:space-between;padding:16px 2px 10px;gap:12px}.brand{display:flex;align-items:center;gap:11px}.mark{width:38px;height:38px;border-radius:12px;background:linear-gradient(145deg,var(--olive),#3d462e);display:grid;place-items:center;font-weight:900}h1{font-size:18px;margin:0}.sub,.note{color:var(--muted);font-size:11px}.badge{border:1px solid var(--line);border-radius:999px;padding:7px 10px;color:var(--muted);font-size:11px}.grid{display:grid;grid-template-columns:minmax(0,1.45fr) minmax(300px,.75fr);gap:14px}.card{background:#171a15;border:1px solid var(--line);border-radius:18px;overflow:hidden}.viewer{position:relative;min-height:520px;background:#090a08;display:grid;place-items:center}canvas{display:block;max-width:100%;max-height:72vh;width:auto;height:auto}.empty{text-align:center;padding:38px}.empty strong{display:block;font-size:22px;margin-bottom:8px}.empty p{color:var(--muted)}.upload,.toolbar button,.ghost{display:inline-flex;border:1px solid var(--line);background:#1c2019;color:var(--text);padding:10px 12px;border-radius:10px;cursor:pointer}.upload{background:var(--text);color:#111;font-weight:800}.toolbar{display:flex;gap:8px;padding:10px;border-top:1px solid var(--line);background:#11140f;flex-wrap:wrap}.toolbar .primary{background:var(--ochre);color:#17150b;border-color:transparent;font-weight:900}.panel{padding:14px}.section{padding:12px 0;border-bottom:1px solid var(--line)}.section h2{font-size:12px;letter-spacing:.12em;text-transform:uppercase;margin:0 0 10px}.presets{display:grid;grid-template-columns:1fr 1fr;gap:8px}.preset{border:1px solid var(--line);background:#131610;color:var(--text);border-radius:12px;text-align:left;padding:10px;cursor:pointer}.preset b{font-size:13px;display:block}.preset span{font-size:10px;color:var(--muted)}.preset.active{border-color:var(--ochre)}.row{display:grid;grid-template-columns:94px 1fr 44px;align-items:center;gap:8px;margin:10px 0}.row label{font-size:12px}.row output{font-size:11px;color:var(--muted);text-align:right}input[type=range]{width:100%;accent-color:var(--ochre)}.compare{position:absolute;top:12px;right:12px;z-index:2;background:#0009;color:#fff;border:1px solid #ffffff28;border-radius:999px;padding:8px 10px}.file-input{display:none}.export-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}select{width:100%;background:#11140f;border:1px solid var(--line);color:var(--text);border-radius:10px;padding:10px}@media(max-width:820px){.grid{grid-template-columns:1fr}.viewer{min-height:420px}.card.viewer-card{position:sticky;top:0;z-index:5}canvas{max-height:55vh}}</style></head><body><div class="app"><header><div class="brand"><div class="mark">C</div><div><h1>CAPRA PHOTO PRESET TOOL</h1><div class="sub">Nordic fight photography · mobile first</div></div></div><div class="badge">LOCAL · kuva ei poistu laitteelta</div></header><div class="grid"><div class="card viewer-card"><div class="viewer"><button class="compare" id="compareBtn" style="display:none">Pidä pohjassa: BEFORE</button><canvas id="canvas" style="display:none"></canvas><div class="empty" id="empty"><strong>Lisää kuva</strong><p>Valitse kuva iPhonen Kuvista. Kaikki käsittely tehdään selaimessa paikallisesti.</p><label class="upload" for="file">Valitse kuva</label></div></div><div class="toolbar"><label class="ghost" for="file">Vaihda kuva</label><button id="resetBtn">Nollaa säädöt</button><button class="primary" id="saveBtn">Tallenna kuva</button></div></div><div class="card"><div class="panel"><div class="section"><h2>Presetit</h2><div class="presets" id="presetList"></div></div><div class="section"><h2>Hienosäätö</h2><div id="controls"></div></div><div class="section"><h2>Vienti</h2><div class="export-grid"><select id="format"><option value="image/jpeg">JPEG</option><option value="image/png">PNG</option></select><select id="quality"><option value="0.95">95%</option><option value="0.9" selected>90%</option><option value="0.82">82%</option></select></div><p class="note">Presetit ovat Capralle tehtyjä tyylireseptejä.</p></div></div></div></div><input id="file" class="file-input" type="file" accept="image/*"></div><script>const $=s=>document.querySelector(s),canvas=$('#canvas'),ctx=canvas.getContext('2d',{willReadFrequently:true});let originalBitmap=null,originalData=null,currentPreset='capra_documentary';const presets=[{id:'capra_documentary',name:'CAPRA Documentary',desc:'Kontrasti, viileä varjo, luonnollinen iho',v:{exp:0,con:14,sat:-8,warm:-4,tint:1,fade:6,grain:8,vign:12,black:-5,high:-10,sharp:8}},{id:'capra_fight',name:'CAPRA Fight Night',desc:'Kova kontrasti, syvät mustat',v:{exp:-2,con:28,sat:-12,warm:-2,tint:2,fade:0,grain:13,vign:22,black:-18,high:-18,sharp:15}},{id:'capra_nordic',name:'CAPRA Nordic',desc:'Puhdas, viileä, hillitty',v:{exp:3,con:9,sat:-18,warm:-10,tint:-2,fade:8,grain:5,vign:8,black:-2,high:-12,sharp:7}},{id:'capra_bw',name:'CAPRA B&W',desc:'Rosoisa mustavalkoinen',v:{exp:0,con:32,sat:-100,warm:0,tint:0,fade:5,grain:18,vign:18,black:-14,high:-10,sharp:18}},{id:'kodak_vintage',name:'Kodak Film Vintage',desc:'Lämmin filmi, pehmeät highlightit',v:{exp:2,con:-2,sat:-3,warm:16,tint:4,fade:15,grain:19,vign:10,black:7,high:-26,sharp:-3}},{id:'vintage_flash',name:'Vintage Flash',desc:'90s/00s party camera',v:{exp:10,con:20,sat:8,warm:-3,tint:8,fade:4,grain:16,vign:15,black:-8,high:10,sharp:13}},{id:'jp_digicam',name:'2000s Japanese Street',desc:'Kylmähkö flash digicam',v:{exp:7,con:18,sat:22,warm:-10,tint:5,fade:1,grain:7,vign:7,black:-6,high:14,sharp:22}},{id:'film_soft',name:'Film Soft',desc:'Pehmeä everyday film',v:{exp:4,con:-8,sat:-7,warm:9,tint:2,fade:18,grain:12,vign:7,black:10,high:-20,sharp:-8}}];const defs=[['exp','Valotus',-40,40],['con','Kontrasti',-50,50],['sat','Saturaatio',-100,60],['warm','Lämpö',-40,40],['tint','Tint',-30,30],['high','Highlight',-50,50],['black','Mustat',-40,40],['fade','Fade',0,40],['grain','Grain',0,40],['vign','Vignette',0,45],['sharp','Terävyys',-20,30]];let values={...presets[0].v};function buildUI(){presets.forEach(p=>{let b=document.createElement('button');b.className='preset';b.dataset.id=p.id;b.innerHTML=`<b>${p.name}</b><span>${p.desc}</span>`;b.onclick=()=>applyPreset(p.id);$('#presetList').appendChild(b)});defs.forEach(([id,label,min,max])=>{let r=document.createElement('div');r.className='row';r.innerHTML=`<label>${label}</label><input id="r_${id}" type="range" min="${min}" max="${max}" step="1"><output id="o_${id}">0</output>`;$('#controls').appendChild(r);r.querySelector('input').oninput=e=>{values[id]=+e.target.value;$('#o_'+id).value=e.target.value;render()}});applyPreset(currentPreset,false)}function applyPreset(id,rr=true){currentPreset=id;values={...presets.find(x=>x.id===id).v};document.querySelectorAll('.preset').forEach(x=>x.classList.toggle('active',x.dataset.id===id));defs.forEach(([k])=>{$('#r_'+k).value=values[k];$('#o_'+k).value=values[k]});if(rr)render()}const clamp=v=>Math.max(0,Math.min(255,v));function render(){if(!originalData)return;const d=new ImageData(new Uint8ClampedArray(originalData.data),originalData.width,originalData.height),a=d.data,v=values,em=Math.pow(2,v.exp/50),cf=(259*(v.con+255))/(255*(259-v.con));for(let i=0;i<a.length;i+=4){let r=a[i]*em,g=a[i+1]*em,b=a[i+2]*em;r=cf*(r-128)+128;g=cf*(g-128)+128;b=cf*(b-128)+128;let lum=.299*r+.587*g+.114*b,s=1+v.sat/100;r=lum+(r-lum)*s;g=lum+(g-lum)*s;b=lum+(b-lum)*s;r+=v.warm*1.15+v.tint*.55;b-=v.warm+v.tint*.2;g-=v.tint*.55;let l=(r+g+b)/3,h=v.high/100*70*Math.max(0,(l-128)/127),bk=v.black/100*70*Math.max(0,(128-l)/128);r+=h+bk;g+=h+bk;b+=h+bk;let f=v.fade/100;r=r*(1-f)+28*f;g=g*(1-f)+30*f;b=b*(1-f)+27*f;a[i]=clamp(r);a[i+1]=clamp(g);a[i+2]=clamp(b)}ctx.putImageData(d,0,0);if(v.vign){let gr=ctx.createRadialGradient(canvas.width/2,canvas.height/2,Math.min(canvas.width,canvas.height)*.18,canvas.width/2,canvas.height/2,Math.max(canvas.width,canvas.height)*.7);gr.addColorStop(0,'rgba(0,0,0,0)');gr.addColorStop(1,`rgba(0,0,0,${v.vign/100*.7})`);ctx.fillStyle=gr;ctx.fillRect(0,0,canvas.width,canvas.height)}if(v.grain){let im=ctx.getImageData(0,0,canvas.width,canvas.height),dd=im.data,amp=v.grain*.8;for(let i=0;i<dd.length;i+=4){let n=(Math.random()-.5)*amp;dd[i]=clamp(dd[i]+n);dd[i+1]=clamp(dd[i+1]+n);dd[i+2]=clamp(dd[i+2]+n)}ctx.putImageData(im,0,0)}}$('#file').onchange=async e=>{let f=e.target.files[0];if(!f)return;originalBitmap=await createImageBitmap(f);let sc=Math.min(1,2400/Math.max(originalBitmap.width,originalBitmap.height));canvas.width=Math.round(originalBitmap.width*sc);canvas.height=Math.round(originalBitmap.height*sc);ctx.drawImage(originalBitmap,0,0,canvas.width,canvas.height);originalData=ctx.getImageData(0,0,canvas.width,canvas.height);$('#empty').style.display='none';canvas.style.display='block';$('#compareBtn').style.display='block';render()};$('#resetBtn').onclick=()=>applyPreset(currentPreset);function showOriginal(on){if(!originalData)return;if(on)ctx.putImageData(originalData,0,0);else render()}['pointerdown','touchstart'].forEach(ev=>$('#compareBtn').addEventListener(ev,e=>{e.preventDefault();showOriginal(true)}));['pointerup','pointercancel','pointerleave','touchend'].forEach(ev=>$('#compareBtn').addEventListener(ev,e=>{e.preventDefault();showOriginal(false)}));$('#saveBtn').onclick=()=>{if(!originalData)return;render();let fmt=$('#format').value,q=+$('#quality').value,ext=fmt==='image/png'?'png':'jpg';canvas.toBlob(blob=>{let a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=`capra-${currentPreset}-${Date.now()}.${ext}`;a.click()},fmt,q)};buildUI();</script></body></html>

<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Capra Carousel</title><body style="margin:0;background:#0b0d0d;color:white;font-family:system-ui;padding:24px">Ladataan Capra Carousel…<script>(async()=>{const files=['parts/part-01.txt','parts/part-02.txt'];const html=(await Promise.all(files.map(f=>fetch(f).then(r=>{if(!r.ok)throw new Error(f+' ('+r.status+')');return r.text()})))).join('');document.open();document.write(html);document.close()})().catch(e=>document.body.textContent='Lataus epäonnistui: '+e.message)</script>

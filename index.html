<!doctype html>
<html lang="fi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0b0c0a">
<title>Capra Combat Studio</title>
<style>
:root{--olive:#68724a;--ochre:#c8ae4d;--dark:#11120f;--paper:#f1eee6;--panel:#171915;--line:#30342b}*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;background:#080907;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display",Inter,Arial,sans-serif}body{height:100dvh;overflow:hidden}button,input,textarea,select{font:inherit}button{border:1px solid var(--line);background:#20231d;color:#fff;border-radius:12px;font-weight:800;padding:10px 12px}.app{height:100dvh;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top)}header{height:58px;flex:0 0 58px;display:flex;align-items:center;justify-content:space-between;padding:0 11px;background:rgba(12,13,11,.96);border-bottom:1px solid #2d3029;backdrop-filter:blur(18px);z-index:50}.brand{display:flex;align-items:center;gap:8px;font-size:12px;font-weight:1000;letter-spacing:.06em}.mark{width:35px;height:35px;border-radius:9px;background:#111;display:grid;place-items:center;border:1px solid #2e312a;font-size:10px;color:var(--ochre)}.topactions{display:flex;gap:6px}.topactions button{padding:8px 9px;font-size:11px}.goldBtn{background:var(--ochre)!important;color:#111!important;border-color:var(--ochre)!important}.work{position:relative;flex:1;min-height:0;overflow:hidden}.viewport{height:100%;overflow:auto;padding:10px 8px 94px;display:flex;justify-content:center}.shell{width:min(100%,430px);aspect-ratio:4/5;position:relative;flex:none}.stage{position:absolute;left:0;top:0;width:1080px;height:1350px;transform-origin:0 0;overflow:hidden;background:var(--dark);border-radius:18px;box-shadow:0 16px 45px #0008}.bg{position:absolute;inset:0;background-size:cover;background-position:center;opacity:.64;transform:scale(1.03)}.overlay{position:absolute;inset:0;background:linear-gradient(180deg,#0002,#0006 50%,#000e)}.grid{position:absolute;inset:-10%;opacity:.06;background:linear-gradient(#fff5 2px,transparent 2px),linear-gradient(90deg,#fff5 2px,transparent 2px);background-size:80px 80px;transform:rotate(-4deg) scale(1.2)}.bar{position:absolute;width:680px;height:125px;left:-270px;top:440px;background:var(--olive);transform:rotate(-11deg);animation:bar 8s cubic-bezier(.7,0,.2,1) infinite}.bar.b2{width:600px;height:80px;left:760px;top:910px;background:var(--ochre);animation-delay:.45s}.frame{position:absolute;inset:58px;border:2px solid #ffffff22;pointer-events:none}.el{position:absolute;z-index:15;touch-action:none;user-select:none;transform-origin:center;cursor:move}.el.sel{outline:5px solid var(--ochre);outline-offset:8px}.handle{display:none;position:absolute;width:44px;height:44px;right:-26px;bottom:-26px;border-radius:50%;background:var(--ochre);border:7px solid #111}.el.sel>.handle{display:block}.logo{left:70px;top:58px;width:210px;min-height:125px;font-weight:1000}.logo .capra{font-size:54px;line-height:.92;letter-spacing:.06em}.logo .combat{font-size:24px;color:#a9ad96;letter-spacing:.26em;margin-top:8px}.logo .line{width:72px;height:5px;background:var(--ochre);margin-top:9px}.eyebrow{left:70px;top:285px;background:var(--paper);color:#111;padding:13px 18px;font-size:27px;font-weight:1000;letter-spacing:.11em}.headline{left:70px;top:370px;width:900px;font-size:112px;line-height:.80;letter-spacing:-.065em;font-weight:1000}.gold{color:var(--ochre)}.sub{left:72px;top:755px;width:730px;font-size:32px;line-height:1.22;font-weight:650;color:#e0ddd5}.chips{left:70px;top:950px;display:flex;gap:13px;width:880px;flex-wrap:wrap}.chip{border:2px solid #ffffff55;padding:13px 17px;font-size:20px;font-weight:900;background:#0a0a0a88}.price{left:70px;top:1135px;font-size:55px;font-weight:1000}.price small{display:block;margin-top:12px;font-size:20px;color:#c3c4bc;letter-spacing:.05em}.cta{left:800px;top:1160px;font-size:25px;font-weight:1000;padding:20px 23px;background:var(--ochre);color:#111}.photo img{width:100%;height:100%;object-fit:cover;border-radius:18px;pointer-events:none}.fade{animation:fade 8s infinite}.slide{animation:slide 8s infinite}.pop{animation:pop 8s infinite}.rise{animation:rise 8s infinite}.paused *{animation-play-state:paused!important}.toolbar{position:absolute;left:8px;right:8px;bottom:calc(8px + env(safe-area-inset-bottom));height:72px;background:#171915f7;border:1px solid var(--line);border-radius:20px;display:grid;grid-template-columns:repeat(5,1fr);padding:6px;z-index:60;backdrop-filter:blur(20px)}.tool{border:0;background:transparent;padding:5px 2px;font-size:11px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px}.tool b{font-size:20px}.sheet{display:none;position:absolute;left:8px;right:8px;bottom:calc(88px + env(safe-area-inset-bottom));max-height:min(49dvh,470px);overflow:auto;background:#171915fb;border:1px solid var(--line);border-radius:22px;padding:15px;z-index:59;backdrop-filter:blur(22px)}.sheet.open{display:block}.sheet h3{margin:4px 0 12px;font-size:12px;text-transform:uppercase;letter-spacing:.12em;color:#d8dad1}.row{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:8px 0}label{display:block;font-size:11px;color:#adb1a6;margin:7px 0}input,textarea,select{width:100%;margin-top:5px;padding:11px;background:#0f100e;color:#fff;border:1px solid #393d34;border-radius:11px}textarea{min-height:68px}.note{font-size:11px;color:#94998f;line-height:1.4}.preview header,.preview .toolbar,.preview .sheet{display:none!important}.preview .viewport{padding:0;align-items:center;background:#000}.preview .shell{width:100vw;max-width:none}.preview .stage{border-radius:0;box-shadow:none}.safe:after{content:"";position:absolute;inset:70px;border:3px dashed #ffffff44;z-index:999;pointer-events:none;border-radius:24px}@keyframes fade{0%,18%{opacity:0}27%,76%{opacity:1}88%,100%{opacity:0}}@keyframes slide{0%,14%{opacity:0;transform:translateX(-80px)}24%,74%{opacity:1;transform:translateX(0)}86%,100%{opacity:0;transform:translateX(80px)}}@keyframes pop{0%,32%{opacity:0;transform:scale(.78)}42%,76%{opacity:1;transform:scale(1)}84%,100%{opacity:0;transform:scale(.85)}}@keyframes rise{0%,8%{opacity:0;transform:translateY(80px)}16%,70%{opacity:1;transform:translateY(0)}82%,100%{opacity:0;transform:translateY(-70px)}}@keyframes bar{0%{transform:translateX(-320px) rotate(-11deg)}20%,70%{transform:translateX(0) rotate(-11deg)}100%{transform:translateX(1500px) rotate(-11deg)}}
</style></head><body><div class="app" id="app"><header><div class="brand"><div class="mark">CC</div>CAPRA MOBILE STUDIO</div><div class="topactions"><button onclick="saveProject()">Tallenna</button><button class="goldBtn" id="previewBtn" onclick="previewMode()">Preview</button></div></header><div class="work"><div class="viewport"><div class="shell" id="shell"><div class="stage" id="stage"><div class="bg" id="bg"></div><div class="overlay"></div><div class="grid"></div><div class="bar"></div><div class="bar b2"></div><div class="frame"></div><div class="el logo fade" data-type="text"><div class="capra">CAPRA</div><div class="combat">COMBAT</div><div class="line"></div><div class="handle"></div></div><div class="el eyebrow slide" data-type="text">PERUSKURSSIT 2026<div class="handle"></div></div><div class="el headline rise" data-type="headline">ALOITA<br>KAMPPAILU<br><span class="gold">NYT.</span><div class="handle"></div></div><div class="el sub fade" data-type="text">Et tarvitse aiempaa kokemusta tai valmista kuntoa. Tule sellaisena kuin olet – me opetamme perusteet.<div class="handle"></div></div><div class="el chips fade" data-type="chips"><div class="chip">BJJ</div><div class="chip">LUKKOPAINI</div><div class="chip">VAPAAOTTELU</div><div class="chip">MUAY THAI / K1</div><div class="handle"></div></div><div class="el price fade" data-type="price">8 VKO · 120 €<small>Kurssit alkavat 31.8.–1.9. · capracombat.fi</small><div class="handle"></div></div><div class="el cta pop" data-type="text">ILMOITTAUDU<div class="handle"></div></div></div></div></div><div class="sheet" id="sheet"></div><div class="toolbar"><button class="tool" onclick="openText()"><b>✎</b>Teksti</button><button class="tool" onclick="openImages()"><b>▧</b>Kuva</button><button class="tool" onclick="openStyle()"><b>◐</b>Tyyli</button><button class="tool" onclick="openMotion()"><b>▶</b>Liike</button><button class="tool" onclick="openElement()"><b>↔</b>Elementti</button></div></div></div><input id="bgInput" type="file" accept="image/*" hidden><input id="photoInput" type="file" accept="image/*" hidden><input id="logoInput" type="file" accept="image/*" hidden>
<script>
const stage=document.getElementById('stage'),shell=document.getElementById('shell'),sheet=document.getElementById('sheet'),app=document.getElementById('app');let selected=null,drag=null,resizing=null,z=60;function fit(){const s=shell.clientWidth/1080;stage.style.transform=`scale(${s})`;shell.style.height=1350*s+'px'}addEventListener('resize',fit);fit();function sel(el){document.querySelectorAll('.el.sel').forEach(x=>x.classList.remove('sel'));selected=el;if(el)el.classList.add('sel')}stage.addEventListener('pointerdown',e=>{const el=e.target.closest('.el');if(!el){sel(null);return}sel(el);const sc=stage.getBoundingClientRect().width/1080;if(e.target.classList.contains('handle')){resizing={el,x:e.clientX,sc,s:+el.dataset.scale||1}}else drag={el,x:e.clientX,y:e.clientY,l:parseFloat(el.style.left)||parseFloat(getComputedStyle(el).left)||0,t:parseFloat(el.style.top)||parseFloat(getComputedStyle(el).top)||0,sc};el.setPointerCapture?.(e.pointerId);e.preventDefault()});stage.addEventListener('pointermove',e=>{if(drag){drag.el.style.left=drag.l+(e.clientX-drag.x)/drag.sc+'px';drag.el.style.top=drag.t+(e.clientY-drag.y)/drag.sc+'px'}if(resizing){let s=Math.max(.25,Math.min(3.5,resizing.s*(1+(e.clientX-resizing.x)/resizing.sc/260)));resizing.el.dataset.scale=s;const r=+resizing.el.dataset.rot||0;resizing.el.style.transform=`scale(${s}) rotate(${r}deg)`}});stage.addEventListener('pointerup',()=>{drag=null;resizing=null});function openSheet(html){sheet.innerHTML=html;sheet.classList.add('open')}function openText(){openSheet(`<h3>Tekstit</h3><label>Yläteksti<input id="ey" value="${document.querySelector('.eyebrow').childNodes[0].textContent.trim()}"></label><label>Otsikko<textarea id="hl">${document.querySelector('.headline').innerText.replace(/\n+/g,'\n').trim()}</textarea></label><label>Leipäteksti<textarea id="sb">${document.querySelector('.sub').childNodes[0].textContent.trim()}</textarea></label><div class="row"><label>Hinta<input id="pr" value="${document.querySelector('.price').childNodes[0].textContent.trim()}"></label><label>CTA<input id="ct" value="${document.querySelector('.cta').childNodes[0].textContent.trim()}"></label></div><label>Pieni rivi<input id="sm" value="${document.querySelector('.price small').textContent}"></label><div class="row"><button onclick="addText()">+ Teksti</button><button onclick="addChip()">+ Laji</button></div>`);ey.oninput=e=>document.querySelector('.eyebrow').childNodes[0].textContent=e.target.value;sb.oninput=e=>document.querySelector('.sub').childNodes[0].textContent=e.target.value;ct.oninput=e=>document.querySelector('.cta').childNodes[0].textContent=e.target.value;pr.oninput=e=>document.querySelector('.price').childNodes[0].textContent=e.target.value;sm.oninput=e=>document.querySelector('.price small').textContent=e.target.value;hl.oninput=e=>{const a=e.target.value.split('\n');const h='<div class="handle"></div>';document.querySelector('.headline').innerHTML=a.map((x,i)=>i===a.length-1?`<span class="gold">${esc(x)}</span>`:esc(x)).join('<br>')+h}}function openImages(){openSheet(`<h3>Kuvat ja logo</h3><button class="goldBtn" onclick="bgInput.click()">Vaihda taustakuva</button><div class="row"><button onclick="photoInput.click()">+ Kuvaelementti</button><button onclick="logoInput.click()">Vaihda logo kuvaan</button></div><label>Taustan peittävyys<input id="op" type="range" min="0" max="100" value="64"></label><p class="note">Voit valita kuvan suoraan iPhonen Kuvat- tai Tiedostot-valikosta. Jos haluat käyttää virallista Capra-logoa kuvana, valitse se “Vaihda logo kuvaan” -napista.</p>`);op.oninput=e=>bg.style.opacity=e.target.value/100}function openStyle(){openSheet(`<h3>Capra-tyyli</h3><div class="row"><label>Oliivi<input id="ol" type="color" value="#68724a"></label><label>Okra<input id="oc" type="color" value="#c8ae4d"></label></div><div class="row"><label>Tausta<input id="dk" type="color" value="#11120f"></label><button onclick="stage.classList.toggle('safe')">Safe area</button></div>`);ol.oninput=e=>document.documentElement.style.setProperty('--olive',e.target.value);oc.oninput=e=>document.documentElement.style.setProperty('--ochre',e.target.value);dk.oninput=e=>document.documentElement.style.setProperty('--dark',e.target.value)}function openMotion(){openSheet(`<h3>Animaatio</h3><select id="an"><option value="">Ei animaatiota</option><option value="fade">Fade</option><option value="slide">Slide</option><option value="pop">Pop</option><option value="rise">Nouseva</option></select><div class="row"><button onclick="stage.classList.toggle('paused')">Pause / Play</button><button onclick="restart()">Restart</button></div><p class="note">Valitse ensin mainoksesta elementti ja sitten animaatio.</p>`);an.onchange=e=>{if(!selected)return alert('Valitse elementti');['fade','slide','pop','rise'].forEach(c=>selected.classList.remove(c));if(e.target.value)selected.classList.add(e.target.value)}}function openElement(){if(!selected)return openSheet('<h3>Elementti</h3><p class="note">Napauta ensin mainoksesta tekstiä, logoa tai kuvaa.</p>');const s=selected.dataset.scale||1,r=selected.dataset.rot||0;openSheet(`<h3>Elementti</h3><div class="row"><label>Skaala<input id="es" type="number" step=".05" value="${s}"></label><label>Kierto<input id="er" type="number" value="${r}"></label></div><div class="row"><button onclick="selected.style.zIndex=++z">Eteen</button><button onclick="selected.style.zIndex=5">Taakse</button></div><button onclick="del()">Poista elementti</button>`);es.oninput=er.oninput=()=>{selected.dataset.scale=es.value;selected.dataset.rot=er.value;selected.style.transform=`scale(${es.value}) rotate(${er.value}deg)`}}function addText(){const e=document.createElement('div');e.className='el fade';e.dataset.type='text';e.style.cssText='left:160px;top:650px;width:620px;font-size:48px;font-weight:900;color:#fff;z-index:40';e.innerHTML='UUSI TEKSTI<div class="handle"></div>';stage.appendChild(e);sel(e)}function addChip(){const e=document.createElement('div');e.className='el chip fade';e.dataset.type='text';e.style.cssText='left:160px;top:900px;z-index:40';e.innerHTML='UUSI LAJI<div class="handle"></div>';stage.appendChild(e);sel(e)}function readImg(file,cb){const r=new FileReader();r.onload=()=>cb(r.result);r.readAsDataURL(file)}bgInput.onchange=e=>{const f=e.target.files[0];if(f)readImg(f,u=>{bg.style.backgroundImage=`url("${u}")`;localStorage.setItem('capraBg',u)})};photoInput.onchange=e=>{const f=e.target.files[0];if(!f)return;readImg(f,u=>{const x=document.createElement('div');x.className='el photo';x.dataset.type='image';x.style.cssText='left:300px;top:520px;width:360px;height:360px;z-index:40';x.innerHTML=`<img src="${u}"><div class="handle"></div>`;stage.appendChild(x);sel(x)})};logoInput.onchange=e=>{const f=e.target.files[0];if(!f)return;readImg(f,u=>{const l=document.querySelector('.logo');l.innerHTML=`<img src="${u}" style="width:100%;height:100%;object-fit:contain"><div class="handle"></div>`;l.style.width='220px';l.style.height='190px'})};function del(){if(!selected)return;selected.remove();selected=null;sheet.classList.remove('open')}function restart(){stage.style.display='none';void stage.offsetHeight;stage.style.display='block'}function previewMode(){app.classList.toggle('preview');sheet.classList.remove('open');sel(null);previewBtn.textContent=app.classList.contains('preview')?'Muokkaa':'Preview';setTimeout(fit,30)}function saveProject(){localStorage.setItem('capraProject',stage.innerHTML);alert('Projekti tallennettu tähän selaimeen')}function esc(s){return s.replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}const saved=localStorage.getItem('capraProject');if(saved)stage.innerHTML=saved;const sbg=localStorage.getItem('capraBg');if(sbg)bg.style.backgroundImage=`url("${sbg}")`;
</script></body></html>

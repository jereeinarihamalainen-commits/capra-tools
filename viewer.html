<!doctype html>
<html lang="fi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#0b0c0a">
  <title>Capra Tools</title>
  <style>
    * { box-sizing: border-box; }

    html,
    body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #080907;
      color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
    }

    .topbar {
      height: calc(56px + env(safe-area-inset-top));
      padding: env(safe-area-inset-top) 10px 0;
      display: flex;
      align-items: center;
      gap: 10px;
      background: #0e100d;
      border-bottom: 1px solid #2d3029;
    }

    .viewerLogo {
      width: 34px;
      flex: 0 0 34px;
    }

    .viewerLogo img {
      display: block;
      width: 100%;
      height: auto;
      object-fit: contain;
    }

    .topbar b {
      min-width: 0;
      overflow: hidden;
      font-size: 12px;
      letter-spacing: .06em;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .topbar a {
      min-height: 44px;
      margin-left: auto;
      display: inline-flex;
      align-items: center;
      color: #c8ae4d;
      font-size: 12px;
      font-weight: 800;
      text-decoration: none;
      white-space: nowrap;
    }

    iframe {
      display: block;
      width: 100%;
      height: calc(100dvh - 56px - env(safe-area-inset-top));
      border: 0;
      background: #0b0c0a;
    }
  </style>
</head>
<body>
  <div class="topbar">
    <div class="viewerLogo">
      <img src="assets/capra-logo.png?v=5" alt="Capra Combat">
    </div>
    <b>CAPRA TOOLS</b>
    <a href="./">← Työkalut</a>
  </div>
  <iframe id="appFrame" title="Capra Tools -generaattori"></iframe>
  <script>
    const app = new URLSearchParams(location.search).get('app');
    const frame = document.getElementById('appFrame');

    if (!app || app.includes('://') || app.startsWith('//')) {
      location.replace('./');
    } else {
      frame.src = app;
    }
  </script>
</body>
</html>

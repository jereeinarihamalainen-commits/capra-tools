<!doctype html><html lang="fi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0b0c0a"><title>Capra Tools</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#080907;font-family:-apple-system,BlinkMacSystemFont,system-ui;color:#fff}.top{height:50px;padding-top:env(safe-area-inset-top);display:flex;align-items:center;gap:9px;padding-left:10px;padding-right:10px;background:#0e100d;border-bottom:1px solid #2d3029}.top img{width:34px;height:34px;object-fit:contain}.top b{font-size:12px;letter-spacing:.06em}.top a{margin-left:auto;color:#c8ae4d;text-decoration:none;font-size:12px;font-weight:800}iframe{display:block;width:100%;height:calc(100dvh - 50px - env(safe-area-inset-top));border:0;background:#0b0c0a}</style></head><body><div class="top"><img src="assets/capra-logo.png"><b>CAPRA TOOLS</b><a href="./">← Työkalut</a></div><iframe id="f"></iframe><script>const p=new URLSearchParams(location.search),src=p.get('app');if(!src){location.href='./'}else{const f=document.getElementById('f');f.src=src;f.onload=()=>{try{const d=f.contentDocument;const l=d.createElement('link');l.rel='stylesheet';l.href='../mobile.css';d.head.appendChild(l);let vp=d.querySelector('meta[name=viewport]');if(vp)vp.content='width=device-width,initial-scale=1,viewport-fit=cover';else{vp=d.createElement('meta');vp.name='viewport';vp.content='width=device-width,initial-scale=1,viewport-fit=cover';d.head.appendChild(vp)}const logos=[...d.querySelectorAll('.logo')];logos.forEach(el=>{if(el.tagName==='CANVAS')return;if(el.querySelector('img')){el.querySelector('img').src='../assets/capra-logo.png'}else if(!el.closest('canvas')){el.innerHTML='<img src="../assets/capra-logo.png" style="width:100%;height:100%;object-fit:contain">'}})}catch(e){}}}</script></body></html>

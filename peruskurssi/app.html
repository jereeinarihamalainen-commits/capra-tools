<!doctype html><html lang="fi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><title>Capra Peruskurssi Carousel</title><script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script><style>:root{--o:#68724a;--g:#c8ae4d;--bg:#11120f;--fg:#f1eee6}*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;background:#090a08;color:#fff;font-family:-apple-system,BlinkMacSystemFont,Inter,Arial,sans-serif}body{height:100dvh;overflow:hidden}button,input,textarea{font:inherit}.app{height:100dvh;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top)}header{height:56px;display:flex;align-items:center;justify-content:space-between;padding:0 10px;background:#121410;border-bottom:1px solid #30342b}header a{color:#fff;text-decoration:none;font-size:12px;font-weight:900}header strong{font-size:12px}.actions{display:flex;gap:6px}.btn{border:1px solid #363b31;background:#20231d;color:#fff;border-radius:10px;padding:8px 9px;font-size:11px;font-weight:850}.btn.gold{background:var(--g);color:#111;border-color:var(--g)}.work{flex:1;min-height:0;position:relative}.viewport{height:100%;overflow:auto;padding:10px 8px 112px;display:flex;justify-content:center}.shell{width:min(100%,430px);aspect-ratio:4/5;position:relative}.canvas{position:absolute;width:1080px;height:1350px;left:0;top:0;transform-origin:0 0;overflow:hidden;background:var(--bg);border-radius:18px;box-shadow:0 16px 48px #0009}.photo{position:absolute;inset:0;background-size:cover;background-position:center;opacity:.58}.shade{position:absolute;inset:0;background:linear-gradient(180deg,#0002,#0005 45%,#000e)}.frame{position:absolute;inset:60px;border:2px solid #fff2}.num{position:absolute;right:70px;top:65px;color:var(--g);font-size:23px;font-weight:900;letter-spacing:.08em}.brand{position:absolute;left:70px;top:65px;font-size:22px;font-weight:1000;letter-spacing:.12em}.ey{position:absolute;left:70px;top:280px;background:var(--fg);color:#111;padding:12px 17px;font-size:23px;font-weight:1000;letter-spacing:.1em}.title{position:absolute;left:70px;top:375px;width:880px;font-size:96px;line-height:.86;letter-spacing:-.055em;font-weight:1000;text-transform:uppercase}.title span{color:var(--g)}.copy{position:absolute;left:73px;top:790px;width:740px;font-size:30px;line-height:1.24;font-weight:650}.cta{position:absolute;left:70px;bottom:72px;background:var(--g);color:#111;padding:16px 20px;font-size:23px;font-weight:1000}.dots{position:absolute;right:70px;bottom:82px;display:flex;gap:8px}.dot{width:12px;height:12px;border-radius:50%;background:#ffffff35}.dot.on{background:var(--g)}.slides{position:absolute;left:8px;right:8px;bottom:calc(82px + env(safe-area-inset-bottom));display:grid;grid-template-columns:repeat(5,1fr);gap:5px;z-index:40}.slides button{border:1px solid #353a30;background:#1b1e18;color:#fff;border-radius:10px;padding:9px 2px;font-size:11px;font-weight:900}.slides button.on{background:var(--o);border-color:var(--o)}.toolbar{position:absolute;left:8px;right:8px;bottom:calc(8px + env(safe-area-inset-bottom));height:66px;background:#171915f8;border:1px solid #30342b;border-radius:18px;display:grid;grid-template-columns:repeat(4,1fr);padding:5px;z-index:40}.toolbar button{border:0;background:transparent;color:#ddd;font-size:10px;font-weight:800}.sheet{display:none;position:absolute;left:8px;right:8px;bottom:calc(154px + env(safe-area-inset-bottom));max-height:43dvh;overflow:auto;background:#171915fb;border:1px solid #34382f;border-radius:20px;padding:14px;z-index:39}.sheet.open{display:block}.sheet h3{font-size:11px;text-transform:uppercase;letter-spacing:.12em;color:#bbb;margin:2px 0 10px}.sheet label{display:block;font-size:10px;color:#aaa;margin:8px 0}.sheet input,.sheet textarea{width:100%;margin-top:5px;background:#0f100e;color:#fff;border:1px solid #383c33;border-radius:10px;padding:10px}.sheet textarea{min-height:68px}.preview header,.preview .slides,.preview .toolbar,.preview .sheet{display:none}.preview .viewport{padding:0;align-items:center;background:#000}.preview .shell{width:100vw}.preview .canvas{border-radius:0}.safe:after{content:"";position:absolute;inset:70px;border:3px dashed #fff4;pointer-events:none}</style></head><body><div class="app" id="app"><header><a href="../">← Tools</a><strong>PERUSKURSSI CAROUSEL</strong><div class="actions"><button class="btn" onclick="save()">Save</button><button class="btn gold" id="pv" onclick="preview()">Preview</button></div></header><div class="work"><div class="viewport"><div class="shell" id="shell"><div class="canvas" id="canvas"><div class="photo" id="photo"></div><div class="shade"></div><div class="frame"></div><div class="brand">CAPRA COMBAT</div><div class="num" id="num">1 / 5</div><div class="ey" id="ey">PERUSKURSSI</div><div class="title" id="title"></div><div class="copy" id="copy"></div><div class="cta" id="cta"></div><div class="dots" id="dots"></div></div></div></div><div class="sheet" id="sheet"></div><div class="slides" id="slides"></div><div class="toolbar"><button onclick="edit()">✎<br>Teksti</button><button onclick="imageS()">▧<br>Kuva</button><button onclick="styleS()">◐<br>Tyyli</button><button onclick="exportPng()">⇩<br>PNG</button></div></div></div><input id="file" type="file" accept="image/*" hidden><script>const app=document.getElementById('app'),shell=document.getElementById('shell'),canvas=document.getElementById('canvas'),sheet=document.getElementById('sheet'),photo=document.getElementById('photo');let i=0;let data=[{ey:'PERUSKURSSI',t:'OLETKO JOSKUS\nHALUNNUT <span>KOKEILLA?</span>',c:'Ehkä ajatus on ollut mielessä jo pitkään, mutta aloittaminen on aina siirtynyt myöhemmäksi. Peruskurssi on tehty juuri sitä ensimmäistä askelta varten.',cta:'PYYHKÄISE →'},{ey:'LÄHTÖTASO',t:'SINUN EI TARVITSE\nOLLA <span>VALMIS.</span>',c:'Sinun ei tarvitse olla hyvässä kunnossa, notkea tai muutenkaan “kamppailuun sopiva” ennen ensimmäisiä harjoituksia. Lähtötasosi saa olla mikä tahansa.',cta:'2 / 5'},{ey:'OPPIMINEN',t:'SINUN EI TARVITSE\n<span>OSATA.</span>',c:'Peruskurssilla lähdetään perusteista. Harjoitteet rakennetaan niin, että pääset oppimaan turvallisesti heti ensimmäisestä treenistä alkaen.',cta:'3 / 5'},{ey:'YHTEISÖ',t:'ET TULE\n<span>YKSIN.</span>',c:'Sama lähtötilanne yhdistää kurssilaisia. Valmentajat auttavat ja ympärillä on porukka, jonka kanssa kehityt treeni treeniltä.',cta:'4 / 5'},{ey:'ALOITA NYT',t:'ENSIMMÄINEN ASKEL\nON <span>TÄSSÄ.</span>',c:'8 viikon peruskurssi · 120 €. BJJ, lukkopaini, vapaaottelu ja Muay Thai / K1. Katso alkavat kurssit ja ilmoittaudu mukaan.',cta:'CAPRACOMBAT.FI'}];let photos={};function fit(){const s=shell.clientWidth/1080;canvas.style.transform=`scale(${s})`;shell.style.height=1350*s+'px'}addEventListener('resize',fit);fit();function render(){const x=data[i];num.textContent=`${i+1} / ${data.length}`;ey.textContent=x.ey;title.innerHTML=x.t;copy.textContent=x.c;cta.textContent=x.cta;photo.style.backgroundImage=photos[i]?`url("${photos[i]}")`:'none';slides.innerHTML=data.map((_,n)=>`<button class="${n===i?'on':''}" onclick="go(${n})">${n+1}</button>`).join('');dots.innerHTML=data.map((_,n)=>`<div class="dot ${n===i?'on':''}"></div>`).join('')}function go(n){i=n;sheet.classList.remove('open');render()}function openS(h){sheet.innerHTML=h;sheet.classList.add('open')}function edit(){const x=data[i];openS(`<h3>Dian ${i+1} tekstit</h3><label>Yläteksti<input id="a" value="${x.ey}"></label><label>Otsikko<textarea id="b">${title.innerText}</textarea></label><label>Leipäteksti<textarea id="c">${x.c}</textarea></label><label>CTA<input id="d" value="${x.cta}"></label>`);a.oninput=e=>{x.ey=e.target.value;ey.textContent=x.ey};b.oninput=e=>{const q=e.target.value.split('\n');x.t=q.map((z,j,a)=>j===a.length-1?`<span>${z}</span>`:z).join('<br>');title.innerHTML=x.t};c.oninput=e=>{x.c=e.target.value;copy.textContent=x.c};d.oninput=e=>{x.cta=e.target.value;cta.textContent=x.cta}}function imageS(){openS('<h3>Dian kuva</h3><button class="btn gold" onclick="file.click()">Valitse kuva</button><label>Peittävyys<input id="o" type="range" min="0" max="100" value="58"></label><label>Pystysijainti<input id="y" type="range" min="0" max="100" value="50"></label>');o.oninput=e=>photo.style.opacity=e.target.value/100;y.oninput=e=>photo.style.backgroundPosition=`50% ${e.target.value}%`}file.onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{photos[i]=r.result;photo.style.backgroundImage=`url("${r.result}")`};r.readAsDataURL(f)};function styleS(){openS('<h3>Tyyli</h3><label>Oliivi<input id="o1" type="color" value="#68724a"></label><label>Okra<input id="g1" type="color" value="#c8ae4d"></label><label>Tausta<input id="b1" type="color" value="#11120f"></label><button class="btn" onclick="canvas.classList.toggle(\'safe\')">Safe area</button>');o1.oninput=e=>document.documentElement.style.setProperty('--o',e.target.value);g1.oninput=e=>document.documentElement.style.setProperty('--g',e.target.value);b1.oninput=e=>document.documentElement.style.setProperty('--bg',e.target.value)}async function exportPng(){sheet.classList.remove('open');try{const c=await html2canvas(canvas,{scale:1,width:1080,height:1350,useCORS:true});const a=document.createElement('a');a.download=`capra-peruskurssi-${i+1}.png`;a.href=c.toDataURL('image/png');a.click()}catch(e){alert('PNG-vienti epäonnistui')}}function preview(){app.classList.toggle('preview');sheet.classList.remove('open');pv.textContent=app.classList.contains('preview')?'Muokkaa':'Preview';setTimeout(fit,40)}function save(){localStorage.setItem('perusData',JSON.stringify(data));alert('Tekstit tallennettu')}const s=localStorage.getItem('perusData');if(s){try{data=JSON.parse(s)}catch(e){}}render();</script></body></html>

<!doctype html>
<html lang="fi">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width,initial-scale=1,viewport-fit=cover"
    />
    <title>Capra Peruskurssi Carousel</title>
    <script src="../vendor/html2canvas.min.js"></script>
    <script src="../vendor/capra-image.js"></script>
    <style>
      :root {
        --o: #68724a;
        --g: #c8ae4d;
        --bg: #11120f;
        --fg: #f1eee6;
      }
      * {
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
      }
      html,
      body {
        margin: 0;
        background: #090a08;
        color: #fff;
        font-family:
          -apple-system, BlinkMacSystemFont, Inter, Arial, sans-serif;
      }
      body {
        min-height: 100vh;
        min-height: 100svh;
        overflow: hidden;
      }
      button,
      input,
      textarea {
        font: inherit;
      }
      .app {
        height: 100vh;
        height: 100svh;
        display: flex;
        flex-direction: column;
        padding-top: env(safe-area-inset-top);
      }
      header {
        min-height: 60px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 0 10px;
        gap: 8px;
        background: #121410;
        border-bottom: 1px solid #30342b;
      }
      header a {
        color: #fff;
        text-decoration: none;
        font-size: 12px;
        font-weight: 900;
        min-height: 44px;
        display: inline-flex;
        align-items: center;
        flex: 0 0 auto;
      }
      header strong {
        font-size: 12px;
        min-width: 0;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .actions {
        display: flex;
        gap: 6px;
      }
      .btn {
        border: 1px solid #363b31;
        background: #20231d;
        color: #fff;
        border-radius: 10px;
        min-height: 44px;
        padding: 8px 11px;
        font-size: 11px;
        font-weight: 850;
      }
      .btn.gold {
        background: var(--g);
        color: #111;
        border-color: var(--g);
      }
      .work {
        flex: 1;
        min-height: 0;
        position: relative;
      }
      .viewport {
        height: 100%;
        overflow: auto;
        padding: 10px 8px 112px;
        display: flex;
        justify-content: center;
      }
      .shell {
        width: min(100%, 430px);
        aspect-ratio: 4/5;
        position: relative;
      }
      .canvas {
        position: absolute;
        width: 1080px;
        height: 1350px;
        left: 0;
        top: 0;
        transform-origin: 0 0;
        overflow: hidden;
        background: var(--bg);
        border-radius: 18px;
        box-shadow: 0 16px 48px #0009;
      }
      .photo {
        position: absolute;
        inset: 0;
        background-size: cover;
        background-position: center;
        opacity: 0.58;
      }
      .shade {
        position: absolute;
        inset: 0;
        background: linear-gradient(180deg, #0002, #0005 45%, #000e);
      }
      .frame {
        position: absolute;
        inset: 60px;
        border: 2px solid #fff2;
      }
      .num {
        position: absolute;
        right: 70px;
        top: 65px;
        color: var(--g);
        font-size: 23px;
        font-weight: 900;
        letter-spacing: 0.08em;
      }
      .brandLogo {
        position: absolute;
        left: 52px;
        top: 34px;
        width: 220px;
      }
      .brandLogo img {
        display: block;
        width: 100%;
        height: auto;
        object-fit: contain;
      }
      .ey {
        position: absolute;
        left: 70px;
        top: 280px;
        background: var(--fg);
        color: #111;
        padding: 12px 17px;
        font-size: 23px;
        font-weight: 1000;
        letter-spacing: 0.1em;
      }
      .title {
        position: absolute;
        left: 70px;
        top: 375px;
        width: 880px;
        font-size: 96px;
        line-height: 0.86;
        letter-spacing: -0.055em;
        font-weight: 1000;
        text-transform: uppercase;
      }
      .title span {
        color: var(--g);
      }
      .copy {
        position: absolute;
        left: 73px;
        top: 790px;
        width: 740px;
        font-size: 30px;
        line-height: 1.24;
        font-weight: 650;
      }
      .cta {
        position: absolute;
        left: 70px;
        bottom: 72px;
        background: var(--g);
        color: #111;
        padding: 16px 20px;
        font-size: 23px;
        font-weight: 1000;
      }
      .dots {
        position: absolute;
        right: 70px;
        bottom: 82px;
        display: flex;
        gap: 8px;
      }
      .dot {
        width: 12px;
        height: 12px;
        border-radius: 50%;
        background: #ffffff35;
      }
      .dot.on {
        background: var(--g);
      }
      .slides {
        position: absolute;
        left: 8px;
        right: 8px;
        bottom: calc(82px + env(safe-area-inset-bottom));
        display: grid;
        grid-template-columns: repeat(5, 1fr);
        gap: 5px;
        z-index: 40;
      }
      .slides button {
        border: 1px solid #353a30;
        background: #1b1e18;
        color: #fff;
        border-radius: 10px;
        min-height: 44px;
        padding: 9px 2px;
        font-size: 11px;
        font-weight: 900;
      }
      .slides button.on {
        background: var(--o);
        border-color: var(--o);
      }
      .toolbar {
        position: absolute;
        left: 8px;
        right: 8px;
        bottom: calc(8px + env(safe-area-inset-bottom));
        height: 68px;
        background: #171915f8;
        border: 1px solid #30342b;
        border-radius: 18px;
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        padding: 5px;
        z-index: 40;
      }
      .toolbar button {
        border: 0;
        background: transparent;
        color: #ddd;
        font-size: 10px;
        font-weight: 800;
        min-height: 44px;
        border-radius: 12px;
      }
      .sheet {
        display: none;
        position: absolute;
        left: 8px;
        right: 8px;
        bottom: calc(154px + env(safe-area-inset-bottom));
        max-height: 43dvh;
        overflow: auto;
        background: #171915fb;
        border: 1px solid #34382f;
        border-radius: 20px;
        padding: 14px;
        z-index: 39;
      }
      .sheet.open {
        display: block;
      }
      .sheet h3 {
        font-size: 11px;
        text-transform: uppercase;
        letter-spacing: 0.12em;
        color: #bbb;
        margin: 2px 0 10px;
      }
      .sheet label {
        display: block;
        font-size: 10px;
        color: #aaa;
        margin: 8px 0;
      }
      .sheet input,
      .sheet textarea {
        width: 100%;
        margin-top: 5px;
        background: #0f100e;
        color: #fff;
        border: 1px solid #383c33;
        border-radius: 10px;
        padding: 10px;
        min-height: 44px;
        font-size: 16px;
      }
      .sheet textarea {
        min-height: 68px;
      }
      .preview header,
      .preview .slides,
      .preview .toolbar,
      .preview .sheet {
        display: none;
      }
      .preview .viewport {
        padding: 0;
        align-items: center;
        background: #000;
      }
      .preview .shell {
        width: min(100vw, 80svh);
      }
      .preview .canvas {
        border-radius: 0;
      }
      .safe:after {
        content: "";
        position: absolute;
        inset: 70px;
        border: 3px dashed #fff4;
        pointer-events: none;
      }
      .uploadButton {
        display: flex;
        align-items: center;
        justify-content: center;
        width: 100%;
        min-height: 48px;
        margin: 4px 0 12px;
        border-radius: 12px;
        background: var(--g);
        color: #111;
        font-size: 13px;
        font-weight: 950;
        cursor: pointer;
      }
      .fileInput {
        position: fixed;
        width: 1px;
        height: 1px;
        opacity: 0;
        pointer-events: none;
      }
      .previewExit {
        display: none;
        position: fixed;
        top: calc(8px + env(safe-area-inset-top));
        left: 8px;
        z-index: 100;
        min-height: 44px;
        padding: 0 14px;
        border: 1px solid #ffffff4d;
        border-radius: 12px;
        background: #111d;
        color: #fff;
        font-size: 12px;
        font-weight: 900;
      }
      .app.preview .previewExit {
        display: block;
      }
    </style>
  </head>
  <body>
    <div class="app" id="app">
      <header>
        <a href="../">← Tools</a><strong>PERUSKURSSI CAROUSEL</strong>
        <div class="actions">
          <button class="btn" onclick="save()">Save</button
          ><button class="btn gold" id="pv" onclick="preview()">Preview</button>
        </div>
      </header>
      <div class="work">
        <div class="viewport">
          <div class="shell" id="shell">
            <div class="canvas" id="canvas">
              <div class="photo" id="photo"></div>
              <div class="shade"></div>
              <div class="frame"></div>
              <div class="brandLogo">
                <img src="../assets/capra-logo-light.jpeg" alt="Capra Combat" />
              </div>
              <div class="num" id="num">1 / 5</div>
              <div class="ey" id="ey">PERUSKURSSI</div>
              <div class="title" id="title"></div>
              <div class="copy" id="copy"></div>
              <div class="cta" id="cta"></div>
              <div class="dots" id="dots"></div>
            </div>
          </div>
        </div>
        <div class="sheet" id="sheet"></div>
        <div class="slides" id="slides"></div>
        <div class="toolbar">
          <button onclick="edit()">✎<br />Teksti</button
          ><button onclick="imageS()">▧<br />Kuva</button
          ><button onclick="styleS()">◐<br />Tyyli</button
          ><button onclick="exportPng()">⇩<br />PNG</button>
        </div>
      </div>
      <button class="previewExit" type="button" onclick="preview(false)">
        ← MUOKKAA
      </button>
    </div>
    <input
      class="fileInput"
      id="file"
      type="file"
      accept="image/*,.heic,.heif"
    />
    <script>
      const app = document.getElementById("app"),
        shell = document.getElementById("shell"),
        canvas = document.getElementById("canvas"),
        sheet = document.getElementById("sheet"),
        photo = document.getElementById("photo"),
        fileInput = document.getElementById("file"),
        numberEl = document.getElementById("num"),
        eyebrowEl = document.getElementById("ey"),
        titleEl = document.getElementById("title"),
        copyEl = document.getElementById("copy"),
        ctaEl = document.getElementById("cta"),
        slidesEl = document.getElementById("slides"),
        dotsEl = document.getElementById("dots"),
        previewButton = document.getElementById("pv");
      let i = 0;
      let data = [
        {
          ey: "PERUSKURSSI",
          t: "OLETKO JOSKUS\nHALUNNUT <span>KOKEILLA?</span>",
          c: "Ehkä ajatus on ollut mielessä jo pitkään, mutta aloittaminen on aina siirtynyt myöhemmäksi. Peruskurssi on tehty juuri sitä ensimmäistä askelta varten.",
          cta: "PYYHKÄISE →",
        },
        {
          ey: "LÄHTÖTASO",
          t: "SINUN EI TARVITSE\nOLLA <span>VALMIS.</span>",
          c: "Sinun ei tarvitse olla hyvässä kunnossa, notkea tai muutenkaan “kamppailuun sopiva” ennen ensimmäisiä harjoituksia. Lähtötasosi saa olla mikä tahansa.",
          cta: "2 / 5",
        },
        {
          ey: "OPPIMINEN",
          t: "SINUN EI TARVITSE\n<span>OSATA.</span>",
          c: "Peruskurssilla lähdetään perusteista. Harjoitteet rakennetaan niin, että pääset oppimaan turvallisesti heti ensimmäisestä treenistä alkaen.",
          cta: "3 / 5",
        },
        {
          ey: "YHTEISÖ",
          t: "ET TULE\n<span>YKSIN.</span>",
          c: "Sama lähtötilanne yhdistää kurssilaisia. Valmentajat auttavat ja ympärillä on porukka, jonka kanssa kehityt treeni treeniltä.",
          cta: "4 / 5",
        },
        {
          ey: "ALOITA NYT",
          t: "ENSIMMÄINEN ASKEL\nON <span>TÄSSÄ.</span>",
          c: "8 viikon peruskurssi · 120 €. BJJ, lukkopaini, vapaaottelu ja Muay Thai / K1. Katso alkavat kurssit ja ilmoittaudu mukaan.",
          cta: "CAPRACOMBAT.FI",
        },
      ];
      let photos = {};
      let crops = data.map(() => ({ opacity: 58, x: 50, y: 50, zoom: 100 }));
      let theme = { olive: "#68724a", gold: "#c8ae4d", bg: "#11120f" };

      function escapeHtml(value) {
        return String(value)
          .replaceAll("&", "&amp;")
          .replaceAll("<", "&lt;")
          .replaceAll(">", "&gt;");
      }

      function escapeAttribute(value) {
        return escapeHtml(value).replaceAll('"', "&quot;");
      }

      function cropFor(index) {
        if (!crops[index]) {
          crops[index] = { opacity: 58, x: 50, y: 50, zoom: 100 };
        }
        return crops[index];
      }

      function applyPhoto() {
        const crop = cropFor(i);
        photo.style.backgroundImage = photos[i]
          ? `url("${photos[i]}")`
          : "none";
        photo.style.backgroundPosition = `${crop.x}% ${crop.y}%`;
        photo.style.opacity = crop.opacity / 100;
        photo.style.transform = `scale(${crop.zoom / 100})`;
        photo.style.transformOrigin = `${crop.x}% ${crop.y}%`;
      }

      function applyTheme() {
        document.documentElement.style.setProperty("--o", theme.olive);
        document.documentElement.style.setProperty("--g", theme.gold);
        document.documentElement.style.setProperty("--bg", theme.bg);
      }
      function fit() {
        const s = shell.clientWidth / 1080;
        canvas.style.transform = `scale(${s})`;
        shell.style.height = 1350 * s + "px";
      }
      addEventListener("resize", fit);
      fit();
      function render() {
        const x = data[i];
        numberEl.textContent = `${i + 1} / ${data.length}`;
        eyebrowEl.textContent = x.ey;
        titleEl.innerHTML = x.t;
        copyEl.textContent = x.c;
        ctaEl.textContent = x.cta;
        applyPhoto();
        slidesEl.innerHTML = data
          .map(
            (_, n) =>
              `<button class="${n === i ? "on" : ""}" onclick="go(${n})">${n + 1}</button>`,
          )
          .join("");
        dotsEl.innerHTML = data
          .map((_, n) => `<div class="dot ${n === i ? "on" : ""}"></div>`)
          .join("");
      }
      function go(n) {
        i = n;
        sheet.classList.remove("open");
        render();
      }
      function openS(h) {
        sheet.innerHTML = h;
        sheet.classList.add("open");
      }
      function edit() {
        const x = data[i];
        openS(
          `<h3>Dian ${i + 1} tekstit</h3><label>Yläteksti<input id="editEyebrow" value="${escapeAttribute(x.ey)}"></label><label>Otsikko<textarea id="editTitle">${escapeHtml(titleEl.innerText)}</textarea></label><label>Leipäteksti<textarea id="editCopy">${escapeHtml(x.c)}</textarea></label><label>CTA<input id="editCta" value="${escapeAttribute(x.cta)}"></label>`,
        );
        const editEyebrow = document.getElementById("editEyebrow");
        const editTitle = document.getElementById("editTitle");
        const editCopy = document.getElementById("editCopy");
        const editCta = document.getElementById("editCta");
        editEyebrow.oninput = (e) => {
          x.ey = e.target.value;
          eyebrowEl.textContent = x.ey;
        };
        editTitle.oninput = (e) => {
          const q = e.target.value.split("\n");
          x.t = q
            .map((z, j, a) =>
              j === a.length - 1
                ? `<span>${escapeHtml(z)}</span>`
                : escapeHtml(z),
            )
            .join("<br>");
          titleEl.innerHTML = x.t;
        };
        editCopy.oninput = (e) => {
          x.c = e.target.value;
          copyEl.textContent = x.c;
        };
        editCta.oninput = (e) => {
          x.cta = e.target.value;
          ctaEl.textContent = x.cta;
        };
      }
      function imageS() {
        const crop = cropFor(i);
        openS(
          `<h3>Dian ${i + 1} kuva</h3><label class="uploadButton" for="file">VAIHDA KUVA</label><label>Peittävyys<input id="imageOpacity" type="range" min="0" max="100" value="${crop.opacity}"></label><label>Zoom<input id="imageZoom" type="range" min="100" max="200" value="${crop.zoom}"></label><label>Vaakasijainti<input id="imageX" type="range" min="0" max="100" value="${crop.x}"></label><label>Pystysijainti<input id="imageY" type="range" min="0" max="100" value="${crop.y}"></label>`,
        );
        const imageOpacity = document.getElementById("imageOpacity");
        const imageZoom = document.getElementById("imageZoom");
        const imageX = document.getElementById("imageX");
        const imageY = document.getElementById("imageY");
        imageOpacity.oninput = (event) => {
          crop.opacity = Number(event.target.value);
          applyPhoto();
        };
        imageZoom.oninput = (event) => {
          crop.zoom = Number(event.target.value);
          applyPhoto();
        };
        imageX.oninput = (event) => {
          crop.x = Number(event.target.value);
          applyPhoto();
        };
        imageY.oninput = (event) => {
          crop.y = Number(event.target.value);
          applyPhoto();
        };
      }
      fileInput.onchange = async (event) => {
        const selected = event.target.files && event.target.files[0];
        const targetIndex = i;
        if (!selected) return;
        try {
          photos[targetIndex] = await CapraImage.read(selected, {
            maxDimension: 1600,
            quality: 0.82,
          });
          if (targetIndex === i) applyPhoto();
        } catch (error) {
          alert("Kuvaa ei voitu avata. Kokeile JPG- tai PNG-kuvaa.");
        } finally {
          event.target.value = "";
        }
      };
      function styleS() {
        openS(
          `<h3>Tyyli</h3><label>Oliivi<input id="themeOlive" type="color" value="${theme.olive}"></label><label>Okra<input id="themeGold" type="color" value="${theme.gold}"></label><label>Tausta<input id="themeBg" type="color" value="${theme.bg}"></label><button class="btn" onclick="canvas.classList.toggle('safe')">Safe area</button>`,
        );
        const themeOlive = document.getElementById("themeOlive");
        const themeGold = document.getElementById("themeGold");
        const themeBg = document.getElementById("themeBg");
        themeOlive.oninput = (event) => {
          theme.olive = event.target.value;
          applyTheme();
        };
        themeGold.oninput = (event) => {
          theme.gold = event.target.value;
          applyTheme();
        };
        themeBg.oninput = (event) => {
          theme.bg = event.target.value;
          applyTheme();
        };
      }
      async function exportPng() {
        sheet.classList.remove("open");
        try {
          const c = await html2canvas(canvas, {
            scale: 1,
            width: 1080,
            height: 1350,
            useCORS: true,
            backgroundColor: null,
            onclone: (clone) => {
              const cloneCanvas = clone.getElementById("canvas");
              cloneCanvas.style.transform = "none";
              cloneCanvas.style.borderRadius = "0";
              cloneCanvas.style.boxShadow = "none";
            },
          });
          const a = document.createElement("a");
          a.download = `capra-peruskurssi-${i + 1}.png`;
          a.href = c.toDataURL("image/png");
          a.click();
        } catch (e) {
          alert("PNG-vienti epäonnistui");
        }
      }
      function preview(force) {
        const next =
          typeof force === "boolean"
            ? force
            : !app.classList.contains("preview");
        app.classList.toggle("preview", next);
        sheet.classList.remove("open");
        previewButton.textContent = app.classList.contains("preview")
          ? "Muokkaa"
          : "Preview";
        setTimeout(fit, 40);
      }
      function save() {
        const project = JSON.stringify({
          version: 2,
          data,
          photos,
          crops,
          theme,
        });
        if (CapraImage.persist("perusProjectV2", project)) {
          alert("Projekti tallennettu");
        } else {
          alert(
            "Projekti on liian suuri selaimen tallennustilaan. Pienennä kuvia ja yritä uudelleen.",
          );
        }
      }
      const savedProject = localStorage.getItem("perusProjectV2");
      const legacyData = localStorage.getItem("perusData");
      if (savedProject) {
        try {
          const restored = JSON.parse(savedProject);
          if (
            Array.isArray(restored.data) &&
            restored.data.length === data.length
          ) {
            data = restored.data;
          }
          if (restored.photos && typeof restored.photos === "object") {
            photos = restored.photos;
          }
          if (Array.isArray(restored.crops)) crops = restored.crops;
          if (restored.theme) theme = { ...theme, ...restored.theme };
        } catch (error) {
          console.warn("Tallennettua projektia ei voitu avata", error);
        }
      } else if (legacyData) {
        try {
          const restored = JSON.parse(legacyData);
          if (Array.isArray(restored) && restored.length === data.length)
            data = restored;
        } catch (error) {
          console.warn("Vanhaa projektia ei voitu avata", error);
        }
      }
      applyTheme();
      render();
    </script>
  </body>
</html>

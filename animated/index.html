<!doctype html>
<html lang="fi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
  <meta name="theme-color" content="#090a08">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <title>Capra MMA + BJJ Motion Studio</title>
  <link rel="stylesheet" href="../vendor/capra-fonts.css">
  <style>
    :root{
      --olive:#68724a;
      --ochre:#c8ae4d;
      --ink:#090a08;
      --paper:#f2efe7;
      --panel:#151713;
      --panel-2:#1c1f19;
      --line:#34382f;
      --muted:#a5aa9f;
    }
    *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
    html,body{margin:0;min-height:100%;max-width:100%;background:#070806;color:#fff;font-family:Inter,-apple-system,BlinkMacSystemFont,"SF Pro Display",Arial,sans-serif;-webkit-text-size-adjust:100%;overscroll-behavior:none}
    body{height:100dvh;overflow:hidden;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
    button,input,textarea,select{font:inherit}
    button,.fileButton{
      min-height:44px;
      border:1px solid var(--line);
      border-radius:12px;
      background:#20231d;
      color:#fff;
      padding:9px 12px;
      font-weight:800;
      touch-action:manipulation;
    }
    button{cursor:pointer}
    button:disabled{opacity:.45;cursor:default}
    button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible,.fileButton:focus-visible{outline:3px solid var(--ochre);outline-offset:2px}
    .primary{border-color:var(--ochre)!important;background:var(--ochre)!important;color:#111!important}
    .danger{border-color:#6f3f3f!important;color:#f2caca!important}
    .app{height:100%;display:flex;flex-direction:column;background:#090a08}
    header{
      height:56px;
      flex:none;
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:8px;
      padding:0 9px;
      border-bottom:1px solid #292c25;
      background:#0c0e0bf5;
      z-index:30;
    }
    .homeLink{min-width:0;min-height:44px;display:flex;align-items:center;gap:9px;color:inherit;text-decoration:none}
    .headerMark{position:relative;width:35px;height:35px;overflow:hidden;border-radius:8px;background:#000;flex:none}
    .headerMark img{position:absolute;inset:0;width:35px;height:35px;display:block;object-fit:contain}
    .brandText{min-width:0}
    .brandText b{display:block;overflow:hidden;font-size:11px;letter-spacing:.055em;text-overflow:ellipsis;white-space:nowrap}
    .brandText small{display:block;margin-top:2px;color:#8f9589;font-size:9px;letter-spacing:.08em}
    .headerActions{display:flex;gap:6px}
    .headerActions button{padding:7px 9px;font-size:11px}
    .modebar{flex:none;display:grid;grid-template-columns:1fr 1fr;gap:7px;padding:7px 8px;border-bottom:1px solid #292c25;background:#0d0f0c;z-index:29}
    .modebar button{font-size:12px}
    .modebar button.active{border-color:var(--olive);background:var(--olive)}
    .sceneBar{display:none;flex:none;gap:6px;padding:7px 8px;border-bottom:1px solid #272a23;background:#0a0b09;z-index:28}
    .sceneBar.show{display:flex}
    .sceneBar button{min-width:0;flex:1;padding:7px 4px;font-size:10px;white-space:nowrap}
    .sceneBar button.active{border-color:var(--ochre);background:var(--ochre);color:#111}
    .work{position:relative;min-height:0;flex:1}
    .canvasViewport{
      position:absolute;
      inset:0;
      padding:8px 8px calc(80px + env(safe-area-inset-bottom));
      display:flex;
      align-items:center;
      justify-content:center;
      overflow:hidden;
      background:
        radial-gradient(circle at 50% 22%,#1d2119 0,#0b0c0a 47%,#070806 80%);
    }
    .stageShell{
      position:relative;
      height:100%;
      max-height:calc((100vw - 16px) * 1.77778);
      aspect-ratio:9/16;
      overflow:hidden;
      border:1px solid #31352d;
      border-radius:18px;
      background:#0b0c0a;
      box-shadow:0 22px 60px #000b;
      flex:none;
    }
    #stage{display:block;width:100%;height:100%;touch-action:none;user-select:none;-webkit-user-select:none}
    .stageControls{position:absolute;right:8px;bottom:8px;display:flex;gap:6px;z-index:4}
    .stageControls button{min-width:44px;width:44px;height:44px;padding:0;border-radius:999px;background:#10120fe8;backdrop-filter:blur(12px)}
    .dragHint{
      position:absolute;
      left:8px;
      bottom:9px;
      max-width:calc(100% - 66px);
      padding:6px 9px;
      border:1px solid #ffffff25;
      border-radius:999px;
      background:#0d0f0ccc;
      color:#d4d7ce;
      font-size:9px;
      opacity:.9;
      pointer-events:none;
    }
    .sheet{
      position:absolute;
      left:8px;
      right:8px;
      bottom:calc(80px + env(safe-area-inset-bottom));
      z-index:20;
      display:none;
      max-height:min(61dvh,620px);
      padding:14px;
      overflow:auto;
      border:1px solid var(--line);
      border-radius:22px;
      background:#151713f7;
      box-shadow:0 -16px 45px #0009;
      backdrop-filter:blur(22px);
      -webkit-overflow-scrolling:touch;
    }
    .sheet.open{display:block}
    .sheetHead{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:8px}
    .sheet h3{margin:0;font-size:12px;letter-spacing:.13em;text-transform:uppercase}
    .sheet p{margin:6px 0 12px;color:var(--muted);font-size:12px;line-height:1.45}
    .closeSheet{min-width:44px;width:44px;padding:0;border:0;background:transparent;font-size:20px}
    .toolbar{
      position:absolute;
      left:7px;
      right:7px;
      bottom:calc(7px + env(safe-area-inset-bottom));
      z-index:22;
      height:66px;
      display:grid;
      grid-template-columns:repeat(5,1fr);
      gap:1px;
      padding:5px;
      border:1px solid var(--line);
      border-radius:19px;
      background:#171915f4;
      box-shadow:0 10px 35px #0007;
      backdrop-filter:blur(20px);
    }
    .tool{min-width:0;border:0;background:transparent;padding:3px 1px;font-size:9px;color:#c6cbc0}
    .tool b{display:block;margin-bottom:2px;color:#fff;font-size:18px}
    .tool.active{background:#272b23;color:#fff}
    label{display:block;margin:9px 0;color:#b5baae;font-size:11px}
    input,textarea,select{
      width:100%;
      min-height:44px;
      margin-top:5px;
      padding:10px 11px;
      border:1px solid #3a3e35;
      border-radius:11px;
      background:#0e100d;
      color:#fff;
      font-size:16px;
    }
    textarea{min-height:78px;resize:vertical}
    input[type="range"]{padding:0}
    input[type="color"]{padding:5px}
    input[type="checkbox"]{width:22px;min-height:22px;margin:0;accent-color:var(--ochre)}
    .row{display:grid;grid-template-columns:1fr 1fr;gap:8px}
    .rangeRow{display:grid;grid-template-columns:80px 1fr 50px;align-items:center;gap:8px;margin:8px 0;color:#b5baae;font-size:11px}
    .rangeRow input{margin:0}
    .rangeRow output{color:#fff;text-align:right;font-size:11px}
    .toggleRow{min-height:44px;display:flex;align-items:center;justify-content:space-between;gap:12px;margin:7px 0;padding:8px 10px;border:1px solid #34382f;border-radius:11px;background:#10120f;color:#d8dbd2;font-size:12px}
    .buttonGrid{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-top:9px}
    .buttonGrid .wide{grid-column:1/-1}
    .fileButton{width:100%;display:flex;align-items:center;justify-content:center;border-color:var(--ochre);background:var(--ochre);color:#111;cursor:pointer;text-align:center}
    .fileName{margin:6px 0 12px;overflow:hidden;color:#b4b9ad;font-size:10px;text-overflow:ellipsis;white-space:nowrap}
    .presetGrid{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin:8px 0 13px}
    .preset{padding:8px 4px;font-size:10px}
    .elementPills{display:flex;gap:6px;overflow:auto;padding:2px 0 8px;scrollbar-width:none}
    .elementPills::-webkit-scrollbar{display:none}
    .elementPills button{flex:none;padding:7px 10px;font-size:10px}
    .elementPills button.active{border-color:var(--ochre);color:var(--ochre)}
    .exportCard{margin:9px 0;padding:12px;border:1px solid #383c33;border-radius:14px;background:#10120f}
    .exportCard b{display:block;margin-bottom:4px;font-size:13px}
    .exportCard span{color:var(--muted);font-size:10px;line-height:1.4}
    .progress{
      position:fixed;
      left:50%;
      top:50%;
      z-index:100;
      display:none;
      width:min(82vw,360px);
      padding:16px;
      border:1px solid #454a3f;
      border-radius:18px;
      background:#11130ff7;
      box-shadow:0 22px 70px #000c;
      text-align:center;
      transform:translate(-50%,-50%);
    }
    .progress.show{display:block}
    .progress b{display:block;margin-bottom:10px}
    .progressTrack{height:8px;overflow:hidden;border-radius:999px;background:#30342c}
    .progressFill{height:100%;width:0;background:var(--ochre);transition:width .12s linear}
    .progress small{display:block;margin-top:8px;color:#aeb3a8}
    .toast{
      position:fixed;
      left:50%;
      bottom:calc(84px + env(safe-area-inset-bottom));
      z-index:110;
      max-width:min(88vw,430px);
      padding:10px 14px;
      border:1px solid #3a3e35;
      border-radius:999px;
      background:#11130ff2;
      color:#fff;
      font-size:12px;
      font-weight:700;
      text-align:center;
      opacity:0;
      pointer-events:none;
      transform:translate(-50%,10px);
      transition:opacity .2s ease,transform .2s ease;
    }
    .toast.show{opacity:1;transform:translate(-50%,0)}
    .exitPreview{
      position:fixed;
      top:calc(9px + env(safe-area-inset-top));
      right:9px;
      z-index:95;
      display:none;
      border-color:#ffffff45;
      background:#0d0f0cdb;
    }
    .previewMode header,.previewMode .modebar,.previewMode .sceneBar,.previewMode .toolbar,.previewMode .sheet{display:none!important}
    .previewMode .exitPreview{display:block}
    .previewMode .canvasViewport{padding:0;background:#000}
    .previewMode .stageShell{
      width:min(100vw,calc(100dvh * .5625));
      height:min(100dvh,calc(100vw * 1.77778));
      max-height:none;
      border:0;
      border-radius:0;
      box-shadow:none;
    }
    .previewMode .stageControls,.previewMode .dragHint{display:none}
    @media(max-width:390px){
      .brandText small{display:none}
      .headerActions button{padding-inline:7px}
      .sceneBar button{font-size:9px}
      .toolbar{left:5px;right:5px}
    }
    @media(min-width:800px){
      .sheet{left:auto;width:430px;right:18px;bottom:88px}
      .toolbar{left:50%;right:auto;width:520px;transform:translateX(-50%)}
      .stageShell{border-radius:24px}
    }
    @media(prefers-reduced-motion:reduce){
      *{scroll-behavior:auto!important;transition-duration:.01ms!important}
    }
  </style>
</head>
<body>
  <div class="app" id="app">
    <header>
      <a class="homeLink" href="../" aria-label="Takaisin Capra Toolsiin">
        <span class="headerMark"><img src="../assets/capra-logo.png?v=5" alt=""></span>
        <span class="brandText"><b>MMA + BJJ MOTION STUDIO</b><small>CAPRA COMBAT · KUOPIO</small></span>
      </a>
      <div class="headerActions">
        <button id="saveBtn" type="button">Tallenna</button>
        <button class="primary" id="previewBtn" type="button">Esikatsele</button>
      </div>
    </header>
    <nav class="modebar" aria-label="Mainoksen versio">
      <button id="oneModeBtn" class="active" type="button" aria-pressed="true">1 VAIHE · 6 S</button>
      <button id="threeModeBtn" type="button" aria-pressed="false">3 VAIHETTA</button>
    </nav>
    <nav class="sceneBar" id="sceneBar" aria-label="Muokattava vaihe">
      <button class="active" data-scene="0" type="button">1 · HOOK</button>
      <button data-scene="1" type="button">2 · KYNNYS</button>
      <button data-scene="2" type="button">3 · CTA</button>
    </nav>
    <main class="work">
      <div class="canvasViewport">
        <div class="stageShell" id="stageShell">
          <canvas id="stage" width="1080" height="1920" aria-label="Animoidun mainoksen esikatselu"></canvas>
          <div class="dragHint" id="dragHint">Napauta elementtiä ja siirrä sormella</div>
          <div class="stageControls"><button id="playBtn" type="button" aria-label="Toista animaatio">▶</button></div>
        </div>
      </div>
      <section class="sheet" id="sheet" aria-live="polite"></section>
      <nav class="toolbar" aria-label="Muokkaustyökalut">
        <button class="tool" data-panel="text" type="button"><b>✎</b>Tekstit</button>
        <button class="tool" data-panel="image" type="button"><b>▧</b>Kuva</button>
        <button class="tool" data-panel="elements" type="button"><b>⌖</b>Elementit</button>
        <button class="tool" data-panel="style" type="button"><b>◐</b>Tyyli</button>
        <button class="tool" data-panel="export" type="button"><b>⇧</b>Tallenna</button>
      </nav>
    </main>
  </div>
  <button class="exitPreview" id="exitPreviewBtn" type="button">Muokkaa</button>
  <div class="progress" id="progress">
    <b id="progressTitle">Luodaan videota…</b>
    <div class="progressTrack"><div class="progressFill" id="progressFill"></div></div>
    <small id="progressText">0 %</small>
  </div>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <input id="photoInput" type="file" accept="image/*,.heic,.heif" hidden>
  <input id="projectInput" type="file" accept=".json,.capra,application/json" hidden>
  <script>
  (function(){
    "use strict";
    var W=1080,H=1920;
    var DB_NAME="capraMotionStudio",DB_STORE="projects",DB_KEY="mma-bjj",FALLBACK_KEY="capraMmaBjjMotionV1";
    var canvas=document.getElementById("stage");
    var ctx=canvas.getContext("2d",{alpha:false});
    var sheet=document.getElementById("sheet");
    var app=document.getElementById("app");
    var sceneBar=document.getElementById("sceneBar");
    var photoInput=document.getElementById("photoInput");
    var projectInput=document.getElementById("projectInput");
    var toast=document.getElementById("toast");
    var progress=document.getElementById("progress");
    var progressFill=document.getElementById("progressFill");
    var progressText=document.getElementById("progressText");
    var photoCache=new Map(),hitAreas=[];
    var selectedKey="headline",activePanel="",animationFrame=0,playing=false,playStarted=0,toastTimer=0,saveTimer=0;
    var logoCanvas=null,grainCanvas=null,drag=null,exporting=false;
    var elementLabels={logo:"Logo",kicker:"Yläteksti",headline:"Pääotsikko",body:"Leipäteksti",sports:"Lajit",meta:"Kurssitiedot",cta:"CTA + osoite",custom:"Oma teksti"};

    function transforms(){
      return {
        logo:{x:0,y:0,scale:1,show:true},
        kicker:{x:0,y:0,scale:1,show:true},
        headline:{x:0,y:0,scale:1,show:true},
        body:{x:0,y:0,scale:1,show:true},
        sports:{x:0,y:0,scale:1,show:true},
        meta:{x:0,y:0,scale:1,show:true},
        cta:{x:0,y:0,scale:1,show:true},
        custom:{x:0,y:0,scale:1,show:false}
      };
    }
    function makeScene(values){
      var scene={
        kicker:"PERUSKURSSIT · KUOPIO",headline:"",body:"",
        sportA:"VAPAAOTTELU",sportB:"BJJ · LUKKOPAINI",
        meta:"ALKAA 31.8. · 8 VKO · 120 €",cta:"VARAA PAIKKASI →",url:"capracombat.fi/peruskurssit",custom:"",
        image:"",imageName:"",
        crop:{zoom:1.05,x:50,y:50},
        filter:{brightness:.78,contrast:1.08,saturation:.72,overlay:.72},
        elements:transforms()
      };
      if(values)Object.keys(values).forEach(function(key){scene[key]=values[key]});
      return scene;
    }
    var defaults={
      version:1,mode:"one",current:0,
      colors:{olive:"#68724a",ochre:"#c8ae4d",ink:"#090a08",paper:"#f2efe7"},
      animation:"dynamic",accentLast:true,grain:true,oneDuration:6,sceneDuration:3.6,
      one:makeScene({
        kicker:"VAPAAOTTELU · BJJ / LUKKOPAINI",
        headline:"PERUSKURSSIT\nALKAVAT 31.8.",
        body:"Kaksi tapaa aloittaa. Sama matala kynnys. Et tarvitse aiempaa kokemusta – kaikki lähtee perusteista.",
        meta:"8 VKO · 120 € · KUOPIO"
      }),
      scenes:[
        makeScene({
          kicker:"VAPAAOTTELU · BJJ / LUKKOPAINI",
          headline:"HALUATKO\nKOKEILLA\nKAMPPAILUA?",
          body:"Nyt on oikea hetki ottaa ensimmäinen askel.",
          meta:"PERUSKURSSIT · CAPRA COMBAT"
        }),
        makeScene({
          kicker:"MATALA KYNNYS · SELKEÄ ALKU",
          headline:"SINUN EI\nTARVITSE\nOSATA.",
          body:"Lähdemme perusteista. Et tarvitse aiempaa kokemusta tai valmista kuntoa.",
          meta:"TULE SELLAISENA KUIN OLET"
        }),
        makeScene({
          kicker:"OTA ENSIMMÄINEN ASKEL",
          headline:"PERUSKURSSIT\nALKAVAT 31.8.",
          body:"Valitse vapaaottelu tai BJJ/lukkopaini ja varaa paikkasi.",
          meta:"8 VKO · 120 € · KUOPIO"
        })
      ]
    };
    defaults.scenes[0].elements.cta.show=false;
    defaults.scenes[1].elements.cta.show=false;
    var state=clone(defaults);
    function clone(value){return JSON.parse(JSON.stringify(value))}
    function clamp(value,min,max){return Math.max(min,Math.min(max,value))}
    function ease(value){value=clamp(value,0,1);return 1-Math.pow(1-value,3)}
    function hexToRgb(hex){
      var value=String(hex||"#000000").replace("#","");
      if(value.length===3)value=value.split("").map(function(c){return c+c}).join("");
      return {r:parseInt(value.slice(0,2),16)||0,g:parseInt(value.slice(2,4),16)||0,b:parseInt(value.slice(4,6),16)||0};
    }
    function rgba(hex,alpha){var c=hexToRgb(hex);return "rgba("+c.r+","+c.g+","+c.b+","+alpha+")"}
    function esc(value){
      return String(value==null?"":value).replace(/[&<>"']/g,function(character){
        return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[character];
      });
    }
    function currentScene(){return state.mode==="one"?state.one:state.scenes[state.current]}
    function setCssColors(){
      document.documentElement.style.setProperty("--olive",state.colors.olive);
      document.documentElement.style.setProperty("--ochre",state.colors.ochre);
      document.documentElement.style.setProperty("--ink",state.colors.ink);
      document.documentElement.style.setProperty("--paper",state.colors.paper);
    }
    function font(weight,size,family){return String(weight)+" "+String(size)+'px "'+(family||"Inter")+'",Arial,sans-serif'}
    function wrapLines(context,text,maxWidth){
      var result=[];
      String(text||"").split("\n").forEach(function(paragraph){
        var words=paragraph.trim().split(/\s+/).filter(Boolean);
        if(!words.length){result.push("");return}
        var line=words[0];
        for(var i=1;i<words.length;i++){
          var test=line+" "+words[i];
          if(context.measureText(test).width<=maxWidth)line=test;
          else{result.push(line);line=words[i]}
        }
        result.push(line);
      });
      return result;
    }
    function fitBlock(context,text,maxWidth,maxHeight,maxSize,minSize,lineFactor,family,weight,maxLines){
      var size=maxSize,lines=[];
      while(size>=minSize){
        context.font=font(weight,size,family);
        lines=wrapLines(context,text,maxWidth);
        var fitsWidth=lines.every(function(line){return context.measureText(line).width<=maxWidth});
        if(fitsWidth&&lines.length<=maxLines&&lines.length*size*lineFactor<=maxHeight)break;
        size-=3;
      }
      if(lines.length>maxLines){
        lines=lines.slice(0,maxLines);
        var last=lines[maxLines-1];
        while(last.length&&context.measureText(last+"…").width>maxWidth)last=last.slice(0,-1);
        lines[maxLines-1]=last+"…";
      }
      return {size:size,lines:lines,lineHeight:size*lineFactor,height:lines.length*size*lineFactor};
    }
    function createGrain(){
      var c=document.createElement("canvas");c.width=180;c.height=180;
      var cctx=c.getContext("2d"),data=cctx.createImageData(c.width,c.height),seed=314159;
      function random(){seed=(seed*1664525+1013904223)%4294967296;return seed/4294967296}
      for(var i=0;i<data.data.length;i+=4){
        var value=random()>.52?255:0;
        data.data[i]=value;data.data[i+1]=value;data.data[i+2]=value;data.data[i+3]=Math.floor(random()*38);
      }
      cctx.putImageData(data,0,0);grainCanvas=c;
    }
    function loadImageSource(source){
      return new Promise(function(resolve,reject){
        var img=new Image();
        img.onload=function(){resolve(img)};
        img.onerror=function(){reject(new Error("Kuvaa ei voitu avata"))};
        img.src=source;
      });
    }
    async function prepareLogo(){
      try{
        logoCanvas=await loadImageSource("../assets/capra-logo.png?v=5");
        if(!playing&&!exporting)renderStatic();
      }catch(error){logoCanvas=null}
    }
    function cachedPhoto(scene){
      if(!scene.image)return null;
      if(photoCache.has(scene.image)){
        var cached=photoCache.get(scene.image);
        return cached.complete&&cached.naturalWidth?cached:null;
      }
      var image=new Image();
      image.onload=function(){if(!playing&&!exporting)renderStatic()};
      image.src=scene.image;photoCache.set(scene.image,image);
      return image.complete&&image.naturalWidth?image:null;
    }
    function drawCover(context,image,scene,local){
      var zoom=Number(scene.crop.zoom)||1;
      var scale=Math.max(W/image.naturalWidth,H/image.naturalHeight)*zoom*(1+.035*local);
      var dw=image.naturalWidth*scale,dh=image.naturalHeight*scale;
      var maxX=Math.max(0,dw-W),maxY=Math.max(0,dh-H);

    function drawTimeline(milliseconds,options){
      options=options||{};var loop=options.loop!==false,editable=!!options.editable;ctx.clearRect(0,0,W,H);
      if(state.mode==="one"){
        var duration=state.oneDuration*1000,t=loop?(milliseconds%duration):Math.min(milliseconds,duration-1),local=t/duration,alpha=1;
        if(loop&&local>.94)alpha=1-ease((local-.94)/.06);
        drawScene(state.one,local,alpha,0,editable);return;
      }
      var sceneMs=state.sceneDuration*1000,total=sceneMs*3,time=loop?(milliseconds%total):Math.min(milliseconds,total-1);
      var index=Math.min(2,Math.floor(time/sceneMs));
      var sceneLocal=(time-index*sceneMs)/sceneMs;
      var transitionStart=state.animation==="minimal"?.92:.86;
      var hasNext=index<2||loop;
      if(hasNext&&sceneLocal>transitionStart){
        var q=ease((sceneLocal-transitionStart)/(1-transitionStart));
        drawScene(state.scenes[index],sceneLocal,1-q,index,false);
        var next=(index+1)%3;
        drawBackground(state.scenes[next],0,q);
        drawFixedDetails(next,q);
      }else{
        drawScene(state.scenes[index],sceneLocal,1,index,editable);
      }
    }

      document.getElementById("animationStyle").onchange=function(event){state.animation=event.target.value;renderStatic();scheduleSave()};
      document.getElementById("accentLast").onchange=function(event){state.accentLast=event.target.checked;renderStatic();scheduleSave()};
      document.getElementById("grainToggle").onchange=function(event){state.grain=event.target.checked;renderStatic();scheduleSave()};
      [["oneDuration","oneDuration"," s"],["sceneDuration","sceneDuration"," s"]].forEach(function(binding){
        var input=document.getElementById(binding[0]);
        input.oninput=function(){
          state[binding[1]]=Number(input.value);document.getElementById(binding[0]+"Out").value=input.value+binding[2];scheduleSave();
        };
      });
    }
    function openExportPanel(){
      var duration=state.mode==="one"?state.oneDuration:state.sceneDuration*3;
      var html=
        '<div class="exportCard"><b>'+(state.mode==="one"?"1-vaiheinen mainos":"3-vaiheinen mainos")+'</b><span>1080 × 1920 · 9:16 · noin '+duration.toFixed(1).replace(".",",")+' sekuntia · ilman ääntä</span></div>'+
        '<div class="buttonGrid"><button class="primary wide" id="videoExportBtn" type="button">TALLENNA ANIMOITU VIDEO</button>'+
        '<button id="pngExportBtn" type="button">PNG tästä vaiheesta</button><button id="projectExportBtn" type="button">Projektitiedosto</button>'+
        '<label class="fileButton wide" for="projectInput" tabindex="0">AVAA PROJEKTI</label><button class="danger wide" id="resetProjectBtn" type="button">Palauta alkuperäinen pohja</button></div>'+
        '<p>iPhonella video tai kuva avautuu Jaa-valikkoon. Valitse “Tallenna video”, “Tallenna kuva” tai avaa tiedosto suoraan CapCutissa. Jos selain ei tue videovientiä, käytä Esikatsele-tilaa ja iPhonen näytön tallennusta.</p>';
      showSheet("TALLENNA JA JAA",html);
      document.getElementById("videoExportBtn").onclick=exportVideo;
      document.getElementById("pngExportBtn").onclick=exportPng;
      document.getElementById("projectExportBtn").onclick=exportProject;
      document.getElementById("resetProjectBtn").onclick=function(){
        if(window.confirm("Palautetaanko kaikki tämän työkalun tekstit, kuvat ja säädöt?")){
          state=clone(defaults);photoCache.clear();selectedKey="headline";setCssColors();syncModeUi();renderStatic();closeSheet();saveProject(true);
        }
      };
    }
    function readFile(file){
      return new Promise(function(resolve,reject){
        var reader=new FileReader();reader.onload=function(){resolve(reader.result)};
        reader.onerror=function(){reject(reader.error||new Error("Tiedostoa ei voitu lukea"))};reader.readAsDataURL(file);
      });
    }
    async function optimizePhoto(source){
      var image=await loadImageSource(source),maxDimension=1900;
      var scale=Math.min(1,maxDimension/Math.max(image.naturalWidth,image.naturalHeight));
      var c=document.createElement("canvas");
      c.width=Math.max(1,Math.round(image.naturalWidth*scale));c.height=Math.max(1,Math.round(image.naturalHeight*scale));
      var cctx=c.getContext("2d",{alpha:false});cctx.fillStyle="#000";cctx.fillRect(0,0,c.width,c.height);cctx.drawImage(image,0,0,c.width,c.height);
      return c.toDataURL("image/jpeg",.84);
    }
    async function handlePhoto(event){
      var file=event.target.files&&event.target.files[0];event.target.value="";if(!file)return;
      showToast("Kuvaa käsitellään…");
      try{
        var source=await readFile(file),optimized=await optimizePhoto(source),target=currentScene();
        target.image=optimized;target.imageName=file.name||"iPhone-kuva";target.crop={zoom:1.05,x:50,y:50};
        photoCache.clear();renderStatic();if(activePanel==="image")openImagePanel();scheduleSave();showToast("Kuva lisätty");
      }catch(error){showToast("Kuvaa ei voitu avata. Kokeile JPEG- tai PNG-kuvaa.")}
    }
    function openDb(){
      return new Promise(function(resolve,reject){
        if(!("indexedDB" in window)){reject(new Error("IndexedDB ei ole käytössä"));return}
        var request=indexedDB.open(DB_NAME,1);
        request.onupgradeneeded=function(){if(!request.result.objectStoreNames.contains(DB_STORE))request.result.createObjectStore(DB_STORE)};
        request.onsuccess=function(){resolve(request.result)};request.onerror=function(){reject(request.error)};
      });
    }
    async function saveProject(announce){
      clearTimeout(saveTimer);
      try{
        var payload=clone(state),db=await openDb();
        await new Promise(function(resolve,reject){
          var transaction=db.transaction(DB_STORE,"readwrite");transaction.objectStore(DB_STORE).put(payload,DB_KEY);
          transaction.oncomplete=resolve;transaction.onerror=function(){reject(transaction.error)};
        });
        db.close();if(announce)showToast("Projekti tallennettu tähän iPhoneen");
      }catch(error){
        try{localStorage.setItem(FALLBACK_KEY,JSON.stringify(state));if(announce)showToast("Projekti tallennettu")}
        catch(fallbackError){if(announce)showToast("Tallennus ei mahtunut selaimeen. Vie projektitiedosto.")}
      }
    }
    function scheduleSave(){clearTimeout(saveTimer);saveTimer=window.setTimeout(function(){saveProject(false)},850)}
    async function restoreProject(){
      try{
        var db=await openDb();
        var saved=await new Promise(function(resolve,reject){
          var transaction=db.transaction(DB_STORE,"readonly"),request=transaction.objectStore(DB_STORE).get(DB_KEY);
          request.onsuccess=function(){resolve(request.result)};request.onerror=function(){reject(request.error)};
        });
        db.close();if(saved){state=normalizeState(saved);return}
      }catch(error){}
      try{var fallback=localStorage.getItem(FALLBACK_KEY);if(fallback)state=normalizeState(JSON.parse(fallback))}catch(error){}
    }
    function normalizeTransform(value,fallback){
      return {
        x:Number.isFinite(Number(value&&value.x))?Number(value.x):fallback.x,
        y:Number.isFinite(Number(value&&value.y))?Number(value.y):fallback.y,
        scale:clamp(Number(value&&value.scale)||fallback.scale,.3,2.5),
        show:value&&typeof value.show==="boolean"?value.show:fallback.show
      };
    }
    function normalizeScene(value,fallback){
      var result=makeScene();
      ["kicker","headline","body","sportA","sportB","meta","cta","url","custom","image","imageName"].forEach(function(key){
        result[key]=value&&value[key]!=null?String(value[key]):fallback[key];
      });
      result.crop={
        zoom:clamp(Number(value&&value.crop&&value.crop.zoom)||fallback.crop.zoom,1,2.5),
        x:clamp(Number(value&&value.crop&&value.crop.x)||fallback.crop.x,0,100),
        y:clamp(Number(value&&value.crop&&value.crop.y)||fallback.crop.y,0,100)
      };
      result.filter={
        brightness:clamp(Number(value&&value.filter&&value.filter.brightness)||fallback.filter.brightness,.2,2),
        contrast:clamp(Number(value&&value.filter&&value.filter.contrast)||fallback.filter.contrast,.2,2),
        saturation:clamp(Number(value&&value.filter&&value.filter.saturation)||fallback.filter.saturation,0,2),
        overlay:clamp(Number(value&&value.filter&&value.filter.overlay)||fallback.filter.overlay,0,1)
      };
      var base=transforms();
      Object.keys(base).forEach(function(key){result.elements[key]=normalizeTransform(value&&value.elements&&value.elements[key],fallback.elements[key]||base[key])});
      return result;
    }
    function validColor(value,fallback){return /^#[0-9a-f]{6}$/i.test(String(value||""))?String(value):fallback}
    function normalizeState(value){
      var result=clone(defaults);
      result.mode=value&&value.mode==="three"?"three":"one";result.current=clamp(Number(value&&value.current)||0,0,2);
      result.animation=["dynamic","soft","minimal"].indexOf(value&&value.animation)>=0?value.animation:result.animation;
      result.accentLast=value&&typeof value.accentLast==="boolean"?value.accentLast:result.accentLast;
      result.grain=value&&typeof value.grain==="boolean"?value.grain:result.grain;
      result.oneDuration=clamp(Number(value&&value.oneDuration)||result.oneDuration,4,10);
      result.sceneDuration=clamp(Number(value&&value.sceneDuration)||result.sceneDuration,2.5,6);
      Object.keys(result.colors).forEach(function(key){result.colors[key]=validColor(value&&value.colors&&value.colors[key],result.colors[key])});
      result.one=normalizeScene(value&&value.one,result.one);
      result.scenes=result.scenes.map(function(fallback,index){return normalizeScene(value&&value.scenes&&value.scenes[index],fallback)});
      return result;
    }
    function blobFromCanvas(target,type,quality){
      return new Promise(function(resolve,reject){target.toBlob(function(blob){blob?resolve(blob):reject(new Error("Tiedostoa ei voitu luoda"))},type,quality)});
    }
    function safeName(kind,extension){
      var mode=state.mode==="one"?"1-vaihe":"3-vaihetta";return "capra-mma-bjj-"+mode+"-"+kind+"."+extension;
    }
    async function deliverBlob(blob,name,title){
      var file;try{file=new File([blob],name,{type:blob.type})}catch(error){file=null}
      if(file&&navigator.share&&navigator.canShare&&navigator.canShare({files:[file]})){
        try{await navigator.share({title:title,files:[file]});return}
        catch(error){if(error&&error.name==="AbortError")return}
      }
      var url=URL.createObjectURL(blob),link=document.createElement("a");
      link.href=url;link.download=name;link.rel="noopener";document.body.appendChild(link);link.click();link.remove();
      window.setTimeout(function(){URL.revokeObjectURL(url)},30000);showToast("Tiedosto ladattu");
    }
    async function exportPng(){
      closeSheet();stopPlayback(false);ctx.clearRect(0,0,W,H);
      drawScene(currentScene(),.76,1,state.mode==="one"?0:state.current,false);
      try{var blob=await blobFromCanvas(canvas,"image/png",1);await deliverBlob(blob,safeName("kuva","png"),"Capra Combat -mainos")}
      catch(error){showToast("PNG-tallennus epäonnistui")}finally{renderStatic()}
    }
    function chooseVideoType(){
      if(!window.MediaRecorder)return "";
      var types=["video/mp4;codecs=avc1.42E01E","video/mp4","video/webm;codecs=vp9","video/webm;codecs=vp8","video/webm"];
      for(var i=0;i<types.length;i++)if(!MediaRecorder.isTypeSupported||MediaRecorder.isTypeSupported(types[i]))return types[i];
      return "";
    }
    function showProgress(percent,message){
      progress.classList.add("show");var value=clamp(percent,0,100);
      progressFill.style.width=value+"%";progressText.textContent=Math.round(value)+" %"+(message?" · "+message:"");
    }
    function hideProgress(){progress.classList.remove("show");progressFill.style.width="0%"}
    async function exportVideo(){
      if(exporting)return;closeSheet();stopPlayback(false);
      var mime=chooseVideoType();
      if(!canvas.captureStream||!window.MediaRecorder||!mime){
        showToast("Safari ei tue videovientiä. Käytä Esikatsele-tilaa ja näytön tallennusta.");togglePreview(true);return;
      }
      exporting=true;
      var duration=(state.mode==="one"?state.oneDuration:state.sceneDuration*3)*1000,chunks=[],stream,recorder;
      try{
        stream=canvas.captureStream(30);recorder=new MediaRecorder(stream,{mimeType:mime,videoBitsPerSecond:9000000});
        recorder.ondataavailable=function(event){if(event.data&&event.data.size)chunks.push(event.data)};
        var stopped=new Promise(function(resolve,reject){
          recorder.onstop=resolve;recorder.onerror=function(event){reject(event.error||new Error("Videon tallennus epäonnistui"))};
        });
        recorder.start(500);var started=performance.now();showProgress(0,"Pidä sivu avoinna");
        await new Promise(function(resolve){
          function recordFrame(now){
            var elapsed=Math.min(duration,now-started);drawTimeline(elapsed,{loop:false,editable:false});
            showProgress(elapsed/duration*100,"Pidä sivu avoinna");
            if(elapsed>=duration){resolve();return}requestAnimationFrame(recordFrame);
          }
          requestAnimationFrame(recordFrame);
        });
        await new Promise(function(resolve){window.setTimeout(resolve,180)});
        recorder.stop();await stopped;stream.getTracks().forEach(function(track){track.stop()});
        var actualType=recorder.mimeType||mime,extension=actualType.indexOf("mp4")>=0?"mp4":"webm",blob=new Blob(chunks,{type:actualType});
        hideProgress();await deliverBlob(blob,safeName("video",extension),"Capra Combat -animaatiomainos");
      }catch(error){
        if(stream)stream.getTracks().forEach(function(track){track.stop()});hideProgress();
        showToast("Videovienti ei onnistunut. Käytä Esikatsele-tilaa ja näytön tallennusta.");
      }finally{exporting=false;renderStatic()}
    }
    async function exportProject(){
      var data=JSON.stringify(state,null,2),blob=new Blob([data],{type:"application/json"});
      await deliverBlob(blob,safeName("projekti","capra.json"),"Capra Motion Studio -projekti");
    }
    async function handleProjectImport(event){
      var file=event.target.files&&event.target.files[0];event.target.value="";if(!file)return;
      try{
        var text=await file.text();state=normalizeState(JSON.parse(text));photoCache.clear();selectedKey="headline";
        setCssColors();syncModeUi();closeSheet();renderStatic();await saveProject(false);showToast("Projekti avattu");
      }catch(error){showToast("Projektitiedostoa ei voitu avata")}
    }
    function showToast(message){
      clearTimeout(toastTimer);toast.textContent=message;toast.classList.add("show");
      toastTimer=window.setTimeout(function(){toast.classList.remove("show")},2600);
    }
    function togglePreview(force){
      var open=typeof force==="boolean"?force:!document.body.classList.contains("previewMode");
      document.body.classList.toggle("previewMode",open);app.classList.toggle("previewMode",open);closeSheet();
      if(open)playTimeline();else renderStatic();
    }
    function pointFromEvent(event){
      var rect=canvas.getBoundingClientRect();return {x:(event.clientX-rect.left)*W/rect.width,y:(event.clientY-rect.top)*H/rect.height};
    }
    function findHit(point){
      for(var i=hitAreas.length-1;i>=0;i--){
        var area=hitAreas[i];
        if(point.x>=area.x&&point.x<=area.x+area.w&&point.y>=area.y&&point.y<=area.y+area.h)return area;
      }
      return null;
    }
    canvas.addEventListener("pointerdown",function(event){
      if(exporting)return;stopPlayback(false);renderStatic();
      var point=pointFromEvent(event),hit=findHit(point);if(!hit)return;
      selectedKey=hit.key;
      var item=currentScene().elements[selectedKey];
      drag={pointer:event.pointerId,startX:point.x,startY:point.y,originX:item.x,originY:item.y,moved:false};
      canvas.setPointerCapture(event.pointerId);renderStatic();if(activePanel==="elements")openElementsPanel();event.preventDefault();
    });
    canvas.addEventListener("pointermove",function(event){
      if(!drag||drag.pointer!==event.pointerId)return;
      var point=pointFromEvent(event),item=currentScene().elements[selectedKey];
      item.x=clamp(drag.originX+point.x-drag.startX,-600,600);
      item.y=clamp(drag.originY+point.y-drag.startY,-900,900);drag.moved=true;renderStatic();event.preventDefault();
    });
    function finishDrag(event){
      if(!drag||drag.pointer!==event.pointerId)return;
      try{canvas.releasePointerCapture(event.pointerId)}catch(error){}
      if(drag.moved)scheduleSave();drag=null;if(activePanel==="elements")openElementsPanel();
    }
    canvas.addEventListener("pointerup",finishDrag);canvas.addEventListener("pointercancel",finishDrag);
    document.getElementById("oneModeBtn").onclick=function(){setMode("one")};
    document.getElementById("threeModeBtn").onclick=function(){setMode("three")};
    sceneBar.querySelectorAll("button").forEach(function(button){button.onclick=function(){selectScene(button.dataset.scene)}});
    document.querySelectorAll(".tool").forEach(function(button){
      button.onclick=function(){
        if(activePanel===button.dataset.panel&&sheet.classList.contains("open"))closeSheet();else openPanel(button.dataset.panel);
      };
    });
    document.getElementById("playBtn").onclick=function(){playing?renderStatic():playTimeline()};
    document.getElementById("previewBtn").onclick=function(){togglePreview(true)};
    document.getElementById("exitPreviewBtn").onclick=function(){togglePreview(false)};
    document.getElementById("saveBtn").onclick=function(){saveProject(true)};
    photoInput.addEventListener("change",handlePhoto);projectInput.addEventListener("change",handleProjectImport);
    document.addEventListener("visibilitychange",function(){if(document.hidden&&playing)renderStatic()});
    window.addEventListener("pagehide",function(){saveProject(false)});
    async function init(){
      createGrain();await restoreProject();setCssColors();syncModeUi();
      if(document.fonts&&document.fonts.ready)await document.fonts.ready;
      renderStatic();prepareLogo();
      var query=new URLSearchParams(location.search);
      if(query.get("mode")==="three")setMode("three");if(query.get("mode")==="one")setMode("one");
    }
    init();
  })();
  </script>

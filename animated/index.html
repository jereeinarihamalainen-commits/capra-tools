<!doctype html>
<html lang="fi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#090a08">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <title>Capra Motion Studio</title>
  <style>
    :root {
      --olive: #68724a;
      --ochre: #c8ae4d;
      --ink: #090a08;
      --panel: #151713;
      --line: #30342b;
      --off-white: #f4f1e8;
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html,
    body {
      margin: 0;
      min-height: 100%;
      background: #070806;
      color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", Inter, Arial, sans-serif;
      -webkit-text-size-adjust: 100%;
    }

    body {
      min-height: 100svh;
      height: 100dvh;
      overflow: hidden;
    }

    button,
    input,
    textarea,
    select {
      font: inherit;
    }

    button,
    .uploadLabel {
      min-height: 44px;
      border: 1px solid var(--line);
      border-radius: 12px;
      background: #20231d;
      color: #fff;
      padding: 9px 12px;
      font-weight: 850;
      touch-action: manipulation;
    }

    button {
      cursor: pointer;
    }

    button:focus-visible,
    input:focus-visible,
    textarea:focus-visible,
    .uploadLabel:focus-visible {
      outline: 3px solid color-mix(in srgb, var(--ochre) 75%, white);
      outline-offset: 2px;
    }

    button:disabled {
      cursor: default;
      opacity: .42;
    }

    .gold {
      border-color: var(--ochre) !important;
      background: var(--ochre) !important;
      color: #111 !important;
    }

    .app {
      height: 100dvh;
      padding-top: env(safe-area-inset-top);
      display: flex;
      flex-direction: column;
    }

    header {
      height: 58px;
      flex: none;
      padding: 0 10px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      border-bottom: 1px solid #292c25;
      background: #0d0f0cf5;
      z-index: 40;
    }

    .homeLink {
      min-width: 0;
      min-height: 44px;
      display: flex;
      align-items: center;
      gap: 8px;
      color: inherit;
      text-decoration: none;
    }

    .headerLogo {
      width: 46px;
      flex: 0 0 46px;
    }

    .headerLogo img {
      display: block;
      width: 100%;
      height: auto;
      object-fit: contain;
    }

    .brandName {
      overflow: hidden;
      font-size: 11px;
      font-weight: 950;
      letter-spacing: .07em;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .actions {
      display: flex;
      gap: 6px;
    }

    .actions button {
      padding: 7px 9px;
      font-size: 11px;
    }

    .modebar {
      flex: none;
      padding: 7px 8px;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 7px;
      border-bottom: 1px solid #292c25;
      background: #0d0f0c;
      z-index: 35;
    }

    .modebar button.active {
      border-color: var(--olive);
      background: var(--olive);
    }

    .sceneBar {
      display: none;
      flex: none;
      padding: 7px 8px;
      gap: 7px;
      border-bottom: 1px solid #272a23;
      background: #0b0c0a;
      z-index: 34;
    }

    .sceneBar.show {
      display: flex;
    }

    .sceneBar button {
      min-width: 0;
      flex: 1;
      padding-inline: 5px;
      font-size: 11px;
      white-space: nowrap;
    }

    .sceneBar button.active {
      border-color: var(--ochre);
      background: var(--ochre);
      color: #111;
    }

    .work {
      position: relative;
      min-height: 0;
      flex: 1;
    }

    .viewport {
      height: 100%;
      padding: 10px 8px calc(96px + env(safe-area-inset-bottom));
      display: flex;
      justify-content: center;
      overflow: auto;
      overscroll-behavior: contain;
    }

    .shell {
      position: relative;
      width: min(100%, 540px);
      aspect-ratio: 4 / 5;
      flex: none;
    }

    .stage {
      position: absolute;
      left: 0;
      top: 0;
      width: 1080px;
      height: 1350px;
      overflow: hidden;
      border-radius: 18px;
      background: #111;
      box-shadow: 0 18px 50px #0009;
      transform-origin: 0 0;
    }

    .scene {
      position: absolute;
      inset: 0;
      overflow: hidden;
      opacity: 0;
      pointer-events: none;
      transform: translate3d(2.2%, 0, 0);
      transition: opacity .58s ease, transform .78s cubic-bezier(.2, .75, .25, 1);
      will-change: opacity, transform;
    }

    .scene.is-active {
      z-index: 2;
      opacity: 1;
      pointer-events: auto;
      transform: translate3d(0, 0, 0);
    }

    .scene.is-leaving {
      z-index: 1;
      opacity: 0;
      transform: translate3d(-1.8%, 0, 0);
    }

    .photo {
      position: absolute;
      inset: -34px;
      background-color: #11140f;
      background-image: radial-gradient(circle at 72% 25%, #596148 0, #262b20 29%, #0a0b09 72%);
      background-position: var(--pos-x, 50%) var(--pos-y, 50%);
      background-repeat: no-repeat;
      background-size: cover;
      transform: scale(var(--zoom, 1.03));
      transform-origin: var(--pos-x, 50%) var(--pos-y, 50%);
      will-change: transform;
    }

    .scene.is-active .photo {
      animation: kenBurns 4.4s ease-in-out both;
    }

    .shade {
      position: absolute;
      inset: 0;
      background:
        linear-gradient(90deg, rgba(6, 7, 5, .94) 0%, rgba(6, 7, 5, .73) 43%, rgba(6, 7, 5, .18) 78%),
        linear-gradient(0deg, rgba(6, 7, 5, .9), transparent 42%);
    }

    .texture {
      position: absolute;
      inset: 0;
      opacity: .065;
      background-image:
        linear-gradient(120deg, transparent 0 46%, #fff 47% 47.3%, transparent 48%),
        linear-gradient(#fff2 1px, transparent 1px);
      background-size: 100% 100%, 100% 92px;
      pointer-events: none;
    }

    .rail {
      position: absolute;
      left: 58px;
      top: 62px;
      bottom: 62px;
      width: 5px;
      background: var(--olive);
    }

    .rail::after {
      content: "";
      display: block;
      width: 5px;
      height: 28%;
      background: var(--ochre);
    }

    .sceneLogo {
      position: absolute;
      left: 68px;
      top: 34px;
      width: 250px;
    }

    .sceneLogo img {
      display: block;
      width: 100%;
      height: auto;
      object-fit: contain;
    }

    .kicker {
      position: absolute;
      left: 88px;
      top: 292px;
      max-width: 790px;
      color: #d8d8ce;
      font-size: 22px;
      font-weight: 900;
      letter-spacing: .18em;
      text-transform: uppercase;
    }

    .headline {
      position: absolute;
      left: 82px;
      top: 365px;
      width: 850px;
      color: var(--off-white);
      font-size: 112px;
      font-weight: 1000;
      letter-spacing: -.065em;
      line-height: .82;
      text-transform: uppercase;
      text-wrap: balance;
    }

    .headline.long {
      font-size: 91px;
      line-height: .86;
    }

    .headline.xlong {
      font-size: 77px;
      line-height: .9;
    }

    .headline em {
      color: var(--ochre);
      font-style: normal;
    }

    .accent {
      position: absolute;
      left: 88px;
      top: 705px;
      width: 130px;
      height: 7px;
      background: var(--ochre);
      transform-origin: left;
    }

    .bodycopy {
      position: absolute;
      left: 88px;
      top: 755px;
      width: 680px;
      color: #e1dfd8;
      font-size: 31px;
      font-weight: 620;
      line-height: 1.22;
      white-space: pre-line;
    }

    .bottomline {
      position: absolute;
      left: 88px;
      bottom: 185px;
      width: 790px;
      color: #d5d7ce;
      font-size: 20px;
      font-weight: 900;
      letter-spacing: .11em;
      text-transform: uppercase;
      white-space: pre-line;
    }

    .cta {
      position: absolute;
      left: 88px;
      bottom: 84px;
      max-width: 620px;
      padding: 20px 27px;
      background: var(--ochre);
      color: #111;
      font-size: 25px;
      font-weight: 1000;
      letter-spacing: .05em;
      text-transform: uppercase;
    }

    .info {
      position: absolute;
      right: 76px;
      bottom: 92px;
      max-width: 270px;
      color: #c7c9c0;
      font-size: 18px;
      font-weight: 750;
      line-height: 1.45;
      text-align: right;
      white-space: pre-line;
    }

    .sceneNum {
      position: absolute;
      right: 72px;
      top: 72px;
      color: #d4d5cc;
      font-size: 18px;
      font-weight: 900;
      letter-spacing: .16em;
    }

    .scene.is-active .sceneLogo,
    .scene.is-active .kicker {
      animation: fadeIn .8s .08s both;
    }

    .scene.is-active .headline {
      animation: headlineIn .82s .16s cubic-bezier(.16, .84, .28, 1) both;
    }

    .scene.is-active .accent {
      animation: accentWipe .66s .46s both;
    }

    .scene.is-active .bodycopy,
    .scene.is-active .bottomline,
    .scene.is-active .info {
      animation: lateIn .7s .58s both;
    }

    .scene.is-active .cta {
      animation: lateIn .7s .78s both;
    }

    .sheet {
      position: absolute;
      left: 8px;
      right: 8px;
      bottom: calc(88px + env(safe-area-inset-bottom));
      z-index: 25;
      display: none;
      max-height: min(56dvh, 540px);
      padding: 14px;
      overflow: auto;
      border: 1px solid var(--line);
      border-radius: 22px;
      background: #151713fb;
      backdrop-filter: blur(20px);
      -webkit-overflow-scrolling: touch;
    }

    .sheet.open {
      display: block;
    }

    .sheet h3 {
      margin: 4px 0 12px;
      font-size: 12px;
      letter-spacing: .13em;
      text-transform: uppercase;
    }

    .sheet p {
      margin: 6px 0 12px;
      color: #9ea298;
      font-size: 12px;
      line-height: 1.45;
    }

    .toolbar {
      position: absolute;
      left: 8px;
      right: 8px;
      bottom: calc(8px + env(safe-area-inset-bottom));
      z-index: 26;
      height: 72px;
      padding: 6px;
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      border: 1px solid var(--line);
      border-radius: 20px;
      background: #171915f7;
      backdrop-filter: blur(20px);
    }

    .tool {
      border: 0;
      background: transparent;
      padding: 4px;
      font-size: 11px;
    }

    .tool b {
      display: block;
      margin-bottom: 3px;
      font-size: 19px;
    }

    .row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }

    label {
      display: block;
      margin: 8px 0;
      color: #adb1a6;
      font-size: 11px;
    }

    input,
    textarea,
    select {
      width: 100%;
      min-height: 44px;
      margin-top: 5px;
      padding: 11px;
      border: 1px solid #393d34;
      border-radius: 11px;
      background: #0f100e;
      color: #fff;
      font-size: 16px;
    }

    input[type="range"] {
      padding: 0;
    }

    input[type="color"] {
      padding: 5px;
    }

    textarea {
      min-height: 72px;
      resize: vertical;
    }

    .rangeLabel {
      display: grid;
      grid-template-columns: 78px 1fr 48px;
      align-items: center;
      gap: 8px;
    }

    .rangeLabel input {
      margin: 0;
    }

    .rangeLabel output {
      color: #fff;
      font-size: 12px;
      text-align: right;
    }

    .uploadLabel {
      width: 100%;
      margin: 8px 0 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-color: var(--ochre);
      background: var(--ochre);
      color: #111;
      cursor: pointer;
      text-align: center;
    }

    .fileName {
      margin: 5px 0 12px;
      overflow: hidden;
      color: #c7c9c0;
      font-size: 11px;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .buttonGrid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 7px;
    }

    .buttonGrid .gold {
      grid-column: 1 / -1;
    }

    .toast {
      position: fixed;
      left: 50%;
      bottom: calc(94px + env(safe-area-inset-bottom));
      z-index: 80;
      max-width: min(88vw, 420px);
      padding: 10px 14px;
      border: 1px solid #3a3e35;
      border-radius: 999px;
      background: #11130ff2;
      color: #fff;
      font-size: 12px;
      font-weight: 750;
      text-align: center;
      opacity: 0;
      pointer-events: none;
      transform: translate(-50%, 10px);
      transition: opacity .2s ease, transform .2s ease;
    }

    .toast.show {
      opacity: 1;
      transform: translate(-50%, 0);
    }

    .exitPreview {
      position: fixed;
      top: calc(10px + env(safe-area-inset-top));
      right: 10px;
      z-index: 90;
      display: none;
      border-color: #ffffff50;
      background: #0d0f0cdb;
    }

    .previewMode header,
    .previewMode .modebar,
    .previewMode .sceneBar,
    .previewMode .toolbar,
    .previewMode .sheet {
      display: none !important;
    }

    .previewMode .exitPreview {
      display: block;
    }

    .previewMode .viewport {
      padding: 0;
      align-items: center;
      background: #000;
    }

    .previewMode .shell {
      width: min(100vw, calc(100dvh * .8));
      max-width: none;
    }

    .previewMode .stage {
      border-radius: 0;
      box-shadow: none;
    }

    @keyframes kenBurns {
      from { transform: scale(var(--zoom, 1.03)) translate3d(0, 0, 0); }
      to { transform: scale(calc(var(--zoom, 1.03) + .065)) translate3d(-10px, -6px, 0); }
    }

    @keyframes headlineIn {
      from { opacity: 0; transform: translate3d(0, 72px, 0); }
      to { opacity: 1; transform: translate3d(0, 0, 0); }
    }

    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    @keyframes accentWipe {
      from { transform: scaleX(0); }
      to { transform: scaleX(1); }
    }

    @keyframes lateIn {
      from { opacity: 0; transform: translate3d(0, 22px, 0); }
      to { opacity: 1; transform: translate3d(0, 0, 0); }
    }

    @media (max-width: 430px) {
      .brandName {
        display: none;
      }

      .actions button {
        padding-inline: 8px;
      }

      .sceneBar button {
        font-size: 10px;
      }

      .sheet {
        max-height: 58dvh;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        scroll-behavior: auto !important;
        animation-duration: .01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: .01ms !important;
      }
    }
  </style>
</head>
<body>
  <div class="app" id="app">
    <header>
      <a class="homeLink" href="../" aria-label="Takaisin Capra Toolsiin">
        <span class="headerLogo">
          <img src="../assets/capra-logo-light.jpeg" alt="Capra Combat">
        </span>
        <span class="brandName">CAPRA MOTION STUDIO</span>
      </a>
      <div class="actions">
        <button id="saveBtn" type="button">Tallenna</button>
        <button class="gold" id="previewBtn" type="button">Preview</button>
      </div>
    </header>

    <div class="modebar" aria-label="Mainoksen vaiheiden määrä">
      <button id="oneModeBtn" class="active" type="button" aria-pressed="true">1 VAIHE</button>
      <button id="threeModeBtn" type="button" aria-pressed="false">3 VAIHETTA</button>
    </div>

    <div class="sceneBar" id="sceneBar" aria-label="Muokattava vaihe">
      <button data-scene="0" class="active" type="button">1 · HOOK</button>
      <button data-scene="1" type="button">2 · HYÖTY</button>
      <button data-scene="2" type="button">3 · CTA</button>
    </div>

    <div class="work">
      <div class="viewport">
        <div class="shell" id="shell">
          <div class="stage" id="stage" aria-label="Mainoksen esikatselu"></div>
        </div>
      </div>

      <div class="sheet" id="sheet"></div>

      <div class="toolbar" aria-label="Muokkaustyökalut">
        <button class="tool" id="contentBtn" type="button"><b>✎</b>Tekstit</button>
        <button class="tool" id="imagesBtn" type="button"><b>▧</b>Kuvat</button>
        <button class="tool" id="styleBtn" type="button"><b>◐</b>Tyyli</button>
        <button class="tool" id="playBtn" type="button"><b>▶</b><span>Play</span></button>
      </div>
    </div>
  </div>

  <button class="exitPreview" id="exitPreviewBtn" type="button">Muokkaa</button>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <input id="imageInput" type="file" accept="image/*,.heic,.heif" hidden>

  <script>
    const STORAGE_KEY = 'capraMotionV6';
    const LEGACY_STORAGE_KEY = 'capraMotionV4';
    const SCENE_DURATION = 4300;
    const $ = id => document.getElementById(id);
    const app = $('app');
    const stage = $('stage');
    const shell = $('shell');
    const sheet = $('sheet');
    const sceneBar = $('sceneBar');
    const imageInput = $('imageInput');
    const toast = $('toast');

    const makeScene = (values = {}) => ({
      kicker: '',
      headline: '',
      body: '',
      bottom: '',
      cta: '',
      info: '',
      image: '',
      imageName: '',
      zoom: 1.03,
      x: 50,
      y: 50,
      ...values
    });

    const defaults = {
      version: 6,
      mode: 'one',
      current: 0,
      olive: '#68724a',
      ochre: '#c8ae4d',
      one: makeScene({
        kicker: 'PERUSKURSSIT · KUOPIO',
        headline: 'ALOITA\nKAMPPAILU.',
        body: 'Et tarvitse aiempaa kokemusta tai valmista kuntoa. Tule sellaisena kuin olet.',
        bottom: 'BJJ · LUKKOPAINI · VAPAAOTTELU · MUAY THAI / K1',
        cta: 'VARAA PAIKKASI →',
        info: '8 VKO · 120 €\ncapracombat.fi'
      }),
      scenes: [
        makeScene({
          kicker: '1 · ENSIMMÄINEN ASKEL',
          headline: 'OLETKO JOSKUS HALUNNUT\nKOKEILLA KAMPPAILUA?',
          body: 'Peruskurssi on tehty juuri sitä ensimmäistä askelta varten.',
          bottom: 'CAPRA COMBAT · KUOPIO',
          cta: 'KATSO KURSSIT →',
          info: 'Kaikki lähtee perusteista'
        }),
        makeScene({
          kicker: '2 · MATALA KYNNYS',
          headline: 'SINUN EI\nTARVITSE OSATA.',
          body: 'Lähdemme liikkeelle perusteista. Lähtötasosi saa olla mikä tahansa.',
          bottom: 'TURVALLINEN · SELKEÄ · VAATIVA',
          cta: 'TULE MUKAAN →',
          info: 'Ei aiempaa kokemusta'
        }),
        makeScene({
          kicker: '3 · OTA ENSIMMÄINEN ASKEL',
          headline: 'PERUSKURSSIT\nALKAVAT.',
          body: 'Valitse lajisi ja varaa paikka. Tule kokeilemaan, voisiko tästä tulla sinun lajisi.',
          bottom: 'BJJ · LUKKOPAINI · VAPAAOTTELU · MUAY THAI / K1',
          cta: 'VARAA PAIKKASI →',
          info: '8 VKO · 120 €\ncapracombat.fi'
        })
      ]
    };

    let state = clone(defaults);
    let activePanel = '';
    let imageTarget = { mode: 'one', index: 0 };
    let playTimer = 0;
    let isPlaying = false;
    let toastTimer = 0;

    function clone(value) {
      return JSON.parse(JSON.stringify(value));
    }

    function escapeHtml(value = '') {
      return String(value).replace(/[&<>"']/g, character => ({
        '&': '&amp;',
        '<': '&lt;',
        '>': '&gt;',
        '"': '&quot;',
        "'": '&#039;'
      })[character]);
    }

    function lines(value = '') {
      return escapeHtml(value).replace(/\n/g, '<br>');
    }

    function headlineHtml(value = '') {
      const parts = String(value).split('\n');
      return parts.map((part, index) => (
        index === parts.length - 1 ? `<em>${escapeHtml(part)}</em>` : escapeHtml(part)
      )).join('<br>');
    }

    function currentScene() {
      return state.mode === 'one' ? state.one : state.scenes[state.current];
    }

    function sceneFromTarget(target) {
      return target.mode === 'one' ? state.one : state.scenes[target.index];
    }

    function sceneMarkup(scene, index, showNumber) {
      const length = scene.headline.replace(/\s/g, '').length;
      const lengthClass = length > 50 ? 'xlong' : length > 35 ? 'long' : '';
      return `
        <section class="scene" data-scene="${index}">
          <div class="photo"></div>
          <div class="shade"></div>
          <div class="texture"></div>
          <div class="rail"></div>
          <div class="sceneLogo">
            <img src="../assets/capra-logo-light.jpeg" alt="Capra Combat" draggable="false">
          </div>
          <div class="kicker">${escapeHtml(scene.kicker)}</div>
          <div class="headline ${lengthClass}">${headlineHtml(scene.headline)}</div>
          <div class="accent"></div>
          <div class="bodycopy">${escapeHtml(scene.body)}</div>
          <div class="bottomline">${escapeHtml(scene.bottom)}</div>
          <div class="cta">${escapeHtml(scene.cta)}</div>
          <div class="info">${escapeHtml(scene.info)}</div>
          ${showNumber ? `<div class="sceneNum">0${index + 1}/03</div>` : ''}
        </section>`;
    }

    function applyPhoto(sceneElement, scene) {
      const photo = sceneElement.querySelector('.photo');
      photo.style.setProperty('--zoom', String(scene.zoom));
      photo.style.setProperty('--pos-x', `${scene.x}%`);
      photo.style.setProperty('--pos-y', `${scene.y}%`);
      photo.style.backgroundImage = scene.image
        ? `url("${scene.image}")`
        : 'radial-gradient(circle at 72% 25%, #596148 0, #262b20 29%, #0a0b09 72%)';
    }

    function renderStage({ animate = true } = {}) {
      const scenes = state.mode === 'one' ? [state.one] : state.scenes;
      stage.innerHTML = scenes.map((scene, index) => sceneMarkup(scene, index, state.mode === 'three')).join('');
      stage.querySelectorAll('.scene').forEach((element, index) => applyPhoto(element, scenes[index]));
      activateScene(state.mode === 'one' ? 0 : state.current, { restart: animate });
      fit();
    }

    function activateScene(index, { restart = true } = {}) {
      const elements = [...stage.querySelectorAll('.scene')];
      const previouslyActive = elements.find(element => element.classList.contains('is-active'));
      const next = elements[index];
      if (!next) return;

      elements.forEach(element => element.classList.remove('is-leaving'));
      if (previouslyActive && previouslyActive !== next) {
        previouslyActive.classList.remove('is-active');
        previouslyActive.classList.add('is-leaving');
        window.setTimeout(() => previouslyActive.classList.remove('is-leaving'), 850);
      }

      elements.forEach((element, elementIndex) => {
        if (elementIndex !== index && element !== previouslyActive) element.classList.remove('is-active');
      });

      next.classList.add('is-active');
      if (restart) restartSceneAnimations(next);
      syncSceneButtons();
    }

    function restartSceneAnimations(sceneElement) {
      sceneElement.querySelectorAll('.photo,.sceneLogo,.kicker,.headline,.accent,.bodycopy,.bottomline,.cta,.info')
        .forEach(element => {
          element.style.animation = 'none';
          void element.offsetWidth;
          element.style.animation = '';
        });
    }

    function fit() {
      const scale = shell.clientWidth / 1080;
      stage.style.transform = `scale(${scale})`;
      shell.style.height = `${1350 * scale}px`;
    }

    function syncModeControls() {
      const isThree = state.mode === 'three';
      $('oneModeBtn').classList.toggle('active', !isThree);
      $('threeModeBtn').classList.toggle('active', isThree);
      $('oneModeBtn').setAttribute('aria-pressed', String(!isThree));
      $('threeModeBtn').setAttribute('aria-pressed', String(isThree));
      sceneBar.classList.toggle('show', isThree);
      syncSceneButtons();
    }

    function syncSceneButtons() {
      sceneBar.querySelectorAll('button').forEach(button => {
        const active = Number(button.dataset.scene) === state.current;
        button.classList.toggle('active', active);
        button.setAttribute('aria-pressed', String(active));
      });
    }

    function setMode(mode) {
      stopPlayback();
      state.mode = mode;
      state.current = 0;
      activePanel = '';
      sheet.classList.remove('open');
      syncModeControls();
      renderStage();
    }

    function selectScene(index) {
      stopPlayback();
      state.current = index;
      imageTarget = { mode: 'three', index };
      activateScene(index);
      if (activePanel) openPanel(activePanel);
    }

    function openSheet(html) {
      sheet.innerHTML = html;
      sheet.classList.add('open');
    }

    function openPanel(panel) {
      activePanel = panel;
      if (panel === 'content') openContentPanel();
      if (panel === 'image') openImagePanel();
      if (panel === 'style') openStylePanel();
    }

    function openContentPanel() {
      const scene = currentScene();
      openSheet(`
        <h3>${state.mode === 'three' ? `VAIHE ${state.current + 1} / 3` : '1 VAIHE'} · TEKSTIT</h3>
        <label>Yläteksti
          <input data-field="kicker" value="${escapeHtml(scene.kicker)}">
        </label>
        <label>Pääotsikko
          <textarea data-field="headline">${escapeHtml(scene.headline)}</textarea>
        </label>
        <label>Leipäteksti
          <textarea data-field="body">${escapeHtml(scene.body)}</textarea>
        </label>
        <label>Alarivi
          <textarea data-field="bottom">${escapeHtml(scene.bottom)}</textarea>
        </label>
        <div class="row">
          <label>CTA
            <input data-field="cta" value="${escapeHtml(scene.cta)}">
          </label>
          <label>Infoteksti
            <textarea data-field="info">${escapeHtml(scene.info)}</textarea>
          </label>
        </div>`);

      sheet.querySelectorAll('[data-field]').forEach(field => {
        field.addEventListener('input', event => {
          currentScene()[event.target.dataset.field] = event.target.value;
          renderStage({ animate: false });
        });
      });
    }

    function openImagePanel() {
      imageTarget = { mode: state.mode, index: state.current };
      const scene = currentScene();
      openSheet(`
        <h3>${state.mode === 'three' ? `VAIHE ${state.current + 1} / 3` : 'MAINOS'} · KUVA</h3>
        <p>${state.mode === 'three'
          ? 'Valitse tälle vaiheelle oma kuva tai kopioi sama kuva kaikkiin kolmeen vaiheeseen.'
          : 'Valitse mainoksen taustakuva iPhonen Kuvat-apista.'}</p>
        <label class="uploadLabel" for="imageInput" id="chooseImageLabel" tabindex="0">VAIHDA KUVA</label>
        <div class="fileName">${scene.imageName ? `Nykyinen: ${escapeHtml(scene.imageName)}` : 'Ei omaa kuvaa valittuna'}</div>
        <label class="rangeLabel"><span>Zoom</span>
          <input id="imageZoom" type="range" min="1" max="1.8" step=".01" value="${scene.zoom}">
          <output id="imageZoomOut">${Math.round(scene.zoom * 100)}%</output>
        </label>
        <label class="rangeLabel"><span>Vaaka</span>
          <input id="imageX" type="range" min="0" max="100" step="1" value="${scene.x}">
          <output id="imageXOut">${Math.round(scene.x)}%</output>
        </label>
        <label class="rangeLabel"><span>Pysty</span>
          <input id="imageY" type="range" min="0" max="100" step="1" value="${scene.y}">
          <output id="imageYOut">${Math.round(scene.y)}%</output>
        </label>
        <div class="buttonGrid">
          <button id="resetCropBtn" type="button">Palauta rajaus</button>
          <button id="removeImageBtn" type="button">Poista kuva</button>
          <button id="copyImageBtn" class="gold" type="button" ${state.mode === 'one' ? 'disabled' : ''}>Sama kuva kaikkiin</button>
        </div>`);

      const updateCrop = () => {
        const target = currentScene();
        target.zoom = Number($('imageZoom').value);
        target.x = Number($('imageX').value);
        target.y = Number($('imageY').value);
        $('imageZoomOut').value = `${Math.round(target.zoom * 100)}%`;
        $('imageXOut').value = `${Math.round(target.x)}%`;
        $('imageYOut').value = `${Math.round(target.y)}%`;
        const sceneElement = stage.querySelector(`.scene[data-scene="${state.mode === 'one' ? 0 : state.current}"]`);
        if (sceneElement) applyPhoto(sceneElement, target);
      };

      ['imageZoom', 'imageX', 'imageY'].forEach(id => $(id).addEventListener('input', updateCrop));
      $('resetCropBtn').onclick = () => {
        Object.assign(currentScene(), { zoom: 1.03, x: 50, y: 50 });
        openImagePanel();
        renderStage({ animate: false });
      };
      $('removeImageBtn').onclick = () => {
        Object.assign(currentScene(), { image: '', imageName: '', zoom: 1.03, x: 50, y: 50 });
        renderStage({ animate: false });
        openImagePanel();
      };
      $('copyImageBtn').onclick = () => {
        const source = currentScene();
        state.scenes.forEach(sceneTarget => {
          Object.assign(sceneTarget, {
            image: source.image,
            imageName: source.imageName,
            zoom: source.zoom,
            x: source.x,
            y: source.y
          });
        });
        renderStage({ animate: false });
        showToast('Sama kuva kopioitu kaikkiin vaiheisiin');
      };
      $('chooseImageLabel').addEventListener('keydown', event => {
        if (event.key === 'Enter' || event.key === ' ') {
          event.preventDefault();
          imageInput.click();
        }
      });
    }

    function openStylePanel() {
      openSheet(`
        <h3>CAPRA-TYYLI</h3>
        <div class="row">
          <label>Oliivi
            <input id="oliveInput" type="color" value="${state.olive}">
          </label>
          <label>Okra
            <input id="ochreInput" type="color" value="${state.ochre}">
          </label>
        </div>
        <p>Virallinen Capra Combat -master-logo näkyy jokaisessa vaiheessa alkuperäisessä 1:1-kuvasuhteessa.</p>`);

      $('oliveInput').oninput = event => {
        state.olive = event.target.value;
        document.documentElement.style.setProperty('--olive', state.olive);
      };
      $('ochreInput').oninput = event => {
        state.ochre = event.target.value;
        document.documentElement.style.setProperty('--ochre', state.ochre);
      };
    }

    function play() {
      sheet.classList.remove('open');
      stopPlayback();
      isPlaying = true;
      syncPlayButton();

      if (state.mode === 'one') {
        state.current = 0;
        activateScene(0);
        return;
      }

      state.current = 0;
      activateScene(0);
      scheduleNextScene();
    }

    function scheduleNextScene() {
      clearTimeout(playTimer);
      playTimer = window.setTimeout(() => {
        if (!isPlaying || state.mode !== 'three') return;
        state.current = (state.current + 1) % 3;
        imageTarget = { mode: 'three', index: state.current };
        activateScene(state.current);
        scheduleNextScene();
      }, SCENE_DURATION);
    }

    function stopPlayback(updateButton = true) {
      clearTimeout(playTimer);
      playTimer = 0;
      isPlaying = false;
      if (updateButton) syncPlayButton();
    }

    function syncPlayButton() {
      $('playBtn').querySelector('b').textContent = isPlaying ? '↻' : '▶';
      $('playBtn').querySelector('span').textContent = isPlaying ? 'Restart' : 'Play';
    }

    function togglePreview(force) {
      const shouldOpen = typeof force === 'boolean' ? force : !app.classList.contains('previewMode');
      app.classList.toggle('previewMode', shouldOpen);
      document.body.classList.toggle('previewMode', shouldOpen);
      sheet.classList.remove('open');
      window.setTimeout(fit, 30);
      if (shouldOpen) play();
      else stopPlayback();
    }

    function saveProject() {
      try {
        const payload = JSON.stringify(state);
        localStorage.setItem(STORAGE_KEY, payload);
        showToast('Projekti tallennettu tähän laitteeseen');
      } catch (error) {
        showToast('Tallennus ei mahtunut selaimeen. Käytä pienempiä kuvia.');
      }
    }

    function restoreProject() {
      try {
        const saved = localStorage.getItem(STORAGE_KEY);
        if (saved) {
          state = normalizeState(JSON.parse(saved));
          showToast('Tallennettu projekti palautettu');
          return;
        }

        const legacy = localStorage.getItem(LEGACY_STORAGE_KEY);
        if (legacy) state = migrateLegacy(JSON.parse(legacy));
      } catch (error) {
        state = clone(defaults);
      }
    }

    function normalizeScene(scene, fallback) {
      const supplied = Object.fromEntries(
        Object.entries(scene || {}).filter(([, value]) => value !== undefined && value !== null)
      );
      return makeScene({ ...fallback, ...supplied });
    }

    function normalizeState(value) {
      const result = clone(defaults);
      result.mode = value.mode === 'three' ? 'three' : 'one';
      result.current = Math.max(0, Math.min(2, Number(value.current) || 0));
      result.olive = /^#[0-9a-f]{6}$/i.test(value.olive) ? value.olive : result.olive;
      result.ochre = /^#[0-9a-f]{6}$/i.test(value.ochre) ? value.ochre : result.ochre;
      result.one = normalizeScene(value.one, result.one);
      result.scenes = result.scenes.map((fallback, index) => normalizeScene(value.scenes?.[index], fallback));
      return result;
    }

    function migrateLegacy(value) {
      const result = clone(defaults);
      const mapScene = (legacy, fallback) => normalizeScene({
        kicker: legacy?.k,
        headline: legacy?.h,
        body: legacy?.b,
        bottom: legacy?.s,
        cta: legacy?.c,
        info: legacy?.m,
        image: legacy?.img,
        imageName: legacy?.file
      }, fallback);
      result.mode = value.mode === 'three' ? 'three' : 'one';
      result.one = mapScene(value.scenes?.[0], result.one);
      result.scenes = result.scenes.map((fallback, index) => mapScene(value.scenes?.[index + 1], fallback));
      return result;
    }

    function readFileAsDataURL(file) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = () => resolve(reader.result);
        reader.onerror = () => reject(reader.error || new Error('Kuvan lukeminen epäonnistui'));
        reader.readAsDataURL(file);
      });
    }

    function loadImage(source) {
      return new Promise((resolve, reject) => {
        const image = new Image();
        image.onload = () => resolve(image);
        image.onerror = () => reject(new Error('Kuvan avaaminen epäonnistui'));
        image.src = source;
      });
    }

    async function optimizeImage(source) {
      try {
        const image = await loadImage(source);
        const maxDimension = 1900;
        const scale = Math.min(1, maxDimension / Math.max(image.naturalWidth, image.naturalHeight));
        const canvas = document.createElement('canvas');
        canvas.width = Math.max(1, Math.round(image.naturalWidth * scale));
        canvas.height = Math.max(1, Math.round(image.naturalHeight * scale));
        canvas.getContext('2d', { alpha: false }).drawImage(image, 0, 0, canvas.width, canvas.height);
        return canvas.toDataURL('image/jpeg', .88);
      } catch (error) {
        return source;
      }
    }

    async function handleImageSelection(event) {
      const file = event.target.files?.[0];
      event.target.value = '';
      if (!file) return;

      const targetReference = { ...imageTarget };
      const targetScene = sceneFromTarget(targetReference);
      showToast('Kuvaa käsitellään…');

      try {
        const source = await readFileAsDataURL(file);
        targetScene.image = await optimizeImage(source);
        targetScene.imageName = file.name || 'iPhone-kuva';
        targetScene.zoom = 1.03;
        targetScene.x = 50;
        targetScene.y = 50;
        renderStage({ animate: false });
        if (activePanel === 'image') openImagePanel();
        showToast('Kuva vaihdettu');
      } catch (error) {
        showToast('Kuvaa ei voitu lukea. Kokeile JPEG- tai PNG-kuvaa.');
      }
    }

    function showToast(message) {
      clearTimeout(toastTimer);
      toast.textContent = message;
      toast.classList.add('show');
      toastTimer = window.setTimeout(() => toast.classList.remove('show'), 2200);
    }

    $('oneModeBtn').onclick = () => setMode('one');
    $('threeModeBtn').onclick = () => setMode('three');
    sceneBar.querySelectorAll('button').forEach(button => {
      button.onclick = () => selectScene(Number(button.dataset.scene));
    });
    $('contentBtn').onclick = () => openPanel('content');
    $('imagesBtn').onclick = () => openPanel('image');
    $('styleBtn').onclick = () => openPanel('style');
    $('playBtn').onclick = play;
    $('previewBtn').onclick = () => togglePreview(true);
    $('exitPreviewBtn').onclick = () => togglePreview(false);
    $('saveBtn').onclick = saveProject;
    imageInput.addEventListener('change', handleImageSelection);
    window.addEventListener('resize', fit);
    window.addEventListener('orientationchange', () => window.setTimeout(fit, 120));
    document.addEventListener('visibilitychange', () => {
      if (document.hidden && isPlaying) stopPlayback();
    });

    restoreProject();
    document.documentElement.style.setProperty('--olive', state.olive);
    document.documentElement.style.setProperty('--ochre', state.ochre);
    syncModeControls();
    renderStage();
  </script>
</body>
</html>

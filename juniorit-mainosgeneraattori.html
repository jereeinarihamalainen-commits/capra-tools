<!DOCTYPE html>
<html lang="fi">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Capra Juniorit – Instagram Mainosgeneraattori</title>
<style>
  :root{--ink:#11110f;--cream:#f2efe5;--olive:#788257;--gold:#d0ad3e;--muted:#c9c5b9;--white:#fff}
  *{box-sizing:border-box}
  body{margin:0;background:#0d0e0c;color:#f5f2e9;font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
  .app{display:grid;grid-template-columns:360px 1fr;min-height:100vh}
  .panel{padding:22px;border-right:1px solid #2a2d26;background:#141611;overflow:auto;position:sticky;top:0;height:100vh}
  .panel h1{font-size:22px;margin:0 0 6px;letter-spacing:-.02em}.panel p{margin:0 0 18px;color:#aeb4a6;font-size:13px;line-height:1.45}
  .tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:0 0 18px}.tab{border:1px solid #3a3d35;background:#1d2019;color:#eae7de;padding:10px 8px;border-radius:10px;font-weight:800;cursor:pointer}.tab.active{background:var(--olive);border-color:var(--olive);color:#fff}
  label{display:block;font-size:11px;text-transform:uppercase;letter-spacing:.14em;color:#aeb4a6;margin:13px 0 6px;font-weight:800}
  input,textarea{width:100%;background:#0f110d;color:#f5f2e9;border:1px solid #35382f;border-radius:9px;padding:10px 11px;font:inherit;font-size:13px;outline:none}textarea{min-height:70px;resize:vertical}input:focus,textarea:focus{border-color:#7f8b5b}
  .row{display:grid;grid-template-columns:1fr 1fr;gap:10px}.btns{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:18px}button.action{border:0;border-radius:10px;padding:12px 10px;font-weight:900;cursor:pointer}.primary{background:var(--gold);color:#111}.secondary{background:#2a2e24;color:#fff}.tiny{font-size:11px;color:#8f9589;margin-top:10px;line-height:1.4}
  .stage-wrap{display:flex;align-items:center;justify-content:center;padding:28px;overflow:auto;background:#0b0c0a}.scale{transform-origin:top center}.poster{width:1080px;height:1350px;position:relative;overflow:hidden;background:var(--cream);color:var(--ink);box-shadow:0 30px 80px rgba(0,0,0,.45)}
  .gridlines:before{content:"";position:absolute;inset:0;pointer-events:none;opacity:.11;background-image:linear-gradient(rgba(0,0,0,.18) 1px,transparent 1px),linear-gradient(90deg,rgba(0,0,0,.18) 1px,transparent 1px);background-size:80px 80px}
  .brand{display:flex;align-items:center;gap:16px;font-weight:900;letter-spacing:.12em;font-size:27px}.mark{width:44px;height:44px}.brand small{display:block;font-size:12px;letter-spacing:.22em;font-weight:700;margin-top:3px}
  .photo{background:#333 center/cover no-repeat;position:absolute;overflow:hidden}.photo::after{content:"";position:absolute;inset:0}.eyebrow{font-size:20px;font-weight:900;letter-spacing:.16em;text-transform:uppercase}.title{font-size:92px;line-height:.94;letter-spacing:-.055em;font-weight:950;margin:0}.desc{font-size:31px;line-height:1.35}.meta{font-size:27px;line-height:1.45;font-weight:800}.cta{display:inline-flex;align-items:center;justify-content:center;background:var(--gold);padding:18px 26px;font-size:24px;font-weight:950}.olive{color:var(--olive)}.gold{color:var(--gold)}
  .t1{background:var(--cream)}.t1 .left{position:absolute;left:0;top:0;width:72%;height:100%;background:#111;color:white;padding:74px 66px 66px;z-index:2}.t1 .left .photo{left:0;right:0;top:0;height:100%;opacity:.58}.t1 .left .photo::after{background:linear-gradient(90deg,rgba(0,0,0,.84),rgba(0,0,0,.2)),linear-gradient(0deg,rgba(0,0,0,.7),transparent 50%)}.t1 .content{position:relative;z-index:3}.t1 .brand{margin-bottom:92px}.t1 .title{max-width:690px}.t1 .desc{max-width:640px;margin-top:34px}.t1 .right{position:absolute;right:0;top:0;width:28%;height:100%;padding:74px 42px;background:var(--cream)}.t1 .date-label{font-size:18px;letter-spacing:.16em;font-weight:900;text-transform:uppercase;color:var(--olive);margin-top:210px}.t1 .date{font-size:74px;font-weight:950;letter-spacing:-.05em;margin:12px 0 40px}.t1 .rule{height:1px;background:#b8b3a7;margin:30px 0}.t1 .right .meta{font-size:22px}.t1 .bottom{position:absolute;left:0;bottom:0;width:72%;height:180px;background:var(--olive);z-index:4;display:grid;grid-template-columns:repeat(3,1fr);color:white}.t1 .bottom>div{padding:38px 26px;border-right:1px solid rgba(255,255,255,.2)}.t1 .bottom span{display:block;font-size:14px;letter-spacing:.12em;text-transform:uppercase;opacity:.8;margin-bottom:8px}.t1 .bottom b{font-size:24px}.t1 .right .cta{position:absolute;bottom:55px;left:42px;right:42px}
  .t2{background:var(--cream);padding:58px 64px}.t2 .topbar{display:flex;justify-content:space-between;align-items:center;position:relative;z-index:2}.t2 .season{font-size:18px;letter-spacing:.16em;font-weight:900;text-transform:uppercase}.t2 .hero2{display:grid;grid-template-columns:1.1fr .9fr;gap:36px;margin-top:64px;height:650px;position:relative;z-index:2}.t2 .title{font-size:84px}.t2 .desc{font-size:28px;margin-top:26px;max-width:520px}.t2 .points{margin-top:34px;display:grid;gap:14px;font-size:24px;font-weight:800}.t2 .points div:before{content:"✓";margin-right:14px;color:var(--olive);font-weight:950}.t2 .photo{position:relative;width:100%;height:100%;background-color:#d9d6ca}.t2 .info{position:absolute;left:64px;right:64px;bottom:58px;height:350px;background:#12130f;color:white;padding:48px 54px;display:grid;grid-template-columns:1.25fr 1fr;gap:50px;z-index:2}.t2 .info h3{font-size:42px;margin:0 0 14px;line-height:1}.t2 .info p{font-size:22px;line-height:1.45;margin:0;color:#d9ddd1}.t2 .stats{display:grid;grid-template-columns:1fr 1fr;gap:18px}.t2 .stat{border-left:3px solid var(--gold);padding-left:16px}.t2 .stat small{font-size:13px;letter-spacing:.13em;text-transform:uppercase;color:#aeb4a6}.t2 .stat b{display:block;font-size:25px;margin-top:5px}.t2 .cta{position:absolute;right:54px;bottom:36px}
  .t3{background:#111;color:white}.t3 .photo{inset:0}.t3 .photo::after{background:linear-gradient(0deg,rgba(0,0,0,.92) 0%,rgba(0,0,0,.36) 52%,rgba(0,0,0,.55) 100%)}.t3 .noise{position:absolute;inset:0;z-index:2;opacity:.14;background-image:radial-gradient(#fff .6px,transparent .6px);background-size:6px 6px}.t3 .head{position:absolute;left:64px;right:64px;top:58px;display:flex;justify-content:space-between;align-items:flex-start;z-index:4}.t3 .badge{border:2px solid var(--gold);padding:10px 14px;font-size:16px;letter-spacing:.15em;text-transform:uppercase;font-weight:900}.t3 .main{position:absolute;left:64px;right:64px;bottom:278px;z-index:4}.t3 .eyebrow{color:var(--gold);margin-bottom:18px}.t3 .title{font-size:112px;max-width:880px}.t3 .desc{font-size:30px;max-width:760px;margin-top:26px;color:#e5e1d7}.t3 .footer{position:absolute;left:0;right:0;bottom:0;height:210px;background:var(--olive);z-index:5;display:grid;grid-template-columns:1fr 1fr 1fr}.t3 .footer>div{padding:36px 44px;border-right:1px solid rgba(255,255,255,.22)}.t3 .footer small{display:block;font-size:14px;letter-spacing:.13em;text-transform:uppercase;opacity:.75}.t3 .footer b{display:block;font-size:28px;margin-top:10px}
  @media(max-width:900px){.app{display:block}.panel{position:relative;height:auto;border-right:0;border-bottom:1px solid #2a2d26}.stage-wrap{padding:14px}}
</style>
</head>
<body>
<div class="app">
<aside class="panel">
<h1>Capra Juniorit – Mainosgeneraattori</h1><p>3 valmista 4:5 Instagram-pohjaa. Muokkaa tekstit, lisää oma treenikuva ja tallenna PNG.</p>
<div class="tabs"><button class="tab active" data-t="1">Pohja 1</button><button class="tab" data-t="2">Pohja 2</button><button class="tab" data-t="3">Pohja 3</button></div>
<label>Pääotsikko</label><textarea id="title">Vahva alku. Hyvässä porukassa.</textarea>
<label>Yläteksti</label><input id="eyebrow" value="Uusi junioriryhmä · syksy 2026">
<label>Kuvausteksti</label><textarea id="desc">Brasilialaista jujutsua ja lukkopainia 7–13-vuotiaille. Liikettä, taitoja ja oppimista turvallisessa porukassa.</textarea>
<div class="row"><div><label>Aloitus</label><input id="date" value="17.9."></div><div><label>Hinta</label><input id="price" value="99 €"></div></div>
<label>Harjoitusajat</label><textarea id="times">Torstaisin 16.30–17.45
Lauantaisin 11.00–12.00</textarea>
<label>CTA</label><input id="cta" value="ILMOITTAUDU MUKAAN"><label>Linkki</label><input id="url" value="capracombat.fi/juniorit">
<label>Taustakuva</label><input id="photoInput" type="file" accept="image/*"><label>Oma logo (valinnainen)</label><input id="logoInput" type="file" accept="image/*">
<div class="btns"><button class="action secondary" id="reset">Palauta tekstit</button><button class="action primary" id="download">Tallenna PNG</button></div>
<div class="tiny">PNG tallentuu koossa 1080 × 1350 px.</div>
</aside>
<main class="stage-wrap"><div class="scale" id="scale"><div class="poster t1 gridlines" id="poster"></div></div></main>
</div>
<script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
<script>
const state={template:1,title:"Vahva alku. Hyvässä porukassa.",eyebrow:"Uusi junioriryhmä · syksy 2026",desc:"Brasilialaista jujutsua ja lukkopainia 7–13-vuotiaille. Liikettä, taitoja ja oppimista turvallisessa porukassa.",date:"17.9.",price:"99 €",times:"Torstaisin 16.30–17.45\nLauantaisin 11.00–12.00",cta:"ILMOITTAUDU MUKAAN",url:"capracombat.fi/juniorit",photo:"",logo:""};
const goatSVG=`<svg class="mark" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M11 11l12 7 9 14 9-14 12-7-8 13-6 4-7 24-7-24-6-4-8-13z" stroke="currentColor" stroke-width="4" stroke-linejoin="round"/></svg>`;
function brand(){return state.logo?`<img src="${state.logo}" style="max-height:55px;max-width:235px;object-fit:contain">`:`<div class="brand">${goatSVG}<div>CAPRA<small>COMBAT · KUOPIO</small></div></div>`}
function nl(s){return s.replace(/\n/g,"<br>")}function photoStyle(){const img=state.photo?`url('${state.photo}')`:`linear-gradient(135deg,#2b3028,#737a65)`;return `background-image:${img}`}
function render(){const p=document.getElementById("poster");p.className=`poster t${state.template} gridlines`;if(state.template===1){const words=state.title.split(" "),pivot=Math.max(1,Math.floor(words.length/2)),title=words.slice(0,pivot).join(" ")+"<br><span class='olive'>"+words.slice(pivot).join(" ")+"</span>";p.innerHTML=`<section class="left"><div class="photo" style="${photoStyle()}"></div><div class="content">${brand()}<div class="eyebrow gold">${state.eyebrow}</div><h2 class="title">${title}</h2><div class="desc">${state.desc}</div></div></section><aside class="right"><div class="date-label">Kausi alkaa</div><div class="date">${state.date}</div><div class="rule"></div><div class="meta">${nl(state.times)}<br><br>${state.price} / syyskausi</div><div class="cta">${state.cta}</div></aside><div class="bottom"><div><span>Laji</span><b>BJJ & lukkopaini</b></div><div><span>Ikä</span><b>7–13 v</b></div><div><span>Lisätiedot</span><b>${state.url}</b></div></div>`}else if(state.template===2){p.innerHTML=`<div class="topbar">${brand()}<div class="season">${state.eyebrow}</div></div><div class="hero2"><div><h2 class="title">${state.title.replace("Hyvässä porukassa.","<span class='olive'>Hyvässä porukassa.</span>")}</h2><div class="desc">${state.desc}</div><div class="points"><div>Itseluottamusta ja liikettä</div><div>Turvallinen harjoitteluympäristö</div><div>Uusia taitoja ja kavereita</div></div></div><div class="photo" style="${photoStyle()}"></div></div><div class="info"><div><h3>Tule mukaan uuteen junioriryhmään.</h3><p>Brasilialaista jujutsua ja lukkopainia aloittelijaystävällisesti 7–13-vuotiaille.</p></div><div class="stats"><div class="stat"><small>Aloitus</small><b>${state.date}</b></div><div class="stat"><small>Hinta</small><b>${state.price}</b></div><div class="stat"><small>Harjoitukset</small><b>${nl(state.times)}</b></div><div class="stat"><small>Ilmoittautuminen</small><b>${state.url}</b></div></div><div class="cta">${state.cta}</div></div>`}else{p.innerHTML=`<div class="photo" style="${photoStyle()}"></div><div class="noise"></div><div class="head">${brand()}<div class="badge">7–13-vuotiaille</div></div><div class="main"><div class="eyebrow">${state.eyebrow}</div><h2 class="title">${state.title}</h2><div class="desc">${state.desc}</div></div><div class="footer"><div><small>Kausi alkaa</small><b>${state.date}</b></div><div><small>Harjoitukset</small><b>${nl(state.times)}</b></div><div><small>Syyskausi</small><b>${state.price}</b><div class="cta" style="margin-top:18px">${state.cta}</div></div></div>`}fit()}
function fit(){const w=document.querySelector(".stage-wrap").clientWidth-40,h=window.innerHeight-40,s=Math.min(w/1080,h/1350,.72);document.getElementById("scale").style.transform=`scale(${s})`;document.getElementById("scale").style.width=1080*s+"px";document.getElementById("scale").style.height=1350*s+"px"}
["title","eyebrow","desc","date","price","times","cta","url"].forEach(id=>document.getElementById(id).addEventListener("input",e=>{state[id]=e.target.value;render()}));
document.querySelectorAll(".tab").forEach(btn=>btn.addEventListener("click",()=>{document.querySelectorAll(".tab").forEach(b=>b.classList.remove("active"));btn.classList.add("active");state.template=Number(btn.dataset.t);render()}));
function fileToDataURL(file,cb){const r=new FileReader();r.onload=()=>cb(r.result);r.readAsDataURL(file)}document.getElementById("photoInput").addEventListener("change",e=>{const f=e.target.files[0];if(f)fileToDataURL(f,d=>{state.photo=d;render()})});document.getElementById("logoInput").addEventListener("change",e=>{const f=e.target.files[0];if(f)fileToDataURL(f,d=>{state.logo=d;render()})});
document.getElementById("reset").addEventListener("click",()=>{Object.assign(state,{title:"Vahva alku. Hyvässä porukassa.",eyebrow:"Uusi junioriryhmä · syksy 2026",desc:"Brasilialaista jujutsua ja lukkopainia 7–13-vuotiaille. Liikettä, taitoja ja oppimista turvallisessa porukassa.",date:"17.9.",price:"99 €",times:"Torstaisin 16.30–17.45\nLauantaisin 11.00–12.00",cta:"ILMOITTAUDU MUKAAN",url:"capracombat.fi/juniorit"});["title","eyebrow","desc","date","price","times","cta","url"].forEach(id=>document.getElementById(id).value=state[id]);render()});
document.getElementById("download").addEventListener("click",async()=>{if(typeof html2canvas==="undefined"){alert("PNG-vienti tarvitsee verkkoyhteyden ensimmäisellä avauskerralla.");return}const poster=document.getElementById("poster"),canvas=await html2canvas(poster,{scale:1,useCORS:true,backgroundColor:null,width:1080,height:1350}),a=document.createElement("a");a.download=`capra-juniorit-pohja-${state.template}.png`;a.href=canvas.toDataURL("image/png");a.click()});window.addEventListener("resize",fit);render();
</script>
</body>
</html>

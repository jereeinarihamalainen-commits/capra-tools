<!doctype html><html lang="fi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0d0f0c"><title>Capra Reels Cover Studio</title><style>:root{--panel:#151814;--text:#f4f2e9;--muted:#a5aa9b;--olive:#68724a;--ochre:#c8ae4d;--line:#2a3026;--cream:#f0ede2}*{box-sizing:border-box}body{margin:0;background:linear-gradient(180deg,#0c0e0b,#121510);color:var(--text);font-family:Inter,-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",sans-serif}button,input{font:inherit}.app{max-width:1120px;margin:auto;padding:env(safe-area-inset-top) 14px calc(22px + env(safe-area-inset-bottom))}header{display:flex;align-items:center;justify-content:space-between;padding:14px 2px 10px}.brand{display:flex;gap:11px;align-items:center}.logoMark{width:40px;height:40px;border:1px solid #41483a;border-radius:12px;display:grid;place-items:center;font-weight:900}h1{font-size:17px;margin:0}.sub,.note{font-size:11px;color:var(--muted)}.pill{border:1px solid var(--line);padding:7px 10px;border-radius:999px;font-size:10px;color:var(--muted)}.layout{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(320px,.75fr);gap:14px}.card{background:#151814;border:1px solid var(--line);border-radius:18px;overflow:hidden}.previewWrap{background:#080908;display:grid;place-items:center;padding:12px;min-height:690px}#stage{position:relative;aspect-ratio:9/16;height:min(74vh,720px);max-width:100%;background:#191b18;overflow:hidden;border-radius:14px;touch-action:none}#photo{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;user-select:none;pointer-events:none}.overlay{position:absolute;inset:0;pointer-events:none}.tint{position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.10),rgba(0,0,0,.03) 44%,rgba(0,0,0,.56) 100%)}.topline{position:absolute;left:6.2%;right:6.2%;top:4.8%;display:flex;justify-content:space-between;font-size:1.5vh;letter-spacing:.15em;font-weight:700}.accent,.kicker{color:var(--ochre)}.titleBlock{position:absolute;left:6.2%;right:6.2%;bottom:11.5%}.kicker{font-size:1.45vh;letter-spacing:.15em;margin-bottom:.8vh;font-weight:800}.mainTitle{font-size:4.2vh;line-height:.93;font-weight:950;letter-spacing:-.045em;text-transform:uppercase;text-shadow:0 2px 14px #0007}.secondary{font-size:1.55vh;letter-spacing:.06em;margin-top:1.2vh;font-weight:650}.brandBottom{position:absolute;left:6.2%;right:6.2%;bottom:4.8%;display:flex;justify-content:space-between;font-size:1.28vh;letter-spacing:.12em;font-weight:700}.hero .tint{background:linear-gradient(90deg,rgba(4,6,4,.74),rgba(4,6,4,.22) 62%,rgba(4,6,4,.08)),linear-gradient(180deg,rgba(0,0,0,.15),rgba(0,0,0,.45))}.hero .titleBlock{bottom:15%}.hero .mainTitle{font-size:4.8vh}.heroBar{display:none}.hero .heroBar{display:block;position:absolute;left:6.2%;right:6.2%;bottom:9.1%;height:.38vh;background:linear-gradient(90deg,var(--ochre) 0 34%,#ffffff4d 34%)}.guides{position:absolute;inset:0;pointer-events:none;display:none}.guides.show{display:block}.gridSafe{position:absolute;left:0;right:0;top:12.5%;bottom:12.5%;border-top:1px dashed #fffb;border-bottom:1px dashed #fffb}.empty{position:absolute;inset:0;display:grid;place-items:center;text-align:center;background:#121510;z-index:3;padding:25px}.uploadBtn{display:inline-flex;background:var(--cream);color:#0d0f0c;padding:12px 16px;border-radius:12px;font-weight:850}.hidden,.file{display:none!important}.toolbar{display:flex;gap:8px;padding:10px;background:#11140f;border-top:1px solid var(--line);flex-wrap:wrap}.toolbar button,.toolbar label{border:1px solid var(--line);background:#1a1e18;color:var(--text);padding:10px 12px;border-radius:10px}.toolbar .primary{background:var(--ochre);color:#15130a;border-color:transparent;font-weight:900}.panel{padding:14px}.section{padding:13px 0;border-bottom:1px solid var(--line)}.section h2{font-size:11px;letter-spacing:.13em;text-transform:uppercase;margin:0 0 10px}.modeGrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.mode{border:1px solid var(--line);background:#11140f;color:var(--text);padding:11px;border-radius:12px;text-align:left}.mode b{display:block;font-size:12px}.mode span{font-size:10px;color:var(--muted)}.mode.active{border-color:var(--ochre)}.field{margin:10px 0}.field label{display:block;font-size:10px;color:var(--muted);margin-bottom:5px}input[type=text]{width:100%;border:1px solid var(--line);background:#10130f;color:var(--text);border-radius:10px;padding:11px}.rangeRow{display:grid;grid-template-columns:76px 1fr 42px;gap:8px;align-items:center;margin:10px 0}.rangeRow label,.rangeRow output{font-size:11px}.rangeRow output{color:var(--muted)}input[type=range]{width:100%;accent-color:var(--ochre)}.presetTexts{display:flex;gap:6px;flex-wrap:wrap}.chip{border:1px solid var(--line);background:#10130f;color:#ddd;padding:7px 9px;border-radius:999px;font-size:10px}@media(max-width:820px){.layout{grid-template-columns:1fr}.previewWrap{min-height:auto;padding:8px}#stage{height:min(66vh,650px)}.card.previewCard{position:sticky;top:0;z-index:10}.pill{display:none}}</style></head><body><div class="app"><header><div class="brand"><div class="logoMark">C</div><div><h1>CAPRA REELS COVER STUDIO</h1><div class="sub">Yhtenäiset Reels-kannet · iPhone optimized</div></div></div><div class="pill">1080 × 1920 · GRID SAFE</div></header><div class="layout"><div class="card previewCard"><div class="previewWrap"><div id="stage"><img id="photo"><div id="empty" class="empty"><div><h2>Lisää Reels-kuva</h2><p>Valitse videosta screenshot tai muu kuva.</p><label for="file" class="uploadBtn">Valitse kuva</label></div></div><div class="overlay"><div class="tint"></div><div class="topline"><span>CAPRA COMBAT · KUOPIO</span><span class="accent" id="topRight">TRAINING</span></div><div class="titleBlock"><div class="kicker" id="kickerView">PERJANTAI</div><div class="mainTitle" id="titleView">LUKKOPAINI</div><div class="secondary" id="subView">AAMUTREENIT · 07:00</div></div><div class="heroBar"></div><div class="brandBottom"><span>CAPRA COMBAT</span><span>KUOPIO</span></div></div><div class="guides" id="guides"><div class="gridSafe"></div></div></div></div><div class="toolbar"><label for="file">Vaihda kuva</label><button id="centerBtn">Keskitä</button><button id="guideBtn">Grid-ohje</button><button class="primary" id="exportBtn">Tallenna 1080×1920</button></div></div><div class="card"><div class="panel"><div class="section"><h2>Kansityyli</h2><div class="modeGrid"><button class="mode active" data-mode="training"><b>Training / Everyday</b><span>Treeni, sparri, fiilis.</span></button><button class="mode" data-mode="hero"><b>Hero / Campaign</b><span>Kurssit, kisat, tapahtumat.</span></button></div></div><div class="section"><h2>Tekstit</h2><div class="field"><label>Pieni yläotsikko</label><input id="kickerInput" type="text" value="PERJANTAI"></div><div class="field"><label>Pääotsikko</label><input id="titleInput" type="text" value="LUKKOPAINI"></div><div class="field"><label>Alateksti</label><input id="subInput" type="text" value="AAMUTREENIT · 07:00"></div><div class="field"><label>Oikea ylänurkka</label><input id="topInput" type="text" value="TRAINING"></div><div class="presetTexts"><button class="chip" data-k="KESKIVIIKKO" data-t="BRASILIALAINEN JIUJITSU" data-s="TREENIT · CAPRA COMBAT">BJJ</button><button class="chip" data-k="PERJANTAI" data-t="LUKKOPAINI" data-s="AAMUTREENIT · 07:00">Lukkopaini</button><button class="chip" data-k="KESKIVIIKKO" data-t="VAPAAOTTELU" data-s="MMA · CAPRA COMBAT">MMA</button><button class="chip" data-k="TORSTAI" data-t="MUAY THAI" data-s="STRIKING · CAPRA COMBAT">Muay Thai</button></div></div><div class="section"><h2>Kuva</h2><div class="rangeRow"><label>Zoom</label><input id="zoom" type="range" min="1" max="3" value="1" step=".01"><output id="zoomOut">1.00×</output></div><div class="rangeRow"><label>Tummennus</label><input id="dark" type="range" min="0" max="70" value="10"><output id="darkOut">10%</output></div><div class="rangeRow"><label>Kontrasti</label><input id="contrast" type="range" min="70" max="150" value="105"><output id="contrastOut">105%</output></div><div class="rangeRow"><label>Saturaatio</label><input id="saturation" type="range" min="40" max="140" value="92"><output id="saturationOut">92%</output></div></div></div></div></div><input class="file" id="file" type="file" accept="image/*"></div><script>const $=s=>document.querySelector(s),stage=$('#stage'),photo=$('#photo');let imgURL=null,posX=0,posY=0,scale=1,dragging=false,sx=0,sy=0,startX=0,startY=0,mode='training';function syncText(){$('#kickerView').textContent=$('#kickerInput').value;$('#titleView').textContent=$('#titleInput').value;$('#subView').textContent=$('#subInput').value;$('#topRight').textContent=$('#topInput').value}['kickerInput','titleInput','subInput','topInput'].forEach(id=>$('#'+id).oninput=syncText);document.querySelectorAll('.mode').forEach(b=>b.onclick=()=>{mode=b.dataset.mode;document.querySelectorAll('.mode').forEach(x=>x.classList.toggle('active',x===b));stage.classList.toggle('hero',mode==='hero')});document.querySelectorAll('.chip').forEach(c=>c.onclick=()=>{$('#kickerInput').value=c.dataset.k;$('#titleInput').value=c.dataset.t;$('#subInput').value=c.dataset.s;syncText()});function update(){photo.style.transform=`translate(${posX}px,${posY}px) scale(${scale})`;photo.style.filter=`contrast(${$('#contrast').value}%) saturate(${$('#saturation').value}%) brightness(${1-(+$('#dark').value/100)})`}$('#zoom').oninput=e=>{scale=+e.target.value;$('#zoomOut').value=scale.toFixed(2)+'×';update()};['dark','contrast','saturation'].forEach(id=>$('#'+id).oninput=e=>{$('#'+id+'Out').value=e.target.value+'%';update()});$('#file').onchange=e=>{let f=e.target.files[0];if(!f)return;if(imgURL)URL.revokeObjectURL(imgURL);imgURL=URL.createObjectURL(f);photo.src=imgURL;$('#empty').classList.add('hidden');posX=posY=0;scale=1;update()};stage.onpointerdown=e=>{if(!photo.src)return;dragging=true;stage.setPointerCapture(e.pointerId);sx=e.clientX;sy=e.clientY;startX=posX;startY=posY};stage.onpointermove=e=>{if(dragging){posX=startX+e.clientX-sx;posY=startY+e.clientY-sy;update()}};stage.onpointerup=()=>dragging=false;$('#centerBtn').onclick=()=>{posX=posY=0;scale=1;$('#zoom').value=1;update()};$('#guideBtn').onclick=()=>$('#guides').classList.toggle('show');$('#exportBtn').onclick=async()=>{if(!photo.src)return alert('Lisää ensin kuva.');const W=1080,H=1920,c=document.createElement('canvas');c.width=W;c.height=H;const x=c.getContext('2d'),im=new Image();im.src=photo.src;await im.decode();const base=Math.max(W/im.naturalWidth,H/im.naturalHeight),dw=im.naturalWidth*base*scale,dh=im.naturalHeight*base*scale,r=stage.getBoundingClientRect(),px=posX/r.width*W,py=posY/r.height*H;x.filter=`contrast(${$('#contrast').value}%) saturate(${$('#saturation').value}%) brightness(${1-(+$('#dark').value/100)})`;x.drawImage(im,(W-dw)/2+px,(H-dh)/2+py,dw,dh);x.filter='none';let g=x.createLinearGradient(0,0,0,H);g.addColorStop(0,'rgba(0,0,0,.1)');g.addColorStop(1,'rgba(0,0,0,.58)');x.fillStyle=g;x.fillRect(0,0,W,H);const L=67,R=W-67;x.fillStyle='#f4f2e9';x.font='700 22px Arial';x.fillText('CAPRA COMBAT · KUOPIO',L,92);x.fillStyle='#c8ae4d';x.textAlign='right';x.fillText($('#topInput').value.toUpperCase(),R,92);x.textAlign='left';let y=mode==='hero'?1290:1375;x.font='800 22px Arial';x.fillText($('#kickerInput').value.toUpperCase(),L,y);x.fillStyle='#f4f2e9';x.font='900 76px Arial';let words=$('#titleInput').value.toUpperCase().split(' '),lines=[],line='';for(let w of words){let t=line?line+' '+w:w;if(x.measureText(t).width>W-134&&line){lines.push(line);line=w}else line=t}if(line)lines.push(line);let ty=y+42;lines.slice(0,3).forEach(l=>{x.fillText(l,L,ty);ty+=76});x.font='650 25px Arial';x.fillText($('#subInput').value.toUpperCase(),L,ty+12);x.font='700 19px Arial';x.fillText('CAPRA COMBAT',L,1810);x.textAlign='right';x.fillText('KUOPIO',R,1810);c.toBlob(blob=>{let a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=`capra-reels-cover-${Date.now()}.jpg`;a.click()},'image/jpeg',.94)};syncText();update();</script></body></html>

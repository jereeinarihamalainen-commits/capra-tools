<!doctype html>
<html lang="fi">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width,initial-scale=1,viewport-fit=cover"
    />
    <title>Capra Ladies Studio</title>
    <script src="../vendor/html2canvas.min.js"></script>
    <script src="../vendor/capra-image.js"></script>
    <style>
      :root {
        --pink: #f33b8e;
        --bg: #09090b;
        --fg: #fff;
        --mut: #c9c9cf;
      }
      * {
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
      }
      html,
      body {
        margin: 0;
        background: #09090b;
        color: #fff;
        font-family:
          -apple-system, BlinkMacSystemFont, Inter, Arial, sans-serif;
      }
      body {
        min-height: 100svh;
        height: 100dvh;
        overflow: hidden;
      }
      button,
      input,
      textarea,
      select {
        font: inherit;
      }
      .app {
        height: 100dvh;
        display: flex;
        flex-direction: column;
        padding-top: env(safe-area-inset-top);
      }
      header {
        height: 56px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 0 10px;
        background: #111116;
        border-bottom: 1px solid #292933;
        z-index: 30;
      }
      header a {
        min-height: 44px;
        display: inline-flex;
        align-items: center;
        color: #fff;
        text-decoration: none;
        font-size: 12px;
        font-weight: 900;
      }
      header strong {
        font-size: 12px;
        letter-spacing: 0.05em;
      }
      .actions {
        display: flex;
        gap: 6px;
      }
      .btn {
        min-height: 44px;
        border: 1px solid #363641;
        background: #1b1b21;
        color: #fff;
        border-radius: 10px;
        padding: 8px 9px;
        font-weight: 800;
        font-size: 11px;
        touch-action: manipulation;
      }
      .btn.pink {
        background: var(--pink);
        border-color: var(--pink);
      }
      .work {
        flex: 1;
        min-height: 0;
        position: relative;
      }
      .viewport {
        height: 100%;
        overflow: auto;
        padding: 10px 8px calc(98px + env(safe-area-inset-bottom));
        display: flex;
        justify-content: center;
      }
      .shell {
        width: min(100%, 430px);
        position: relative;
        aspect-ratio: 4/5;
      }
      .canvas {
        width: 1080px;
        height: 1350px;
        position: absolute;
        left: 0;
        top: 0;
        transform-origin: 0 0;
        overflow: hidden;
        background: var(--bg);
        box-shadow: 0 15px 45px #0009;
        border-radius: 18px;
      }
      .photo {
        position: absolute;
        inset: 0;
        background-size: cover;
        background-position: center;
        opacity: 0.72;
      }
      .shade {
        position: absolute;
        inset: 0;
        background: linear-gradient(180deg, #0002, #0005 45%, #000e);
      }
      .pinkbar {
        position: absolute;
        background: var(--pink);
        height: 20px;
        width: 210px;
        left: 72px;
        top: 242px;
      }
      .small {
        position: absolute;
        left: 72px;
        top: 200px;
        font-size: 25px;
        font-weight: 900;
        letter-spacing: 0.13em;
      }
      .title {
        position: absolute;
        left: 72px;
        top: 315px;
        width: 860px;
        font-size: 106px;
        line-height: 0.84;
        font-weight: 1000;
        letter-spacing: -0.055em;
        text-transform: uppercase;
      }
      .title span {
        color: var(--pink);
      }
      .bodycopy {
        position: absolute;
        left: 76px;
        top: 775px;
        width: 720px;
        font-size: 31px;
        line-height: 1.22;
        font-weight: 650;
      }
      .tag {
        position: absolute;
        left: 72px;
        bottom: 76px;
        font-size: 23px;
        font-weight: 900;
        letter-spacing: 0.08em;
        border: 2px solid #fff5;
        padding: 12px 15px;
      }
      .brandLogo {
        position: absolute;
        right: 54px;
        top: 38px;
        width: 220px;
      }

      .brandLogo img {
        display: block;
        width: 100%;
        height: auto;
        object-fit: contain;
      }
      .editor {
        position: absolute;
        left: 8px;
        right: 8px;
        bottom: calc(8px + env(safe-area-inset-bottom));
        z-index: 40;
        background: #141419f8;
        border: 1px solid #30303a;
        border-radius: 20px;
        padding: 7px;
        display: grid;
        grid-template-columns: repeat(5, 1fr);
        gap: 4px;
      }
      .editor button {
        min-height: 52px;
        border: 0;
        background: transparent;
        color: #ddd;
        padding: 8px 2px;
        font-size: 10px;
        font-weight: 800;
        touch-action: manipulation;
      }
      .sheet {
        display: none;
        position: absolute;
        left: 8px;
        right: 8px;
        bottom: calc(84px + env(safe-area-inset-bottom));
        max-height: 50dvh;
        overflow: auto;
        background: #15151bfb;
        border: 1px solid #32323d;
        border-radius: 20px;
        padding: 14px;
        z-index: 39;
      }
      .sheet.open {
        display: block;
      }
      .sheet h3 {
        font-size: 11px;
        text-transform: uppercase;
        letter-spacing: 0.13em;
        color: #bbb;
        margin: 3px 0 11px;
      }
      .sheet label {
        display: block;
        font-size: 10px;
        color: #aaa;
        margin: 8px 0;
      }
      .sheet input,
      .sheet textarea,
      .sheet select {
        width: 100%;
        min-height: 44px;
        margin-top: 5px;
        background: #0e0e13;
        color: #fff;
        border: 1px solid #373742;
        border-radius: 10px;
        padding: 10px;
        font-size: 16px;
      }
      .sheet textarea {
        min-height: 70px;
      }
      .grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 7px;
      }
      .tpl {
        min-height: 44px;
        border: 1px solid #3a3a45;
        background: #19191f;
        color: #fff;
        border-radius: 11px;
        padding: 11px;
        text-align: left;
        font-size: 11px;
        font-weight: 800;
      }

      .uploadBtn {
        width: 100%;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
      }
      .preview header,
      .preview .editor,
      .preview .sheet {
        display: none;
      }
      .preview .viewport {
        padding: 0;
        align-items: center;
        background: #000;
      }
      .preview .shell {
        width: 100vw;
      }
      .preview .canvas {
        border-radius: 0;
      }

      .previewExit {
        position: fixed;
        top: calc(10px + env(safe-area-inset-top));
        right: 10px;
        z-index: 80;
        display: none;
      }

      body.previewOn .previewExit {
        display: block;
      }
      .safe:after {
        content: "";
        position: absolute;
        inset: 70px;
        border: 3px dashed #fff4;
        pointer-events: none;
      }
      @media (min-width: 700px) {
        .shell {
          max-width: 540px;
        }
      }
    </style>
  </head>
  <body>
    <div class="app" id="app">
      <header>
        <a href="../">← Tools</a><strong>COMBAT LADIES</strong>
        <div class="actions">
          <button class="btn" onclick="save()">Save</button
          ><button class="btn pink" id="pv" onclick="preview()">Preview</button>
        </div>
      </header>
      <div class="work">
        <div class="viewport">
          <div class="shell" id="shell">
            <div class="canvas" id="canvas">
              <div class="photo" id="photo"></div>
              <div class="shade"></div>
              <div class="brandLogo">
                <img
                  src="../assets/capra-logo-light.jpeg"
                  alt="Capra Combat"
                  draggable="false"
                />
              </div>
              <div class="small" id="small">CAPRA COMBAT LADIES</div>
              <div class="pinkbar"></div>
              <div class="title" id="title">
                OMA TILA.<br /><span>OMA PORUKKA.</span>
              </div>
              <div class="bodycopy" id="copy">
                Kamppailua ilman turhaa kynnystä. Tule mukaan juuri sellaisena
                kuin olet.
              </div>
              <div class="tag" id="tag">KUOPIO · CAPRACOMBAT.FI</div>
            </div>
          </div>
        </div>
        <div class="sheet" id="sheet"></div>
        <div class="editor">
          <button onclick="templates()">▦<br />Template</button
          ><button onclick="texts()">✎<br />Teksti</button
          ><button onclick="openImagePanel()">▧<br />Kuva</button
          ><button onclick="styleS()">◐<br />Tyyli</button
          ><button onclick="exportPng()">⇩<br />PNG</button>
        </div>
      </div>
    </div>
    <button class="btn previewExit" id="previewExit" type="button">
      Muokkaa
    </button>
    <input id="file" type="file" accept="image/*" hidden />
    <script>
      const app = document.getElementById("app"),
        shell = document.getElementById("shell"),
        canvas = document.getElementById("canvas"),
        sheet = document.getElementById("sheet"),
        photo = document.getElementById("photo"),
        file = document.getElementById("file"),
        small = document.getElementById("small"),
        title = document.getElementById("title"),
        copy = document.getElementById("copy"),
        tag = document.getElementById("tag"),
        previewButton = document.getElementById("pv"),
        previewExitButton = document.getElementById("previewExit");
      function fit() {
        const s = shell.clientWidth / 1080;
        canvas.style.transform = `scale(${s})`;
        shell.style.height = 1350 * s + "px";
      }
      addEventListener("resize", fit);
      fit();
      const T = [
        [
          "training",
          "TREENI.\nFIILIS.",
          "Yhdessä tekeminen, hyvä energia ja turvallinen ympäristö kehittyä.",
          "TREENIT TÄNÄÄN",
        ],
        [
          "start",
          "ALOITA.\nOMALLA TAVALLA.",
          "Et tarvitse kokemusta, kuntoa tai valmista osaamista. Me opetamme perusteet.",
          "TULE KOKEILEMAAN",
        ],
        [
          "community",
          "OMA TILA.\nOMA PORUKKA.",
          "Kamppailua ilman turhaa kynnystä. Tule mukaan juuri sellaisena kuin olet.",
          "CAPRA LADIES",
        ],
        [
          "event",
          "LADIES\nOPEN MAT.",
          "Rento treeni, uusia kierroksia ja hyvä porukka.",
          "KATSO AIKA",
        ],
        [
          "quote",
          "VAHVA EI\nTARKOITA KOVAA.",
          "Tekniikka, rohkeus ja yhteisö kasvavat treeni treeniltä.",
          "CAPRA COMBAT",
        ],
      ];
      function openS(h) {
        sheet.innerHTML = h;
        sheet.classList.add("open");
      }
      function templates() {
        openS(
          '<h3>Valitse template</h3><div class="grid">' +
            T.map(
              (x, i) =>
                `<button class="tpl" onclick="useTpl(${i})">${x[0]}</button>`,
            ).join("") +
            "</div>",
        );
      }
      function useTpl(i) {
        const t = T[i];
        title.innerHTML = t[1]
          .split("\n")
          .map((x, j, a) => (j === a.length - 1 ? `<span>${x}</span>` : x))
          .join("<br>");
        copy.textContent = t[2];
        tag.textContent = t[3];
        sheet.classList.remove("open");
      }
      function texts() {
        openS(
          `<h3>Tekstit</h3><label>Pieni otsikko<input id="textSmall" value="${small.textContent}"></label><label>Pääotsikko<textarea id="textTitle">${title.innerText}</textarea></label><label>Leipäteksti<textarea id="textBody">${copy.textContent}</textarea></label><label>Alatagi<input id="textTag" value="${tag.textContent}"></label>`,
        );
        document.getElementById("textSmall").oninput = (e) =>
          (small.textContent = e.target.value);
        document.getElementById("textTitle").oninput = (e) => {
          const q = e.target.value.split("\n");
          title.innerHTML = q
            .map((x, j, a) => (j === a.length - 1 ? `<span>${x}</span>` : x))
            .join("<br>");
        };
        document.getElementById("textBody").oninput = (e) =>
          (copy.textContent = e.target.value);
        document.getElementById("textTag").oninput = (e) =>
          (tag.textContent = e.target.value);
      }
      function openImagePanel() {
        openS(
          '<h3>Kuva</h3><label class="btn pink uploadBtn" for="file">Vaihda kuva</label><label>Peittävyys<input id="imageOpacity" type="range" min="0" max="100" value="72"></label><label>Kuvan paikka<input id="imageY" type="range" min="0" max="100" value="50"></label>',
        );
        document.getElementById("imageOpacity").oninput = (e) =>
          (photo.style.opacity = e.target.value / 100);
        document.getElementById("imageY").oninput = (e) =>
          (photo.style.backgroundPosition = `50% ${e.target.value}%`);
      }
      file.onchange = async (e) => {
        const f = e.target.files?.[0];
        e.target.value = "";
        if (!f) return;
        try {
          const source = await CapraImage.read(f);
          photo.style.backgroundImage = `url("${source}")`;
          CapraImage.persist("ladiesPhoto", source);
        } catch (error) {
          alert("Kuvaa ei voitu lukea. Kokeile JPEG- tai PNG-kuvaa.");
        }
      };
      function styleS() {
        openS(
          '<h3>Tyyli</h3><label>Pinkki<input id="pinkColor" type="color" value="#f33b8e"></label><label>Tausta<input id="backgroundColor" type="color" value="#09090b"></label><button class="btn" onclick="canvas.classList.toggle(\'safe\')">Safe area</button>',
        );
        document.getElementById("pinkColor").oninput = (e) =>
          document.documentElement.style.setProperty("--pink", e.target.value);
        document.getElementById("backgroundColor").oninput = (e) =>
          document.documentElement.style.setProperty("--bg", e.target.value);
      }
      async function exportPng() {
        sheet.classList.remove("open");
        try {
          const c = await html2canvas(canvas, {
            scale: 1,
            width: 1080,
            height: 1350,
            useCORS: true,
            backgroundColor: null,
            onclone: (clonedDocument) => {
              const exportCanvas = clonedDocument.getElementById("canvas");
              exportCanvas.style.transform = "none";
              exportCanvas.style.borderRadius = "0";
            },
          });
          const a = document.createElement("a");
          a.download = "capra-ladies.png";
          a.href = c.toDataURL("image/png");
          a.click();
        } catch (e) {
          alert("PNG-vienti ei onnistunut. Kokeile Safarissa uudelleen.");
        }
      }
      function preview() {
        app.classList.toggle("preview");
        document.body.classList.toggle(
          "previewOn",
          app.classList.contains("preview"),
        );
        sheet.classList.remove("open");
        previewButton.textContent = app.classList.contains("preview")
          ? "Muokkaa"
          : "Preview";
        setTimeout(fit, 40);
      }
      previewExitButton.onclick = preview;
      function save() {
        localStorage.setItem(
          "ladiesState",
          JSON.stringify({
            s: small.textContent,
            t: title.innerHTML,
            c: copy.textContent,
            g: tag.textContent,
          }),
        );
        alert("Tallennettu");
      }
      const ph = localStorage.getItem("ladiesPhoto");
      if (ph) photo.style.backgroundImage = `url("${ph}")`;
      const st = localStorage.getItem("ladiesState");
      if (st) {
        try {
          const x = JSON.parse(st);
          small.textContent = x.s;
          title.innerHTML = x.t;
          copy.textContent = x.c;
          tag.textContent = x.g;
        } catch (e) {}
      }
    </script>
  </body>
</html>

<!doctype html><html lang="fi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><title>Capra People Studio</title><script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script><style>:root{--o:#68724a;--g:#c8ae4d;--bg:#11120f;--fg:#f1eee6}*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;background:#090a08;color:white;font-family:-apple-system,BlinkMacSystemFont,Inter,Arial,sans-serif}body{height:100dvh;overflow:hidden}button,input,textarea{font:inherit}.app{height:100dvh;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top)}header{height:56px;display:flex;align-items:center;justify-content:space-between;padding:0 10px;background:#121410;border-bottom:1px solid #30342b}header a{color:#fff;text-decoration:none;font-size:12px;font-weight:900}.btn{border:1px solid #363b31;background:#20231d;color:#fff;border-radius:10px;padding:8px 9px;font-size:11px;font-weight:850}.gold{background:var(--g)!important;color:#111!important;border-color:var(--g)!important}.work{flex:1;min-height:0;position:relative}.viewport{height:100%;overflow:auto;padding:10px 8px 98px;display:flex;justify-content:center}.shell{width:min(100%,430px);aspect-ratio:4/5;position:relative}.canvas{position:absolute;width:1080px;height:1350px;left:0;top:0;transform-origin:0 0;overflow:hidden;background:var(--bg);border-radius:18px;box-shadow:0 16px 48px #0009}.photo{position:absolute;inset:0;background-size:cover;background-position:center}.shade{position:absolute;inset:0}.left{position:absolute;inset:0 auto 0 0;width:46%;background:#10110f}.series{position:absolute;left:56px;top:78px;color:var(--g);font-size:20px;font-weight:900;letter-spacing:.13em}.quote{position:absolute;left:56px;top:300px;width:360px;font-size:53px;line-height:1.0;font-weight:900}.name{position:absolute;left:56px;top:1010px;width:390px;color:var(--g);font-size:34px;font-weight:1000}.info{position:absolute;left:56px;top:1095px;width:390px;font-size:23px;font-weight:800;line-height:1.25}.brand{position:absolute;right:55px;bottom:60px;font-size:22px;font-weight:1000;letter-spacing:.12em}.competitor .left{display:none}.competitor .shade{background:linear-gradient(180deg,#0001,#0002 45%,#000d)}.competitor .series{left:108px;top:78px}.competitor .quote{left:70px;top:1010px;width:760px;font-size:34px;color:#111;line-height:1.15}.competitor .name{left:108px;top:690px;width:860px;color:#fff;font-size:86px;line-height:.9}.competitor .info{left:70px;top:1210px;color:#111;font-size:22px}.competitor:after{content:"";position:absolute;left:0;right:0;bottom:0;height:390px;background:var(--g);z-index:1}.competitor .series,.competitor .quote,.competitor .name,.competitor .info,.competitor .brand{z-index:2}.competitor .brand{color:#111}.toolbar{position:absolute;left:8px;right:8px;bottom:calc(8px + env(safe-area-inset-bottom));height:70px;background:#171915f8;border:1px solid #30342b;border-radius:19px;display:grid;grid-template-columns:repeat(5,1fr);padding:5px;z-index:40}.toolbar button{border:0;background:transparent;color:#ddd;font-size:10px;font-weight:800}.sheet{display:none;position:absolute;left:8px;right:8px;bottom:calc(86px + env(safe-area-inset-bottom));max-height:49dvh;overflow:auto;background:#171915fb;border:1px solid #34382f;border-radius:20px;padding:14px;z-index:39}.sheet.open{display:block}.sheet h3{font-size:11px;text-transform:uppercase;letter-spacing:.12em;color:#bbb}.sheet label{display:block;font-size:10px;color:#aaa;margin:8px 0}.sheet input,.sheet textarea{width:100%;margin-top:5px;background:#0f100e;color:#fff;border:1px solid #383c33;border-radius:10px;padding:10px}.sheet textarea{min-height:70px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:7px}.preview header,.preview .toolbar,.preview .sheet{display:none}.preview .viewport{padding:0;align-items:center;background:#000}.preview .shell{width:100vw}.preview .canvas{border-radius:0}</style></head><body><div class="app" id="app"><header><a href="../">← Tools</a><strong>CAPRA PEOPLE STUDIO</strong><div><button class="btn" onclick="save()">Save</button><button class="btn gold" id="pv" onclick="preview()">Preview</button></div></header><div class="work"><div class="viewport"><div class="shell" id="shell"><div class="canvas" id="canvas"><div class="photo" id="photo"></div><div class="shade"></div><div class="left"></div><div class="series" id="series">CAPRA / IHMISET</div><div class="quote" id="quote">“MATOLLA AJATUKSET IRTOAVAT MUUSTA ARJESTA.”</div><div class="name" id="name">TIBERIUS</div><div class="info" id="info">BJJ / NO-GI<br>HARRASTAJA</div><div class="brand">CAPRA COMBAT</div></div></div></div><div class="sheet" id="sheet"></div><div class="toolbar"><button onclick="templates()">▦<br>Template</button><button onclick="edit()">✎<br>Teksti</button><button onclick="imageS()">▧<br>Kuva</button><button onclick="styleS()">◐<br>Tyyli</button><button onclick="exportPng()">⇩<br>PNG</button></div></div></div><input id="file" type="file" accept="image/*" hidden><script>const app=document.getElementById('app'),shell=document.getElementById('shell'),canvas=document.getElementById('canvas'),sheet=document.getElementById('sheet'),photo=document.getElementById('photo');function fit(){const s=shell.clientWidth/1080;canvas.style.transform=`scale(${s})`;shell.style.height=1350*s+'px'}addEventListener('resize',fit);fit();function openS(h){sheet.innerHTML=h;sheet.classList.add('open')}function templates(){openS('<h3>Valitse pohja</h3><div class="grid"><button class="btn" onclick="usePerson()">Harrastajatarina / Tiberius</button><button class="btn gold" onclick="useComp()">Kilpailija / Elias</button></div>')}function usePerson(){canvas.classList.remove('competitor');series.textContent='CAPRA / IHMISET';quote.textContent='“MATOLLA AJATUKSET IRTOAVAT MUUSTA ARJESTA.”';name.textContent='TIBERIUS';info.innerHTML='BJJ / NO-GI<br>HARRASTAJA';sheet.classList.remove('open')}function useComp(){canvas.classList.add('competitor');series.textContent='CAPRA COMBAT · KILPAILIJAT';quote.textContent='“KEHITYS VAATII, ETTÄ TULET TAKAISIN MYÖS HUONOJEN PÄIVIEN JÄLKEEN.”';name.innerHTML='ELIAS<br>';info.textContent='POLKU HUIPULLE.';sheet.classList.remove('open')}function edit(){openS(`<h3>Tekstit</h3><label>Sarja<input id="a" value="${series.textContent}"></label><label>Nimi<textarea id="b">${name.innerText}</textarea></label><label>Sitaatti<textarea id="c">${quote.textContent}</textarea></label><label>Info<textarea id="d">${info.innerText}</textarea></label>`);a.oninput=e=>series.textContent=e.target.value;b.oninput=e=>name.innerHTML=e.target.value.replace(/\n/g,'<br>');c.oninput=e=>quote.textContent=e.target.value;d.oninput=e=>info.innerHTML=e.target.value.replace(/\n/g,'<br>')}function imageS(){openS('<h3>Kuva</h3><button class="btn gold" onclick="file.click()">Valitse henkilökuva</button><label>Pystysijainti<input id="y" type="range" min="0" max="100" value="50"></label><label>Zoom<input id="z" type="range" min="100" max="180" value="100"></label>');y.oninput=e=>photo.style.backgroundPosition=`50% ${e.target.value}%`;z.oninput=e=>photo.style.transform=`scale(${e.target.value/100})`}file.onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{photo.style.backgroundImage=`url("${r.result}")`;localStorage.setItem('peoplePhoto',r.result)};r.readAsDataURL(f)};function styleS(){openS('<h3>Tyyli</h3><label>Oliivi<input id="o1" type="color" value="#68724a"></label><label>Okra<input id="g1" type="color" value="#c8ae4d"></label>');o1.oninput=e=>document.documentElement.style.setProperty('--o',e.target.value);g1.oninput=e=>document.documentElement.style.setProperty('--g',e.target.value)}async function exportPng(){sheet.classList.remove('open');const c=await html2canvas(canvas,{scale:1,width:1080,height:1350,useCORS:true});const a=document.createElement('a');a.download='capra-people.png';a.href=c.toDataURL('image/png');a.click()}function preview(){app.classList.toggle('preview');sheet.classList.remove('open');pv.textContent=app.classList.contains('preview')?'Muokkaa':'Preview';setTimeout(fit,40)}function save(){localStorage.setItem('peopleText',JSON.stringify({cl:canvas.className,series:series.textContent,quote:quote.textContent,name:name.innerHTML,info:info.innerHTML}));alert('Tallennettu')}const ph=localStorage.getItem('peoplePhoto');if(ph)photo.style.backgroundImage=`url("${ph}")`;const s=localStorage.getItem('peopleText');if(s){try{const x=JSON.parse(s);canvas.className=x.cl;series.textContent=x.series;quote.textContent=x.quote;name.innerHTML=x.name;info.innerHTML=x.info}catch(e){}}</script></body></html>

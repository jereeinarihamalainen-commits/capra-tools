<!doctype html>
<html lang="fi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Capra Combat – junioriesite</title>
  <style>
    body{margin:0;min-height:100vh;display:grid;place-items:center;background:#10110e;color:#faf9f5;font-family:Arial,sans-serif}
    .loading{text-align:center}.loading strong{display:block;font-size:18px}.loading span{display:block;margin-top:8px;color:#aaa;font-size:13px}
  </style>
</head>
<body>
  <div class="loading"><strong>Avataan Capra junioriesitettä…</strong><span>Hetki, editori ladataan.</span></div>
  <script>
    (async()=>{
      try {
        const files=['part1.txt','part2.txt','part3.txt','part4.txt','part5.txt','part6.txt'];
        const parts=[];
        for(const file of files){
          const response=await fetch(file,{cache:'no-store'});
          if(!response.ok) throw new Error(file+' '+response.status);
          parts.push(await response.text());
        }
        document.open();
        document.write(parts.join(''));
        document.close();
      } catch(error) {
        document.body.innerHTML='<div class="loading"><strong>Editorin lataus epäonnistui</strong><span>Päivitä sivu hetken kuluttua. '+String(error)+'</span></div>';
      }
    })();
  </script>
</body>
</html>
